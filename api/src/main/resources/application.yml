spring:
  application:
    name: api
  config:
    # Catálogo de módulos contratáveis (RF-10.1), lido no boot
    import: classpath:catalogo-modulos.yml
  datasource:
    # Cada serviço tem o seu schema no PostgreSQL; o api usa "backend" (o nome do schema só muda na fase 2 da ADR 0006)
    url: ${BANCO_URL:jdbc:postgresql://localhost:5432/condominio}?currentSchema=backend
    username: ${BANCO_USUARIO:condominio}
    password: ${BANCO_SENHA:condominio}
  flyway:
    schemas: backend
    default-schema: backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.batch_size: 100
      hibernate.order_inserts: true
      hibernate.default_schema: backend
  # Thymeleaf só gera relatórios (RelatorioPdf, templates em relatorios/); o backend não tem telas
  thymeleaf:
    check-template-location: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORTA:5672}
    username: ${RABBITMQ_USUARIO:condominio}
    password: ${RABBITMQ_SENHA:condominio}
    listener:
      simple:
        # Gravação que falha volta para a fila, tenta de novo e depois vai para backend.resultados.erro
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
  security:
    oauth2:
      resourceserver:
        jwt:
          # Emissor que aparece no token (endereço que o navegador usa)
          issuer-uri: ${KEYCLOAK_EMISSOR:http://localhost:8180/realms/condominio}
          # Endereço para buscar as chaves (dentro do docker compose é http://keycloak:8080/...)
          jwk-set-uri: ${KEYCLOAK_CHAVES:http://localhost:8180/realms/condominio/protocol/openid-connect/certs}

server:
  port: ${PORTA:8081}

condominio:
  storage:
    type: local
    folder: ${PASTA_DADOS:./dados}
  processing:
    resend-after-minutes: 15
    max-attempts: 3
  grpc:
    port: ${GRPC_PORTA:9090}
  budget:
    # Diferença até este valor entre o impresso na PO e a soma é aviso de arredondamento, não divergência.
    # Os cálculos usam sempre a soma das linhas. 0.00 desliga (decisão do usuário, Q30).
    rounding-tolerance: ${PO_TOLERANCIA_ARREDONDAMENTO:0.01}
    # Sugestão do de-para pelo nome (ADR 0004, Decisão 4): comparação de texto, sem IA. Dígitos são sempre descartados.
    account-mapping:
      # Proporção mínima de palavras em comum (Jaccard) para sugerir; empate não sugere
      min-score: 0.5
      stop-words: [A, O, AS, OS, DE, DA, DO, DAS, DOS, E, C, COM, EM, NO, NA, NOS, NAS, P, PARA, POR]
      abbreviations:
        DESP: DESPESA
        DESPS: DESPESAS
        MAT: MATERIAL
        MANUT: MANUTENCAO
        SERV: SERVICO
        SERVS: SERVICOS
        REEMB: REEMBOLSO
        ADM: ADMINISTRACAO
        BANC: BANCARIA
        TRANSP: TRANSPORTE
        SIST: SISTEMA
        EQUIP: EQUIPAMENTO
  # Assistente no rag (busca nos documentos e chat, ADR 0003). O prazo vale para cada chamada ao rag.
  rag:
    grpc: ${RAG_GRPC:localhost:9091}
    timeout-seconds: ${RAG_GRPC_PRAZO_SEGUNDOS:30}
    # Perguntar (chat): o modelo pode chamar ferramentas e tentar de novo; prazo estourado = 504 na API
    question-timeout-seconds: ${RAG_GRPC_PRAZO_PERGUNTA_SEGUNDOS:120}
    # Catálogo de provedores e chave pública do rag (ListarProvedores), guardado em memória por este tempo
    catalog-cache-seconds: ${RAG_CATALOGO_CACHE_SEGUNDOS:300}
  assistente:
    # Trocas anteriores da conversa mandadas ao rag em cada pergunta (o histórico só existe na tela, Q10)
    historico-trocas: ${ASSISTENTE_HISTORICO_TROCAS:6}

management:
  endpoints:
    web:
      exposure:
        include: health,info
