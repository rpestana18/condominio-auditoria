# Catálogo de módulos contratáveis por condomínio (RF-10.1; ADR 0003, Decisão 4). Versionado junto com o código.
# Um módulo novo é uma entrada aqui mais a verificação FeatureService.require(condominiumId, CODE) nos pontos que ele inclui;
# o mecanismo de ligar, desligar, trilha e uso não muda. Mudou o catálogo? Suba a versão.
# O que não está em nenhum módulo é o núcleo, sempre ligado.
catalogo-modulos:
  version: 1
  features:
    - code: ASSISTANT
      name: Assistente
      description: >-
        Busca nos documentos enviados e, a partir da entrega 3, chat sobre eles, sempre com citação de arquivo e
        localização (RF-04).
      includes:
        - Indexação dos arquivos enviados para a busca (fila rag.indexing), inclusive ao ligar o módulo
        - Busca nos documentos por palavra e por significado
        - Ferramenta buscar_documentos no MCP (rpc SearchDocuments)
        - Tela "Assistente" com chat sobre os documentos (previsto, entrega 3)
        - Registro de uso (indexação, buscas e chamadas)
      depends-on: []
      # Condomínio novo começa com o Assistente desligado; o piloto foi ligado na migração V11 (Q15)
      enabled-by-default: false
