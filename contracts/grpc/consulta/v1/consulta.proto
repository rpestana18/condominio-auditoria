// Contrato gRPC de consulta do backend. Quem chama: o serviço mcp (e, no futuro, outros serviços internos).
// O token do usuário (Keycloak) vai no metadado "authorization: Bearer ...": o backend aplica perfil e condomínio
// em toda chamada, do mesmo jeito que na API REST.
//
// Dinheiro é texto com duas casas ("1234.56"): protobuf não tem decimal exato e nunca usamos ponto flutuante.
// Datas são texto ISO ("2026-09-30").
syntax = "proto3";

package condominio.consulta.v1;

option java_multiple_files = true;
option java_package = "br.com.condominioauditoria.contratos.consulta.v1";
option java_outer_classname = "ConsultaProto";

service Consulta {
  // Condomínios que o usuário do token pode ver.
  rpc ListarCondominios(ListarCondominiosRequest) returns (ListarCondominiosResponse);

  // Saldos por fundo no fluxo de caixa mais recente (o mesmo número da tela inicial).
  rpc ResumoFundos(ResumoFundosRequest) returns (ResumoFundosResponse);

  // Arquivos enviados, do mais recente para o mais antigo.
  rpc ListarArquivos(ListarArquivosRequest) returns (ListarArquivosResponse);

  // Conferências aritméticas de um arquivo lido.
  rpc ConferenciasDoArquivo(ConferenciasDoArquivoRequest) returns (ConferenciasDoArquivoResponse);

  // Lançamentos com filtros. Resposta em fluxo (stream): milhares de linhas sem montar tudo na memória.
  rpc ListarLancamentos(ListarLancamentosRequest) returns (stream Lancamento);
}

message ListarCondominiosRequest {}

message ListarCondominiosResponse {
  repeated CondominioResumo condominios = 1;
}

message CondominioResumo {
  string id = 1;
  string nome = 2;
}

message ResumoFundosRequest {
  string condominio_id = 1;
}

message ResumoFundosResponse {
  // Vazio quando ainda não há fluxo de caixa lido.
  bool tem_dados = 1;
  string arquivo_id = 2;
  string arquivo_nome = 3;
  string periodo_inicio = 4;
  string periodo_fim = 5;
  string saldo_anterior = 6;
  string entradas = 7;
  string saidas = 8;
  string saldo_atual = 9;
  int32 conferencias_com_falha = 10;
  repeated FundoNoPeriodo fundos = 11;
}

message FundoNoPeriodo {
  string fundo = 1;
  string saldo_anterior = 2;
  string entradas = 3;
  string saidas = 4;
  string saldo_atual = 5;
}

message ListarArquivosRequest {
  string condominio_id = 1;
  // Opcional: BALANCETE, EXTRATO, PO, CONTRATO, FOLHA, COMPROVANTE, ATA, CONVENCAO_RI, OUTROS.
  string categoria = 2;
  // Opcional: padrão 50.
  int32 limite = 3;
}

message ListarArquivosResponse {
  repeated ArquivoResumo arquivos = 1;
}

message ArquivoResumo {
  string id = 1;
  string categoria = 2;
  string nome = 3;
  string status = 4;
  string mensagem = 5;
  string periodo_inicio = 6;
  string periodo_fim = 7;
  int32 total_lancamentos = 8;
  string enviado_por = 9;
  string enviado_em = 10;
}

message ConferenciasDoArquivoRequest {
  string condominio_id = 1;
  string arquivo_id = 2;
}

message ConferenciasDoArquivoResponse {
  repeated Conferencia conferencias = 1;
}

message Conferencia {
  string codigo = 1;
  string descricao = 2;
  bool ok = 3;
  string detalhe = 4;
}

message ListarLancamentosRequest {
  string condominio_id = 1;
  // Todos os filtros abaixo são opcionais.
  string data_inicio = 2;
  string data_fim = 3;
  // Parte do nome do fundo, sem diferenciar maiúsculas.
  string fundo = 4;
  // Parte do histórico, do fornecedor ou da conta.
  string texto = 5;
  // Só saídas (débitos), sem transferências entre fundos.
  bool somente_saidas = 6;
  // Padrão 500, máximo 5000.
  int32 limite = 7;
}

message Lancamento {
  string data = 1;
  string fundo = 2;
  string conta_codigo = 3;
  string conta_nome = 4;
  string documento = 5;
  string historico = 6;
  string credito = 7;
  string debito = 8;
  string saldo = 9;
  string fornecedor = 10;
  string nota_fiscal = 11;
  string meio_pagamento = 12;
  bool transferencia_entre_fundos = 13;
  // Origem: arquivo e página, para o usuário conferir no PDF.
  string arquivo_id = 14;
  int32 pagina = 15;
}
