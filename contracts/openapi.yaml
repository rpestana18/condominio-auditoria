openapi: 3.1.0
info:
  title: Auditoria do Condomínio – API
  version: 0.1.0
  description: |
    Contrato entre backend, frontend e MCP. Toda chamada exige token Bearer do Keycloak.
    Perfis: USUARIO (consulta), GESTOR (+ envia arquivos), ADMIN (tudo).
    Valores monetários são números com 2 casas decimais; datas em ISO 8601.
servers:
  - url: /api
security:
  - bearer: []
paths:
  /eu:
    get:
      summary: Usuário logado, perfis e condomínios visíveis
      operationId: eu
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UsuarioLogado" } } } }
  /categorias:
    get:
      summary: Categorias de arquivo, na ordem da tela
      operationId: categorias
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CategoriaDto" } } } }
  /condominios/{condominioId}/arquivos:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }]
    get:
      summary: Arquivos do mais recente para o mais antigo
      operationId: listarArquivos
      parameters:
        - { name: categoria, in: query, required: false, schema: { $ref: "#/components/schemas/Categoria" } }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ArquivoResumo" } } } }
    post:
      summary: Envia um arquivo (GESTOR ou ADMIN). O processamento segue em segundo plano.
      operationId: enviarArquivo
      parameters:
        - { name: categoria, in: query, required: true, schema: { $ref: "#/components/schemas/Categoria" } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [arquivo]
              properties: { arquivo: { type: string, format: binary } }
      responses:
        "202": { description: Recebido e na fila, content: { application/json: { schema: { $ref: "#/components/schemas/ArquivoResumo" } } } }
        "403": { description: Perfil sem permissão }
        "409": { description: Arquivo já enviado (mesmo conteúdo), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problema" } } } }
  /condominios/{condominioId}/arquivos/ultimo:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }]
    get:
      summary: Último arquivo enviado (indicador no canto da tela)
      operationId: ultimoArquivo
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ArquivoResumo" } } } }
        "204": { description: Nenhum arquivo ainda }
  /condominios/{condominioId}/arquivos/{id}:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }, { $ref: "#/components/parameters/ArquivoId" }]
    get:
      summary: Detalhe com conferências e saldos por fundo
      operationId: detalheArquivo
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ArquivoDetalhe" } } } }
        "404": { description: Não encontrado }
  /condominios/{condominioId}/arquivos/{id}/conteudo:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }, { $ref: "#/components/parameters/ArquivoId" }]
    get:
      summary: Arquivo original, exatamente como foi enviado
      operationId: conteudoArquivo
      responses:
        "200": { description: O arquivo, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
  /condominios/{condominioId}/arquivos/{id}/reprocessar:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }, { $ref: "#/components/parameters/ArquivoId" }]
    post:
      summary: Coloca o arquivo de novo na fila (GESTOR ou ADMIN). Não duplica dados.
      operationId: reprocessarArquivo
      responses:
        "202": { description: Na fila, content: { application/json: { schema: { $ref: "#/components/schemas/ArquivoResumo" } } } }
        "409": { description: Já está em processamento }
  /condominios/{condominioId}/arquivos/{id}/categoria:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }, { $ref: "#/components/parameters/ArquivoId" }]
    put:
      summary: Troca a categoria e reprocessa o arquivo (GESTOR ou ADMIN, RF-01.7). Mesma categoria não faz nada.
      operationId: alterarCategoriaArquivo
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NovaCategoria" } } }
      responses:
        "200": { description: Categoria trocada (arquivo na fila de novo), content: { application/json: { schema: { $ref: "#/components/schemas/ArquivoResumo" } } } }
        "400": { description: Categoria não informada ou inválida }
        "403": { description: Perfil sem permissão }
        "404": { description: Não encontrado }
        "409": { description: Já está em processamento }
  /condominios/{condominioId}/painel:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }]
    get:
      summary: Números da tela inicial, do fluxo de caixa mais recente
      operationId: painel
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Painel" } } } }
        "204": { description: Ainda não há fluxo de caixa processado }
  /condominios/{condominioId}/fundo-ordinario:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }]
    put:
      summary: Confirma qual fundo é o ordinário do condomínio (GESTOR ou ADMIN)
      operationId: confirmarFundoOrdinario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fundoId]
              properties: { fundoId: { type: string, format: uuid } }
      responses:
        "204": { description: Confirmado }
        "403": { description: Perfil sem permissão }
        "404": { description: Fundo não é deste condomínio }
  /condominios/{condominioId}/previsoes:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }]
    get:
      summary: POs lidas do condomínio, da mais recente para a mais antiga (todos os perfis, RF-03.1.1)
      operationId: listarPrevisoes
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PrevisaoResumo" } } } }
        "403": { description: Sem acesso ao condomínio }
  /condominios/{condominioId}/previsoes/{poId}:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }, { $ref: "#/components/parameters/PoId" }]
    get:
      summary: PO com linhas, conferências, avisos e pendências (todos os perfis, RF-03.1.1 e RF-03.1.2)
      operationId: detalhePrevisao
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PrevisaoDetalhe" } } } }
        "403": { description: Sem acesso ao condomínio }
        "404": { description: Não encontrada }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    CondominioId: { name: condominioId, in: path, required: true, schema: { type: string, format: uuid } }
    ArquivoId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    PoId: { name: poId, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    Categoria:
      type: string
      enum: [BALANCETE, EXTRATO, PO, CONTRATO, FOLHA, COMPROVANTE, ATA, CONVENCAO_RI, OUTROS]
    NovaCategoria:
      type: object
      required: [categoria]
      properties:
        categoria: { $ref: "#/components/schemas/Categoria" }
    StatusArquivo:
      type: string
      enum: [PENDENTE, PROCESSANDO, CONCLUIDO, PRECISA_REVISAO, FALHOU]
    CategoriaDto:
      type: object
      required: [codigo, rotulo]
      properties:
        codigo: { $ref: "#/components/schemas/Categoria" }
        rotulo: { type: string }
    UsuarioLogado:
      type: object
      required: [usuario, nome, perfis, condominios]
      properties:
        usuario: { type: string }
        nome: { type: string }
        perfis: { type: array, items: { type: string, enum: [USUARIO, GESTOR, ADMIN] } }
        condominios:
          type: array
          items:
            type: object
            required: [id, nome]
            properties: { id: { type: string, format: uuid }, nome: { type: string } }
    ArquivoResumo:
      type: object
      required: [id, categoria, categoriaRotulo, nome, tamanhoBytes, status, enviadoPor, enviadoEm]
      properties:
        id: { type: string, format: uuid }
        categoria: { $ref: "#/components/schemas/Categoria" }
        categoriaRotulo: { type: string }
        nome: { type: string }
        tamanhoBytes: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/StatusArquivo" }
        mensagem: { type: [string, "null"] }
        periodoInicio: { type: [string, "null"], format: date }
        periodoFim: { type: [string, "null"], format: date }
        totalLancamentos: { type: [integer, "null"] }
        enviadoPor: { type: string }
        enviadoEm: { type: string, format: date-time }
        processadoEm: { type: [string, "null"], format: date-time }
    ArquivoDetalhe:
      type: object
      required: [arquivo, sha256, conferencias, fundos]
      properties:
        arquivo: { $ref: "#/components/schemas/ArquivoResumo" }
        sha256: { type: string }
        conferencias:
          type: array
          items:
            type: object
            required: [codigo, descricao, ok]
            properties:
              codigo: { type: string }
              descricao: { type: string }
              ok: { type: boolean }
              detalhe: { type: [string, "null"] }
        fundos:
          type: array
          items:
            type: object
            required: [fundo, saldoAnterior, creditos, debitos, saldoAtual]
            properties:
              fundo: { type: string }
              saldoAnterior: { type: number }
              creditos: { type: number }
              debitos: { type: number }
              saldoAtual: { type: number }
    Painel:
      type: object
      required: [arquivoId, arquivoNome, periodoInicio, periodoFim, saldoAnterior, entradas, saidas, saldoAtual, conferenciasComFalha, fundoOrdinario, fundos, maioresDespesas]
      properties:
        arquivoId: { type: string, format: uuid }
        arquivoNome: { type: string }
        periodoInicio: { type: string, format: date }
        periodoFim: { type: string, format: date }
        saldoAnterior: { type: number }
        entradas: { type: number }
        saidas: { type: number }
        saldoAtual: { type: number }
        conferenciasComFalha: { type: integer }
        fundoOrdinario:
          description: |
            Saldo acumulado do fundo ordinário (cartão "Saldo acumulado"). Com confirmado=false é só a sugestão
            (fundo com mais entradas no mês), que a tela mostra para o Gestor confirmar. Nulo quando não há sugestão.
          oneOf:
            - type: "null"
            - type: object
              required: [fundoId, fundo, confirmado, saldoAtual]
              properties:
                fundoId: { type: string, format: uuid }
                fundo: { type: string }
                confirmado: { type: boolean }
                saldoAtual: { type: [number, "null"], description: Nulo quando o fundo confirmado não está no relatório }
        fundos:
          type: array
          items:
            type: object
            required: [fundoId, fundo, saldoAnterior, entradas, saidas, resultado, saldoAtual]
            properties:
              fundoId: { type: string, format: uuid }
              fundo: { type: string }
              saldoAnterior: { type: number }
              entradas: { type: number }
              saidas: { type: number }
              resultado: { type: number }
              saldoAtual: { type: number }
        maioresDespesas:
          type: array
          items:
            type: object
            required: [data, fundo, conta, historico, valor, pagina]
            properties:
              data: { type: string, format: date }
              fundo: { type: string }
              conta: { type: string }
              historico: { type: string }
              valor: { type: number }
              pagina: { type: integer }
    EstadoPrevisao:
      type: string
      description: |
        LIDA (aguarda confirmação), LIDA_COM_DIVERGENCIA (soma que não bate além da tolerância de arredondamento),
        CONFIRMADA (vale para os meses do exercício) e SUBSTITUIDA (trocada por reaprovação a partir de um mês).
      enum: [LIDA, LIDA_COM_DIVERGENCIA, CONFIRMADA, SUBSTITUIDA]
    PrevisaoResumo:
      type: object
      required: [id, arquivoId, sha256, estado, previstoMes, lidaEm]
      properties:
        id: { type: string, format: uuid }
        arquivoId: { type: string, format: uuid }
        arquivoNome: { type: [string, "null"] }
        sha256: { type: string }
        estado: { $ref: "#/components/schemas/EstadoPrevisao" }
        versao: { type: [integer, "null"], description: Preenchida na confirmação (1, 2, ... por reaprovação) }
        titulo: { type: [string, "null"] }
        exercicioImpresso: { type: [string, "null"], description: Como impresso (ex. "2026 / 2027") }
        exercicioInicio: { type: [string, "null"], pattern: "^[0-9]{4}-[0-9]{2}$", description: AAAA-MM, informado na confirmação }
        exercicioFim: { type: [string, "null"], pattern: "^[0-9]{4}-[0-9]{2}$" }
        totalImpresso: { type: [number, "null"] }
        previstoMes: { type: number, description: Soma das linhas dos grupos que não são fundos (usada nos cálculos) }
        lidaEm: { type: string, format: date-time }
        confirmadaPor: { type: [string, "null"] }
        confirmadaEm: { type: [string, "null"], format: date-time }
    PrevisaoDetalhe:
      type: object
      required: [previsao, toleranciaArredondamento, linhas, conferencias, avisos, codigosRepetidos, fundos, achados]
      properties:
        previsao: { $ref: "#/components/schemas/PrevisaoResumo" }
        colunaOrcadoAnterior: { type: [string, "null"] }
        colunaOrcado: { type: [string, "null"] }
        previstoMesImpresso: { type: [number, "null"], description: Total impresso menos fundos impressos }
        toleranciaArredondamento: { type: number, description: Diferença máxima tratada como arredondamento nesta leitura }
        substituidaDesde: { type: [string, "null"], pattern: "^[0-9]{4}-[0-9]{2}$", description: Mês a partir do qual vale a nova versão }
        confirmacao:
          description: Dados informados pelo Admin; nulo antes da confirmação
          oneOf:
            - type: "null"
            - type: object
              required: [semAta, cienteDivergencia]
              properties:
                ataArquivoId: { type: [string, "null"], format: uuid }
                semAta: { type: boolean }
                dataAprovacao: { type: [string, "null"], format: date }
                cienteDivergencia: { type: boolean }
                justificativaDivergencia: { type: [string, "null"] }
        linhas: { type: array, items: { $ref: "#/components/schemas/LinhaPo" } }
        conferencias: { type: array, items: { $ref: "#/components/schemas/ConferenciaPo" } }
        avisos: { type: array, items: { $ref: "#/components/schemas/AvisoPo" } }
        codigosRepetidos:
          type: array
          items:
            type: object
            required: [codigoImpresso, resolvido, linhas]
            properties:
              codigoImpresso: { type: string }
              resolvido: { type: boolean, description: Os códigos efetivos dessas linhas já são distintos }
              linhas:
                type: array
                items:
                  type: object
                  required: [linhaId, ordem, descricao, codigoEfetivo]
                  properties:
                    linhaId: { type: string, format: uuid }
                    ordem: { type: integer }
                    descricao: { type: string }
                    codigoEfetivo: { type: string }
        fundos:
          type: array
          description: Ligação das linhas de fundo (1.9.x) aos fundos do fluxo, feita na confirmação
          items:
            type: object
            required: [linhaId, codigoEfetivo, descricao, orcado, fundoId, fundo]
            properties:
              linhaId: { type: string, format: uuid }
              codigoEfetivo: { type: string }
              descricao: { type: string }
              orcado: { type: number }
              fundoId: { type: string, format: uuid }
              fundo: { type: string }
        achados:
          type: array
          items:
            type: object
            required: [id, regra, versaoRegra, severidade, competencia, descricao, estado]
            properties:
              id: { type: string, format: uuid }
              regra: { type: string }
              versaoRegra: { type: string }
              severidade: { type: string, enum: [INFORMATIVO, ATENCAO, CRITICO] }
              competencia: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
              descricao: { type: string }
              estado: { type: string, enum: [ABERTO] }
    LinhaPo:
      type: object
      required: [id, ordem, pagina, tipo, codigoImpresso, codigoEfetivo, descricao, orcadoAnterior, orcado, linhaDeFundo, arquivoId, sha256]
      properties:
        id: { type: string, format: uuid, description: Identificador estável da linha (destino do de-para) }
        ordem: { type: integer }
        pagina: { type: integer }
        tipo: { type: string, enum: [TOTAL, GRUPO, LINHA] }
        codigoImpresso: { type: string }
        codigoEfetivo: { type: string, description: Igual ao impresso; o Admin muda só quando o código se repete }
        conta: { type: [string, "null"] }
        contaTexto: { type: [string, "null"] }
        marca: { type: [string, "null"], enum: [RATEIO_A_PARTE, NEGOCIADA_ISENCAO, SEM_VALOR, VALOR_FIXO_SEM_REFERENCIA, null] }
        descricao: { type: string }
        orcadoAnterior: { type: number }
        orcado: { type: number }
        percentualTexto: { type: [string, "null"], description: Coluna "%" como lida; não entra em cálculo }
        observacoes: { type: [string, "null"] }
        linhaDeFundo: { type: boolean, description: Linha do grupo de fundos (precisa ser ligada a um fundo na confirmação) }
        arquivoId: { type: string, format: uuid }
        sha256: { type: string }
    ConferenciaPo:
      type: object
      required: [codigo, descricao, ok, classificacao]
      properties:
        codigo: { type: string }
        descricao: { type: string }
        ok: { type: boolean }
        detalhe: { type: [string, "null"] }
        classificacao:
          type: string
          description: OK; ARREDONDAMENTO (diferença até a tolerância, só aviso); DIVERGENCIA; CODIGO_REPETIDO (pendência)
          enum: [OK, ARREDONDAMENTO, DIVERGENCIA, CODIGO_REPETIDO]
        explicacao: { type: [string, "null"], description: Quando falhou, as duas somas }
    AvisoPo:
      type: object
      required: [codigo, texto]
      properties:
        codigo:
          type: string
          enum: [ARREDONDAMENTO, DIVERGENCIA, CODIGO_REPETIDO, CONFIRMADA_COM_DIVERGENCIA, FORA_PRIMEIRO_TRIMESTRE, SEM_ATA, REGRA_NAO_AVALIADA]
        texto: { type: string }
    Problema:
      type: object
      properties:
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        arquivoExistenteId: { type: string, format: uuid }
