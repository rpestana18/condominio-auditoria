openapi: 3.1.0
info:
  title: Auditoria do Condomínio – API
  version: 0.1.0
  description: |
    Contrato entre backend, frontend e MCP. Toda chamada exige token Bearer do Keycloak.
    Perfis: USUARIO (consulta), GESTOR (+ envia arquivos), ADMIN (tudo).
    Valores monetários são números com 2 casas decimais; datas em ISO 8601.
servers:
  - url: /api
security:
  - bearer: []
paths:
  /eu:
    get:
      summary: Usuário logado, perfis e condomínios visíveis
      operationId: eu
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UsuarioLogado" } } } }
  /categorias:
    get:
      summary: Categorias de arquivo, na ordem da tela
      operationId: categorias
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CategoriaDto" } } } }
  /condominios/{condominioId}/arquivos:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }]
    get:
      summary: Arquivos do mais recente para o mais antigo
      operationId: listarArquivos
      parameters:
        - { name: categoria, in: query, required: false, schema: { $ref: "#/components/schemas/Categoria" } }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ArquivoResumo" } } } }
    post:
      summary: Envia um arquivo (GESTOR ou ADMIN). O processamento segue em segundo plano.
      operationId: enviarArquivo
      parameters:
        - { name: categoria, in: query, required: true, schema: { $ref: "#/components/schemas/Categoria" } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [arquivo]
              properties: { arquivo: { type: string, format: binary } }
      responses:
        "202": { description: Recebido e na fila, content: { application/json: { schema: { $ref: "#/components/schemas/ArquivoResumo" } } } }
        "403": { description: Perfil sem permissão }
        "409": { description: Arquivo já enviado (mesmo conteúdo), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problema" } } } }
  /condominios/{condominioId}/arquivos/ultimo:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }]
    get:
      summary: Último arquivo enviado (indicador no canto da tela)
      operationId: ultimoArquivo
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ArquivoResumo" } } } }
        "204": { description: Nenhum arquivo ainda }
  /condominios/{condominioId}/arquivos/{id}:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }, { $ref: "#/components/parameters/ArquivoId" }]
    get:
      summary: Detalhe com conferências e saldos por fundo
      operationId: detalheArquivo
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ArquivoDetalhe" } } } }
        "404": { description: Não encontrado }
  /condominios/{condominioId}/arquivos/{id}/conteudo:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }, { $ref: "#/components/parameters/ArquivoId" }]
    get:
      summary: Arquivo original, exatamente como foi enviado
      operationId: conteudoArquivo
      responses:
        "200": { description: O arquivo, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
  /condominios/{condominioId}/arquivos/{id}/reprocessar:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }, { $ref: "#/components/parameters/ArquivoId" }]
    post:
      summary: Coloca o arquivo de novo na fila de leitura e, com o módulo Assistente ligado, de indexação (GESTOR ou ADMIN). Não duplica dados.
      operationId: reprocessarArquivo
      responses:
        "202": { description: Na fila, content: { application/json: { schema: { $ref: "#/components/schemas/ArquivoResumo" } } } }
        "409": { description: Já está em processamento }
  /condominios/{condominioId}/arquivos/{id}/categoria:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }, { $ref: "#/components/parameters/ArquivoId" }]
    put:
      summary: Troca a categoria e reprocessa o arquivo (GESTOR ou ADMIN, RF-01.7). Mesma categoria não faz nada.
      operationId: alterarCategoriaArquivo
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NovaCategoria" } } }
      responses:
        "200": { description: Categoria trocada (arquivo na fila de novo), content: { application/json: { schema: { $ref: "#/components/schemas/ArquivoResumo" } } } }
        "400": { description: Categoria não informada ou inválida }
        "403": { description: Perfil sem permissão }
        "404": { description: Não encontrado }
        "409": { description: Já está em processamento }
  /condominios/{condominioId}/painel:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }]
    get:
      summary: Números da tela inicial, do fluxo de caixa mais recente
      operationId: painel
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Painel" } } } }
        "204": { description: Ainda não há fluxo de caixa processado }
  /condominios/{condominioId}/fundo-ordinario:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }]
    put:
      summary: Confirma qual fundo é o ordinário do condomínio (GESTOR ou ADMIN)
      operationId: confirmarFundoOrdinario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fundoId]
              properties: { fundoId: { type: string, format: uuid } }
      responses:
        "204": { description: Confirmado }
        "403": { description: Perfil sem permissão }
        "404": { description: Fundo não é deste condomínio }
  /condominios/{condominioId}/contexto:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }]
    get:
      summary: Contexto do condomínio para montar a tela (módulos ligados). Qualquer perfil com acesso ao condomínio.
      description: |
        O menu "Assistente" depende de ASSISTENTE estar em modulosLigados (RF-10.2, RF-10.3). Ligar ou desligar vale
        no próximo carregamento, sem reinício. O modo de IA do assistente entra aqui na configuração de IA (ADR 0003).
      operationId: contextoCondominio
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ContextoCondominio" } } } }
        "403": { description: Sem acesso a este condomínio }
        "404": { description: Condomínio não encontrado }
  /condominios/{condominioId}/modulos:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }]
    get:
      summary: Catálogo de módulos com o estado no condomínio (RF-10.1). Qualquer perfil com acesso; só leitura.
      operationId: listarModulos
      responses:
        "200":
          description: OK, na ordem do catálogo
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ModuloDoCondominio" } } } }
        "403": { description: Sem acesso a este condomínio }
  /condominios/{condominioId}/modulos/{codigo}:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }, { $ref: "#/components/parameters/CodigoModulo" }]
    put:
      summary: Liga ou desliga um módulo no condomínio (só ADMIN, o administrador da plataforma no MVP; RF-10.2)
      description: |
        Grava o estado e um evento na trilha de ativação (só de inclusão), com motivo opcional. Pedir o estado que
        já vale não faz nada (nenhum evento). Ligar o ASSISTENTE coloca todos os arquivos do condomínio na fila de
        indexação depois da resposta (RF-10.4); desligar não apaga índice nem originais (RF-10.5).
      operationId: alterarModulo
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AlteracaoModulo" } } }
      responses:
        "200": { description: Estado depois da alteração, content: { application/json: { schema: { $ref: "#/components/schemas/ModuloDoCondominio" } } } }
        "400": { description: Estado não informado ou motivo acima de 500 caracteres, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problema" } } } }
        "403": { description: Perfil sem permissão }
        "404": { description: Módulo fora do catálogo ou condomínio não encontrado }
  /condominios/{condominioId}/modulos/{codigo}/eventos:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }, { $ref: "#/components/parameters/CodigoModulo" }]
    get:
      summary: Trilha de ativação do módulo no condomínio, da mais antiga para a mais recente (só ADMIN; RF-10.6)
      operationId: eventosModulo
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/EventoModulo" } } } }
        "403": { description: Perfil sem permissão }
        "404": { description: Módulo fora do catálogo }
  /condominios/{condominioId}/modulos/{codigo}/periodos:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }, { $ref: "#/components/parameters/CodigoModulo" }]
    get:
      summary: Períodos ativos do módulo no condomínio, calculados da trilha (só ADMIN; RF-10.6)
      operationId: periodosModulo
      responses:
        "200":
          description: OK, do mais antigo para o mais recente
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PeriodoAtivo" } } } }
        "403": { description: Perfil sem permissão }
        "404": { description: Módulo fora do catálogo }
  /condominios/{condominioId}/uso:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }]
    get:
      summary: Uso dos módulos no período, por função e por mês (só ADMIN no MVP; RF-09.7, Q17)
      description: Datas no fuso de Brasília, fim incluído. Sem custo nesta fase.
      operationId: usoModulos
      parameters:
        - { name: inicio, in: query, required: true, schema: { type: string, format: date } }
        - { name: fim, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UsoDoPeriodo" } } } }
        "400": { description: Datas ausentes ou início depois do fim }
        "403": { description: Perfil sem permissão }
  /condominios/{condominioId}/uso/exportacao:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }]
    get:
      summary: Exporta os períodos ativos e o uso do período em Excel (só ADMIN; RF-10.6, RF-09.7)
      description: |
        Arquivo .xlsx com duas abas: "Períodos ativos" (os que tocam o período pedido) e "Uso por mês". Datas no
        horário de Brasília. Sem valores de cobrança nesta fase.
      operationId: exportarUsoModulos
      parameters:
        - { name: inicio, in: query, required: true, schema: { type: string, format: date } }
        - { name: fim, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200": { description: Planilha Excel, content: { application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } } } }
        "400": { description: Datas ausentes ou início depois do fim }
        "403": { description: Perfil sem permissão }
  /condominios/{condominioId}/previsoes:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }]
    get:
      summary: POs lidas do condomínio, da mais recente para a mais antiga (todos os perfis, RF-03.1.1)
      operationId: listarPrevisoes
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PrevisaoResumo" } } } }
        "403": { description: Sem acesso ao condomínio }
  /condominios/{condominioId}/previsoes/{poId}:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }, { $ref: "#/components/parameters/PoId" }]
    get:
      summary: PO com linhas, conferências, avisos e pendências (todos os perfis, RF-03.1.1 e RF-03.1.2)
      operationId: detalhePrevisao
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PrevisaoDetalhe" } } } }
        "403": { description: Sem acesso ao condomínio }
        "404": { description: Não encontrada }
  /condominios/{condominioId}/previsoes/{poId}/confirmacao:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }, { $ref: "#/components/parameters/PoId" }]
    post:
      summary: Confirma a PO e o exercício (só ADMIN, RF-03.1.3; ciente da divergência, Q29)
      description: |
        Registra exercício, ata (ou "sem ata"), código efetivo das linhas com código impresso repetido e a ligação de
        cada linha de fundo (1.9.x) a um fundo do fluxo. Os valores lidos nunca são editados. PO lida com divergência
        de soma só é confirmada com cienteDivergencia e justificativa. Só uma PO vale para cada mês: sobreposição com
        PO confirmada exige reaprovacao (a anterior passa a SUBSTITUIDA a partir do início da nova).
        Fundo de reserva acima do teto (Conv. 20.1) gera achado ATENCAO; aprovação fora do 1º trimestre gera só aviso.
      operationId: confirmarPrevisao
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PedidoConfirmacao" } } }
      responses:
        "200": { description: Confirmada, content: { application/json: { schema: { $ref: "#/components/schemas/PrevisaoDetalhe" } } } }
        "403": { description: Perfil sem permissão (Gestor e Usuário) ou sem acesso ao condomínio }
        "404": { description: PO não encontrada }
        "409": { description: PO já confirmada ou outra PO confirmada vale nos mesmos meses, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problema" } } } }
        "422": { description: Confirmação recusada (lista em motivos), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problema" } } } }
  /condominios/{condominioId}/previsoes/{poId}/depara:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }, { $ref: "#/components/parameters/PoId" }]
    get:
      summary: De-para das contas do fluxo nesta versão da PO (todos os perfis, RF-03.1.4 e RF-03.1.13)
      description: |
        Contas do fluxo com débito no fundo Condomínio no exercício da PO, mais as contas que já têm de-para.
        Conta sem de-para tem estado nulo. Só CONFIRMADO entra no previsto × realizado.
      operationId: listarDepara
      parameters:
        - name: filtro
          in: query
          required: false
          schema: { $ref: "#/components/schemas/FiltroDepara" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DeparaLista" } } } }
        "403": { description: Sem acesso ao condomínio }
        "404": { description: PO não encontrada }
  /condominios/{condominioId}/previsoes/{poId}/depara/{conta}:
    parameters:
      - { $ref: "#/components/parameters/CondominioId" }
      - { $ref: "#/components/parameters/PoId" }
      - { name: conta, in: path, required: true, description: Código da conta do fluxo como impresso (ex. 0028), schema: { type: string, pattern: "^[0-9]{1,20}$" } }
    put:
      summary: Admin escolhe o destino de uma conta (só ADMIN, RF-03.1.4 e RF-03.1.5)
      description: |
        Destino LINHA_PO aponta para uma linha de despesa da PO (grupos 1.1 a 1.8) pelo id, nunca pela conta da PO.
        Com confirmar nulo ou true, o de-para fica CONFIRMADO; com false, SUGERIDO. A trilha registra o destino e o
        estado anteriores e novos.
      operationId: definirDepara
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PedidoDestino" } } }
      responses:
        "200": { description: Gravado, content: { application/json: { schema: { $ref: "#/components/schemas/ContaDepara" } } } }
        "403": { description: Perfil sem permissão (Gestor e Usuário) ou sem acesso ao condomínio }
        "404": { description: PO não encontrada }
        "409": { description: PO ainda não confirmada }
        "422": { description: Destino inválido (linha de outra PO, de fundo, de total ou de grupo) }
  /condominios/{condominioId}/previsoes/{poId}/depara/lote:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }, { $ref: "#/components/parameters/PoId" }]
    post:
      summary: Confirma ou recusa várias contas de uma vez (só ADMIN, RF-03.1.13), um evento por conta
      operationId: loteDepara
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PedidoLote" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ResultadoLote" } } } }
        "403": { description: Perfil sem permissão ou sem acesso ao condomínio }
        "404": { description: PO não encontrada }
        "409": { description: PO ainda não confirmada }
  /condominios/{condominioId}/previsoes/{poId}/depara/sugestoes:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }, { $ref: "#/components/parameters/PoId" }]
    post:
      summary: Gera sugestões para as contas sem de-para (só ADMIN, RF-03.1.5), sem IA
      description: |
        Primeiro a versão anterior da PO (só o que estava confirmado; linha igual = mesmo código efetivo, conta e
        descrição), depois a comparação de nomes (sem dígitos, sem acento; nota mínima configurável; empate não
        sugere). Tudo entra SUGERIDO, com o motivo. Nenhuma conta é confirmada e nenhum número muda.
      operationId: sugerirDepara
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ResultadoSugestoes" } } } }
        "403": { description: Perfil sem permissão ou sem acesso ao condomínio }
        "404": { description: PO não encontrada }
        "409": { description: PO ainda não confirmada }
  /condominios/{condominioId}/previsoes/{poId}/depara/planilha:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }, { $ref: "#/components/parameters/PoId" }]
    post:
      summary: Carrega a planilha de sugestões (CSV "conta do fluxo;linha da PO"), só ADMIN (RF-03.1.5)
      description: |
        Formato do mapa do piloto, separado por ponto e vírgula, com ou sem cabeçalho, UTF-8 ou Windows-1252. Destino:
        código efetivo de uma linha de despesa, "AJUSTE (...)", "REALOCAR (...)" ou "TRANSFERENCIA (...)". Tudo entra
        SUGERIDO; conta já confirmada não muda; linha inválida é listada e não entra.
      operationId: planilhaDepara
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [arquivo]
              properties: { arquivo: { type: string, format: binary } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ResultadoPlanilha" } } } }
        "403": { description: Perfil sem permissão ou sem acesso ao condomínio }
        "404": { description: PO não encontrada }
        "409": { description: PO ainda não confirmada }
        "413": { description: Planilha acima de 1 MB }
  /condominios/{condominioId}/previsoes/{poId}/depara/eventos:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }, { $ref: "#/components/parameters/PoId" }]
    get:
      summary: Trilha do de-para (todos os perfis), só de inserção
      operationId: eventosDepara
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/EventoDepara" } } } }
        "403": { description: Sem acesso ao condomínio }
        "404": { description: PO não encontrada }
  /condominios/{condominioId}/previsto-realizado:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }]
    get:
      summary: Previsto × realizado do mês ou acumulado do exercício (todos os perfis, RF-03.1.6 a RF-03.1.11)
      description: |
        Calculado na consulta pela função pura CalculoPrevistoRealizado (versaoCalculo no resultado); nada é gravado.
        Realizado = débitos do fundo Condomínio (fundo ordinário) pelo de-para CONFIRMADO; ajustes, a realocar e sem
        linha da PO à parte; transferências entre fundos fora. Previsto do mês = soma das linhas 1.1 a 1.8 (Q30).
        Fundos ligados às linhas 1.9: arrecadação (recebimento de cota) × previsto. Mês sem fluxo, com dois fluxos,
        sem PO, com PO não confirmada ou sem fundo ordinário: situacao diz o porquê e os números ficam nulos.
      operationId: previstoRealizado
      parameters:
        - { name: periodo, in: query, required: true, description: AAAA-MM ou "acumulado", schema: { type: string, pattern: "^([0-9]{4}-[0-9]{2}|acumulado)$" } }
        - { name: po, in: query, required: false, description: Versão da PO; sem ela, a que vale no mês (no acumulado, a confirmada mais recente), schema: { type: string, format: uuid } }
        - { name: fundo, in: query, required: false, description: 'Filtro de fundo (RF-03.1.13). O fundo ordinário mostra só o fundo Condomínio (sem o painel dos fundos); outro fundo mostra só o painel dele, com totais, grupos, blocos, conferência e regra dos 20% nulos ou vazios e provisorio = false. Sem ele, tudo', schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PrevistoRealizado" } } } }
        "400": { description: Período inválido }
        "403": { description: Sem acesso ao condomínio }
        "404": { description: Condomínio, PO ou fundo não encontrados }
  /condominios/{condominioId}/previsto-realizado/evidencia:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }]
    get:
      summary: Lançamentos que compõem um número do previsto × realizado (todos os perfis, RF-03.1.12)
      operationId: evidenciaPrevistoRealizado
      parameters:
        - { name: periodo, in: query, required: true, schema: { type: string, pattern: "^([0-9]{4}-[0-9]{2}|acumulado)$" } }
        - { name: po, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: alvo, in: query, required: true, description: '"linha:<linhaId>", "grupo:<linhaId do grupo>" (as linhas do grupo, na ordem da PO), "total" (despesa realizada: linhas de todos os grupos, depois A_REALOCAR e SEM_LINHA_PO), "fundo:<fundoId>" (arrecadação), AJUSTES, A_REALOCAR, SEM_LINHA_PO ou TRANSFERENCIAS', schema: { type: string } }
      responses:
        "200":
          description: OK (lista vazia quando o alvo não tem lançamento)
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/EvidenciaLancamento" } } } }
        "400": { description: Período ou alvo inválido }
        "403": { description: Sem acesso ao condomínio }
  /condominios/{condominioId}/previsto-realizado/exportacao:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }]
    get:
      summary: Exporta a mesma visão do previsto × realizado em PDF ou Excel (todos os perfis, RF-03.1.14)
      description: |
        Gerado do mesmo resultado do GET /previsto-realizado (mesma função, mesmos filtros): os números são os do
        JSON. Cabeçalho com condomínio, PO (arquivo, versão, hash e exercício), período, data e hora, quem gerou e
        estado do de-para. Com valor a realocar ou sem linha da PO, traz "PROVISÓRIO" e a lista desses lançamentos.
        Sem gráfico. Excel com as abas "Resumo" e "Evidência" (um lançamento por linha, com arquivo, página e hash).
        Mês sem números (sem fluxo, dois fluxos etc.) exporta a mensagem no lugar dos números.
      operationId: exportarPrevistoRealizado
      parameters:
        - { name: formato, in: query, required: true, schema: { type: string, enum: [pdf, xlsx] } }
        - { name: periodo, in: query, required: true, description: AAAA-MM ou "acumulado", schema: { type: string, pattern: "^([0-9]{4}-[0-9]{2}|acumulado)$" } }
        - { name: po, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: fundo, in: query, required: false, description: 'Filtro de fundo (RF-03.1.13). O fundo ordinário mostra só o fundo Condomínio (sem o painel dos fundos); outro fundo mostra só o painel dele, com totais, grupos, blocos, conferência e regra dos 20% nulos ou vazios e provisorio = false. Sem ele, tudo', schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Arquivo (Content-Disposition attachment; previsto-realizado-<periodo>.pdf ou .xlsx)
          content:
            application/pdf: { schema: { type: string, format: binary } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
        "400": { description: Formato ou período inválido }
        "403": { description: Sem acesso ao condomínio }
        "404": { description: Condomínio, PO ou fundo não encontrados }
  /condominios/{condominioId}/fundos:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }]
    get:
      summary: Fundos do fluxo do condomínio, pelo nome impresso (todos os perfis; RF-03.1.9 e RF-03.1.13)
      description: Lista para ligar as linhas 1.9 e para o filtro de fundo, em ordem de nome. "OBRAS" e "OBRAS / REFORMAS / INFRA" são itens separados.
      operationId: fundos
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FundoFluxo" } } } }
        "403": { description: Sem acesso ao condomínio }
        "404": { description: Condomínio não encontrado }
  /condominios/{condominioId}/previsoes/{poId}/fundos:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }, { $ref: "#/components/parameters/PoId" }]
    put:
      summary: Altera a ligação das linhas 1.9 aos fundos depois da confirmação (só Admin; RF-03.1.9)
      description: |
        A lista é a ligação completa: linha 1.9.x ausente ou com fundoId nulo fica sem fundo. Cada linha com no máximo
        um fundo, cada fundo em no máximo uma linha, nunca o fundo ordinário. A trilha da PO (GET .../eventos) recebe um
        evento FUNDOS_ALTERADOS com o fundo anterior e o novo de cada linha, quem e quando. Sem mudança, nada é gravado.
        Os achados são recalculados depois do commit.
      operationId: alterarFundosPo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fundos]
              properties:
                fundos:
                  type: array
                  items:
                    type: object
                    required: [linhaId]
                    properties:
                      linhaId: { type: string, format: uuid }
                      fundoId: { type: [string, "null"], format: uuid }
      responses:
        "200": { description: PO com a nova ligação, content: { application/json: { schema: { $ref: "#/components/schemas/PrevisaoDetalhe" } } } }
        "403": { description: Gestor, Usuário ou sem acesso ao condomínio }
        "404": { description: PO não encontrada }
        "409": { description: PO ainda não confirmada }
        "422": { description: Ligação recusada, com os motivos, content: { application/json: { schema: { $ref: "#/components/schemas/Problema" } } } }
  /condominios/{condominioId}/previsoes/{poId}/eventos:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }, { $ref: "#/components/parameters/PoId" }]
    get:
      summary: Trilha da PO (todos os perfis), só de inserção
      description: Confirmação (CONFIRMADA), substituição (SUBSTITUIDA) e alterações da ligação dos fundos (FUNDOS_ALTERADOS).
      operationId: eventosPrevisao
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/EventoPrevisao" } } } }
        "403": { description: Sem acesso ao condomínio }
        "404": { description: PO não encontrada }
  /condominios/{condominioId}/realocacoes:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }]
    get:
      summary: Realocações de uma versão da PO, ativas e desfeitas (todos os perfis, RF-03.1.7)
      operationId: realocacoes
      parameters:
        - { name: po, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Realocacao" } } } }
        "403": { description: Sem acesso ao condomínio }
        "404": { description: PO não encontrada }
    post:
      summary: Realoca um lançamento "a realocar" para uma linha de despesa da PO (Gestor e Admin, RF-03.1.7)
      description: |
        Só débitos do fundo Condomínio cuja conta tem de-para CONFIRMADO para REALOCAR, e só para linhas 1.1 a 1.8 da
        PO que vale no mês do lançamento. O lançamento original não muda. A realocação guarda a impressão do lançamento
        (arquivo, página, ordem, data, conta, documento e valor) e sobrevive ao reprocesso do mesmo fluxo. Os achados
        são recalculados depois do commit.
      operationId: realocar
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PedidoRealocacao" } } }
      responses:
        "200": { description: Realocado, content: { application/json: { schema: { $ref: "#/components/schemas/Realocacao" } } } }
        "403": { description: Usuário (só consulta) ou sem acesso ao condomínio }
        "404": { description: Condomínio ou lançamento não encontrado }
        "409": { description: Sem PO aprovada no mês, ou lançamento já realocado }
        "422": { description: Lançamento não está em "a realocar", não é do fundo Condomínio, ou linha inválida }
  /condominios/{condominioId}/realocacoes/{realocacaoId}:
    parameters:
      - { $ref: "#/components/parameters/CondominioId" }
      - { name: realocacaoId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: Desfaz a realocação (Gestor e Admin); o valor volta a "a realocar" e nada é apagado
      operationId: desfazerRealocacao
      responses:
        "200": { description: Desfeita (ativa = false), content: { application/json: { schema: { $ref: "#/components/schemas/Realocacao" } } } }
        "403": { description: Usuário (só consulta) ou sem acesso ao condomínio }
        "404": { description: Realocação não encontrada }
        "409": { description: Já desfeita }
  /condominios/{condominioId}/achados:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }]
    get:
      summary: Achados com a evidência original e o histórico (todos os perfis, só leitura; RF-03.1.12)
      description: |
        Os achados do orçamento são recalculados depois de cada mudança (fluxo gravado, PO confirmada, de-para,
        fundos, realocação). Um achado por regra, mês e alvo; nunca apagado. Quando a condição deixa de existir, o
        achado aberto passa a NAO_SE_APLICA_MAIS, com o motivo (Q27); se a condição volta, o mesmo achado volta a
        ABERTO. Estados marcados por pessoa (RF-02.8) não mudam pelo recálculo.
      operationId: achados
      parameters:
        - { name: competencia, in: query, required: false, description: AAAA-MM; sem ela, todos os meses, schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" } }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Achado" } } } }
        "400": { description: Competência inválida }
        "403": { description: Sem acesso ao condomínio }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    CondominioId: { name: condominioId, in: path, required: true, schema: { type: string, format: uuid } }
    ArquivoId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    CodigoModulo: { name: codigo, in: path, required: true, description: "Código do módulo no catálogo (ex.: ASSISTENTE)", schema: { type: string } }
    PoId: { name: poId, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    ContextoCondominio:
      type: object
      required: [condominioId, nome, modulosLigados]
      properties:
        condominioId: { type: string, format: uuid }
        nome: { type: string }
        modulosLigados: { type: array, items: { type: string }, description: "Códigos dos módulos ligados (ex.: [ASSISTENTE])" }
    ModuloDoCondominio:
      type: object
      required: [codigo, nome, descricao, inclui, dependeDe, ligadoPorPadrao, ligado, versaoCatalogo]
      properties:
        codigo: { type: string }
        nome: { type: string }
        descricao: { type: string }
        inclui: { type: array, items: { type: string }, description: O que o módulo inclui (telas, API, ferramentas MCP, processamentos) }
        dependeDe: { type: array, items: { type: string } }
        ligadoPorPadrao: { type: boolean, description: Estado de um condomínio novo }
        ligado: { type: boolean }
        desde: { type: [string, "null"], format: date-time, description: "Desde quando está no estado atual. Nulo = nunca alterado (vale o padrão)" }
        versaoCatalogo: { type: integer }
    AlteracaoModulo:
      type: object
      required: [ligado]
      properties:
        ligado: { type: boolean }
        motivo: { type: [string, "null"], maxLength: 500, description: "Opcional (RF-10.6); em branco = não informado. Vai para a trilha de ativação" }
    EventoModulo:
      type: object
      required: [id, modulo, ligadoAntes, ligadoDepois, usuario, quando]
      properties:
        id: { type: string, format: uuid }
        modulo: { type: string }
        ligadoAntes: { type: boolean }
        ligadoDepois: { type: boolean }
        usuario: { type: string }
        quando: { type: string, format: date-time }
        motivo: { type: [string, "null"], description: Nulo quando não informado }
    PeriodoAtivo:
      type: object
      required: [modulo]
      properties:
        modulo: { type: string }
        inicio: { type: [string, "null"], format: date-time, description: "Nulo só se o módulo nasceu ligado por padrão, antes da trilha" }
        fim: { type: [string, "null"], format: date-time, description: Nulo = ainda ligado }
        ligadoPor: { type: [string, "null"] }
        motivoLigar: { type: [string, "null"] }
        desligadoPor: { type: [string, "null"] }
        motivoDesligar: { type: [string, "null"] }
    FuncaoUso:
      type: string
      description: "busca_documentos = busca pela tela; chamada_mcp = buscar_documentos pelo MCP; indexacao = arquivo indexado; embeddings e pergunta = chat (entrega 3)"
      enum: [busca_documentos, chamada_mcp, indexacao, embeddings, pergunta]
    TotalUso:
      type: object
      required: [modulo, funcao, quantidade, tokensEntrada, tokensSaida, arquivos, paginas]
      properties:
        mes: { type: string, description: "AAAA-MM (só em porMes)", pattern: "^[0-9]{4}-[0-9]{2}$" }
        modulo: { type: string }
        funcao: { $ref: "#/components/schemas/FuncaoUso" }
        quantidade: { type: integer, format: int64, description: Número de registros (chamadas, buscas, arquivos indexados) }
        tokensEntrada: { type: integer, format: int64 }
        tokensSaida: { type: integer, format: int64 }
        arquivos: { type: integer, format: int64 }
        paginas: { type: integer, format: int64 }
    UsoDoPeriodo:
      type: object
      required: [condominioId, inicio, fim, porFuncao, porMes]
      properties:
        condominioId: { type: string, format: uuid }
        inicio: { type: string, format: date }
        fim: { type: string, format: date }
        porFuncao: { type: array, items: { $ref: "#/components/schemas/TotalUso" } }
        porMes: { type: array, items: { $ref: "#/components/schemas/TotalUso" } }
    Categoria:
      type: string
      enum: [BALANCETE, EXTRATO, PO, CONTRATO, FOLHA, COMPROVANTE, ATA, CONVENCAO_RI, OUTROS]
    NovaCategoria:
      type: object
      required: [categoria]
      properties:
        categoria: { $ref: "#/components/schemas/Categoria" }
    StatusArquivo:
      type: string
      enum: [PENDENTE, PROCESSANDO, CONCLUIDO, PRECISA_REVISAO, FALHOU]
    CategoriaDto:
      type: object
      required: [codigo, rotulo]
      properties:
        codigo: { $ref: "#/components/schemas/Categoria" }
        rotulo: { type: string }
    UsuarioLogado:
      type: object
      required: [usuario, nome, perfis, condominios]
      properties:
        usuario: { type: string }
        nome: { type: string }
        perfis: { type: array, items: { type: string, enum: [USUARIO, GESTOR, ADMIN] } }
        condominios:
          type: array
          items:
            type: object
            required: [id, nome]
            properties: { id: { type: string, format: uuid }, nome: { type: string } }
    ArquivoResumo:
      type: object
      required: [id, categoria, categoriaRotulo, nome, tamanhoBytes, status, enviadoPor, enviadoEm]
      properties:
        id: { type: string, format: uuid }
        categoria: { $ref: "#/components/schemas/Categoria" }
        categoriaRotulo: { type: string }
        nome: { type: string }
        tamanhoBytes: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/StatusArquivo" }
        mensagem: { type: [string, "null"] }
        periodoInicio: { type: [string, "null"], format: date }
        periodoFim: { type: [string, "null"], format: date }
        totalLancamentos: { type: [integer, "null"] }
        enviadoPor: { type: string }
        enviadoEm: { type: string, format: date-time }
        processadoEm: { type: [string, "null"], format: date-time }
        indexacao:
          description: Estado da indexação para a busca nos documentos (ADR 0003). Nulo ou ausente = arquivo ainda não indexado (enviado antes da busca ou com o módulo Assistente desligado; reprocessar ou ligar o módulo indexa).
          anyOf:
            - { $ref: "#/components/schemas/IndexacaoArquivo" }
            - { type: "null" }
    SituacaoIndexacao:
      type: string
      description: NA_FILA e INDEXANDO = em andamento; INDEXADO = aparece na busca; SEM_TEXTO = sem texto extraível (ex. PDF digitalizado); RETIRADO = fora da busca (exclusão lógica ou versão substituída); ERRO = falhou (ver motivo).
      enum: [NA_FILA, INDEXANDO, INDEXADO, SEM_TEXTO, RETIRADO, ERRO]
    IndexacaoArquivo:
      type: object
      required: [situacao]
      properties:
        situacao: { $ref: "#/components/schemas/SituacaoIndexacao" }
        motivo: { type: [string, "null"], description: "Preenchido em SEM_TEXTO e ERRO" }
        paginas: { type: [integer, "null"], description: "Páginas (PDF), abas (Excel) ou 1 (Word) lidas" }
        trechos: { type: [integer, "null"], description: "Trechos gravados no índice" }
    ArquivoDetalhe:
      type: object
      required: [arquivo, sha256, conferencias, fundos]
      properties:
        arquivo: { $ref: "#/components/schemas/ArquivoResumo" }
        sha256: { type: string }
        conferencias:
          type: array
          items:
            type: object
            required: [codigo, descricao, ok]
            properties:
              codigo: { type: string }
              descricao: { type: string }
              ok: { type: boolean }
              detalhe: { type: [string, "null"] }
        fundos:
          type: array
          items:
            type: object
            required: [fundo, saldoAnterior, creditos, debitos, saldoAtual]
            properties:
              fundo: { type: string }
              saldoAnterior: { type: number }
              creditos: { type: number }
              debitos: { type: number }
              saldoAtual: { type: number }
    Painel:
      type: object
      required: [arquivoId, arquivoNome, periodoInicio, periodoFim, saldoAnterior, entradas, saidas, saldoAtual, conferenciasComFalha, fundoOrdinario, fundos, maioresDespesas]
      properties:
        arquivoId: { type: string, format: uuid }
        arquivoNome: { type: string }
        periodoInicio: { type: string, format: date }
        periodoFim: { type: string, format: date }
        saldoAnterior: { type: number }
        entradas: { type: number }
        saidas: { type: number }
        saldoAtual: { type: number }
        conferenciasComFalha: { type: integer }
        fundoOrdinario:
          description: |
            Saldo acumulado do fundo ordinário (cartão "Saldo acumulado"). Com confirmado=false é só a sugestão
            (fundo com mais entradas no mês), que a tela mostra para o Gestor confirmar. Nulo quando não há sugestão.
          oneOf:
            - type: "null"
            - type: object
              required: [fundoId, fundo, confirmado, saldoAtual]
              properties:
                fundoId: { type: string, format: uuid }
                fundo: { type: string }
                confirmado: { type: boolean }
                saldoAtual: { type: [number, "null"], description: Nulo quando o fundo confirmado não está no relatório }
        fundos:
          type: array
          items:
            type: object
            required: [fundoId, fundo, saldoAnterior, entradas, saidas, resultado, saldoAtual]
            properties:
              fundoId: { type: string, format: uuid }
              fundo: { type: string }
              saldoAnterior: { type: number }
              entradas: { type: number }
              saidas: { type: number }
              resultado: { type: number }
              saldoAtual: { type: number }
        maioresDespesas:
          type: array
          items:
            type: object
            required: [data, fundo, conta, historico, valor, pagina]
            properties:
              data: { type: string, format: date }
              fundo: { type: string }
              conta: { type: string }
              historico: { type: string }
              valor: { type: number }
              pagina: { type: integer }
    EstadoPrevisao:
      type: string
      description: |
        LIDA (aguarda confirmação), LIDA_COM_DIVERGENCIA (soma que não bate além da tolerância de arredondamento),
        CONFIRMADA (vale para os meses do exercício) e SUBSTITUIDA (trocada por reaprovação a partir de um mês).
      enum: [LIDA, LIDA_COM_DIVERGENCIA, CONFIRMADA, SUBSTITUIDA]
    PrevisaoResumo:
      type: object
      required: [id, arquivoId, sha256, estado, previstoMes, lidaEm]
      properties:
        id: { type: string, format: uuid }
        arquivoId: { type: string, format: uuid }
        arquivoNome: { type: [string, "null"] }
        sha256: { type: string }
        estado: { $ref: "#/components/schemas/EstadoPrevisao" }
        versao: { type: [integer, "null"], description: Preenchida na confirmação (1, 2, ... por reaprovação) }
        titulo: { type: [string, "null"] }
        exercicioImpresso: { type: [string, "null"], description: Como impresso (ex. "2026 / 2027") }
        exercicioInicio: { type: [string, "null"], pattern: "^[0-9]{4}-[0-9]{2}$", description: AAAA-MM, informado na confirmação }
        exercicioFim: { type: [string, "null"], pattern: "^[0-9]{4}-[0-9]{2}$" }
        totalImpresso: { type: [number, "null"] }
        previstoMes: { type: number, description: Soma das linhas dos grupos que não são fundos (usada nos cálculos) }
        lidaEm: { type: string, format: date-time }
        confirmadaPor: { type: [string, "null"] }
        confirmadaEm: { type: [string, "null"], format: date-time }
    PrevisaoDetalhe:
      type: object
      required: [previsao, toleranciaArredondamento, linhas, conferencias, avisos, codigosRepetidos, fundos, achados]
      properties:
        previsao: { $ref: "#/components/schemas/PrevisaoResumo" }
        colunaOrcadoAnterior: { type: [string, "null"] }
        colunaOrcado: { type: [string, "null"] }
        previstoMesImpresso: { type: [number, "null"], description: Total impresso menos fundos impressos }
        toleranciaArredondamento: { type: number, description: Diferença máxima tratada como arredondamento nesta leitura }
        substituidaDesde: { type: [string, "null"], pattern: "^[0-9]{4}-[0-9]{2}$", description: Mês a partir do qual vale a nova versão }
        confirmacao:
          description: Dados informados pelo Admin; nulo antes da confirmação
          oneOf:
            - type: "null"
            - type: object
              required: [semAta, cienteDivergencia]
              properties:
                ataArquivoId: { type: [string, "null"], format: uuid }
                semAta: { type: boolean }
                dataAprovacao: { type: [string, "null"], format: date }
                cienteDivergencia: { type: boolean }
                justificativaDivergencia: { type: [string, "null"] }
        linhas: { type: array, items: { $ref: "#/components/schemas/LinhaPo" } }
        conferencias: { type: array, items: { $ref: "#/components/schemas/ConferenciaPo" } }
        avisos: { type: array, items: { $ref: "#/components/schemas/AvisoPo" } }
        codigosRepetidos:
          type: array
          items:
            type: object
            required: [codigoImpresso, resolvido, linhas]
            properties:
              codigoImpresso: { type: string }
              resolvido: { type: boolean, description: Os códigos efetivos dessas linhas já são distintos }
              linhas:
                type: array
                items:
                  type: object
                  required: [linhaId, ordem, descricao, codigoEfetivo]
                  properties:
                    linhaId: { type: string, format: uuid }
                    ordem: { type: integer }
                    descricao: { type: string }
                    codigoEfetivo: { type: string }
        fundos:
          type: array
          description: Ligação das linhas de fundo (1.9.x) aos fundos do fluxo, feita na confirmação
          items:
            type: object
            required: [linhaId, codigoEfetivo, descricao, orcado, fundoId, fundo]
            properties:
              linhaId: { type: string, format: uuid }
              codigoEfetivo: { type: string }
              descricao: { type: string }
              orcado: { type: number }
              fundoId: { type: string, format: uuid }
              fundo: { type: string }
        achados:
          type: array
          items:
            type: object
            required: [id, regra, versaoRegra, severidade, competencia, descricao, estado]
            properties:
              id: { type: string, format: uuid }
              regra: { type: string }
              versaoRegra: { type: string }
              severidade: { type: string, enum: [INFORMATIVO, ATENCAO, CRITICO] }
              competencia: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
              descricao: { type: string }
              estado: { $ref: "#/components/schemas/EstadoAchado" }
    LinhaPo:
      type: object
      required: [id, ordem, pagina, tipo, codigoImpresso, codigoEfetivo, descricao, orcadoAnterior, orcado, linhaDeFundo, arquivoId, sha256]
      properties:
        id: { type: string, format: uuid, description: Identificador estável da linha (destino do de-para) }
        ordem: { type: integer }
        pagina: { type: integer }
        tipo: { type: string, enum: [TOTAL, GRUPO, LINHA] }
        codigoImpresso: { type: string }
        codigoEfetivo: { type: string, description: Igual ao impresso; o Admin muda só quando o código se repete }
        conta: { type: [string, "null"] }
        contaTexto: { type: [string, "null"] }
        marca: { type: [string, "null"], enum: [RATEIO_A_PARTE, NEGOCIADA_ISENCAO, SEM_VALOR, VALOR_FIXO_SEM_REFERENCIA, null] }
        descricao: { type: string }
        orcadoAnterior: { type: number }
        orcado: { type: number }
        percentualTexto: { type: [string, "null"], description: Coluna "%" como lida; não entra em cálculo }
        observacoes: { type: [string, "null"] }
        linhaDeFundo: { type: boolean, description: Linha do grupo de fundos (precisa ser ligada a um fundo na confirmação) }
        arquivoId: { type: string, format: uuid }
        sha256: { type: string }
    ConferenciaPo:
      type: object
      required: [codigo, descricao, ok, classificacao]
      properties:
        codigo: { type: string }
        descricao: { type: string }
        ok: { type: boolean }
        detalhe: { type: [string, "null"] }
        classificacao:
          type: string
          description: OK; ARREDONDAMENTO (diferença até a tolerância, só aviso); DIVERGENCIA; CODIGO_REPETIDO (pendência)
          enum: [OK, ARREDONDAMENTO, DIVERGENCIA, CODIGO_REPETIDO]
        explicacao: { type: [string, "null"], description: Quando falhou, as duas somas }
    AvisoPo:
      type: object
      required: [codigo, texto]
      properties:
        codigo:
          type: string
          enum: [ARREDONDAMENTO, DIVERGENCIA, CODIGO_REPETIDO, CONFIRMADA_COM_DIVERGENCIA, FORA_PRIMEIRO_TRIMESTRE, SEM_ATA, REGRA_NAO_AVALIADA]
        texto: { type: string }
    PedidoConfirmacao:
      type: object
      required: [exercicioInicio, exercicioFim, semAta]
      properties:
        exercicioInicio: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$", description: AAAA-MM }
        exercicioFim: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$", description: AAAA-MM }
        ataArquivoId: { type: [string, "null"], format: uuid, description: Arquivo da categoria ATA; nulo com semAta }
        semAta: { type: boolean }
        dataAprovacao: { type: [string, "null"], format: date, description: Data da assembleia; obrigatória com ata }
        codigosEfetivos:
          type: array
          description: Código distinto para linhas cujo código impresso se repete (mesmo grupo, ex. 1.3.2 → 1.3.25)
          items:
            type: object
            required: [linhaId, codigo]
            properties:
              linhaId: { type: string, format: uuid }
              codigo: { type: string }
        fundos:
          type: array
          description: Cada linha de fundo (linhaDeFundo) ligada a um fundo do fluxo, distinto e que não seja o ordinário
          items:
            type: object
            required: [linhaId, fundoId]
            properties:
              linhaId: { type: string, format: uuid }
              fundoId: { type: string, format: uuid }
        reaprovacao: { type: boolean, default: false }
        cienteDivergencia: { type: boolean, default: false }
        justificativa: { type: [string, "null"], description: Obrigatória com cienteDivergencia }
    TipoDestino:
      type: string
      description: Linha da PO; ajuste (não é despesa); meio de pagamento a realocar (RF-02B); transferência entre fundos
      enum: [LINHA_PO, AJUSTE, A_REALOCAR, TRANSFERENCIA]
    EstadoDepara:
      type: string
      enum: [SUGERIDO, CONFIRMADO, RECUSADO]
    OrigemDepara:
      type: string
      enum: [VERSAO_ANTERIOR, PLANILHA, NOME, ADMIN]
    FiltroDepara:
      type: string
      description: PENDENTES = sem de-para confirmado (sem de-para, sugerido ou recusado)
      enum: [TODAS, PENDENTES, SUGERIDO, CONFIRMADO, RECUSADO, SEM_DEPARA, IGUAIS_VERSAO_ANTERIOR]
    DestinoDepara:
      type: object
      required: [tipo, texto]
      properties:
        tipo: { $ref: "#/components/schemas/TipoDestino" }
        linhaId: { type: [string, "null"], format: uuid, description: Só com LINHA_PO }
        codigo: { type: [string, "null"], description: Código efetivo da linha }
        descricao: { type: [string, "null"] }
        detalhe: { type: [string, "null"], description: Texto do destino especial, ex. "estorno" }
        texto: { type: string, description: Ex. "1.7.8 Material hidráulico" ou "AJUSTE (estorno)" }
    ContaDepara:
      type: object
      required: [conta, lancamentos, debitos, igualVersaoAnterior]
      properties:
        conta: { type: string, description: Código da conta do fluxo como impresso }
        nome: { type: [string, "null"], description: Nome como impresso no fluxo }
        lancamentos: { type: integer, description: Débitos do fundo Condomínio no exercício da PO }
        debitos: { type: number }
        destino: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/DestinoDepara" }] }
        estado: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/EstadoDepara" }], description: Nulo = sem de-para }
        origem: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/OrigemDepara" }] }
        motivo: { type: [string, "null"], description: Nomes comparados, linha da planilha ou "igual à versão anterior" }
        igualVersaoAnterior: { type: boolean }
        atualizadoPor: { type: [string, "null"] }
        atualizadoEm: { type: [string, "null"], format: date-time }
    DeparaLista:
      type: object
      required: [previsaoId, resumo, contas]
      properties:
        previsaoId: { type: string, format: uuid }
        versao: { type: [integer, "null"] }
        resumo:
          type: object
          description: Sempre sobre todas as contas, sem o filtro ("N de M contas confirmadas")
          required: [contas, confirmadas, sugeridas, recusadas, semDepara]
          properties:
            contas: { type: integer }
            confirmadas: { type: integer }
            sugeridas: { type: integer }
            recusadas: { type: integer }
            semDepara: { type: integer }
        contas: { type: array, items: { $ref: "#/components/schemas/ContaDepara" } }
    PedidoDestino:
      type: object
      required: [tipo]
      properties:
        tipo: { $ref: "#/components/schemas/TipoDestino" }
        linhaId: { type: [string, "null"], format: uuid, description: Obrigatória com LINHA_PO }
        detalhe: { type: [string, "null"] }
        confirmar: { type: [boolean, "null"], description: Nulo ou true confirma; false deixa SUGERIDO }
    PedidoLote:
      type: object
      required: [acao, contas]
      properties:
        acao: { type: string, enum: [CONFIRMAR, RECUSAR] }
        contas: { type: array, minItems: 1, items: { type: string } }
    ContaIgnorada:
      type: object
      required: [conta, motivo]
      properties: { conta: { type: string }, motivo: { type: string } }
    ResultadoLote:
      type: object
      required: [alteradas, ignoradas]
      properties:
        alteradas: { type: integer }
        ignoradas: { type: array, items: { $ref: "#/components/schemas/ContaIgnorada" } }
    ResultadoSugestoes:
      type: object
      required: [criadas, daVersaoAnterior, peloNome, semSugestao]
      properties:
        criadas: { type: integer }
        daVersaoAnterior: { type: integer }
        peloNome: { type: integer }
        semSugestao:
          type: array
          items:
            type: object
            required: [conta, motivo]
            properties: { conta: { type: string }, nome: { type: [string, "null"] }, motivo: { type: string } }
    ResultadoPlanilha:
      type: object
      required: [aceitas, ignoradas, recusadas]
      properties:
        aceitas: { type: integer }
        ignoradas: { type: array, items: { $ref: "#/components/schemas/ContaIgnorada" } }
        recusadas:
          type: array
          items:
            type: object
            required: [linha, conteudo, motivo]
            properties: { linha: { type: integer }, conteudo: { type: string }, motivo: { type: string } }
    EventoDepara:
      type: object
      required: [id, conta, acao, usuario, em, destinoNovo, estadoNovo, origem]
      properties:
        id: { type: string, format: uuid }
        conta: { type: string }
        nome: { type: [string, "null"] }
        acao: { type: string, enum: [SUGERIDO, CONFIRMADO, RECUSADO, ALTERADO] }
        usuario: { type: string }
        em: { type: string, format: date-time }
        destinoAnterior: { type: [string, "null"] }
        estadoAnterior: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/EstadoDepara" }] }
        destinoNovo: { type: string }
        estadoNovo: { $ref: "#/components/schemas/EstadoDepara" }
        origem: { $ref: "#/components/schemas/OrigemDepara" }
        motivo: { type: [string, "null"] }
    PrevistoRealizado:
      type: object
      required: [versaoCalculo, periodo, situacao, meses, mesesSomados, mesesSemFluxo, mesesComDoisFluxos, provisorio, grupos, fundos, avisos]
      properties:
        versaoCalculo: { type: string, description: Versão das regras do cálculo usada nesta resposta }
        periodo: { type: string, description: AAAA-MM ou "acumulado" }
        situacao: { type: string, enum: [CALCULADO, SEM_PO, PO_NAO_CONFIRMADA, SEM_FUNDO_ORDINARIO, SEM_FLUXO, DOIS_FLUXOS] }
        mensagem: { type: [string, "null"], description: Por que não há números (situação diferente de CALCULADO) }
        po:
          oneOf:
            - type: "null"
            - type: object
              required: [id, estado, arquivoId, sha256]
              properties:
                id: { type: string, format: uuid }
                versao: { type: [integer, "null"] }
                estado: { $ref: "#/components/schemas/EstadoPrevisao" }
                arquivoId: { type: string, format: uuid }
                arquivoNome: { type: [string, "null"] }
                sha256: { type: string }
                exercicioInicio: { type: [string, "null"] }
                exercicioFim: { type: [string, "null"] }
        meses:
          type: array
          description: No acumulado, os meses do exercício; no mês, só ele. Números só com COM_FLUXO
          items:
            type: object
            required: [mes, situacao, fluxos]
            properties:
              mes: { type: string }
              situacao: { type: string, enum: [COM_FLUXO, SEM_FLUXO, DOIS_FLUXOS] }
              fluxos: { type: array, items: { $ref: "#/components/schemas/FluxoUsado" } }
              previsto: { type: [number, "null"] }
              despesaRealizada: { type: [number, "null"] }
              excesso: { type: [number, "null"] }
              percentualExcesso: { type: [number, "null"] }
              acimaDoLimite: { type: [boolean, "null"] }
        mesesSomados: { type: array, items: { type: string } }
        mesesSemFluxo: { type: array, items: { type: string }, description: Meses sem fluxo antes do último mês com fluxo }
        mesesComDoisFluxos: { type: array, items: { type: string } }
        depara:
          oneOf:
            - type: "null"
            - type: object
              required: [contas, confirmadas, semDeparaConfirmado]
              properties:
                contas: { type: integer, description: Contas com débito no fundo Condomínio no período }
                confirmadas: { type: integer }
                semDeparaConfirmado: { type: integer }
        provisorio: { type: boolean, description: Há valor a realocar ou sem linha da PO }
        totais:
          oneOf:
            - type: "null"
            - type: object
              required: [previstoMes, previsto, despesaRealizada, emLinhas, diferenca, previstoExercicio]
              properties:
                previstoMes: { type: number }
                previsto: { type: number, description: Previsto do mês × meses somados }
                despesaRealizada: { type: number, description: Em linhas + a realocar + sem linha da PO }
                emLinhas: { type: number }
                diferenca: { type: number }
                execucao: { type: [number, "null"], description: "% com 1 casa; nulo com previsto zero" }
                previstoExercicio: { type: number, description: Previsto do mês × meses do exercício (referência) }
        grupos: { type: array, items: { $ref: "#/components/schemas/GrupoPrevistoRealizado" } }
        ajustes: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/BlocoPrevistoRealizado" }] }
        aRealocar: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/BlocoPrevistoRealizado" }] }
        semLinhaPo: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/BlocoPrevistoRealizado" }] }
        conferencia:
          oneOf:
            - type: "null"
            - type: object
              description: Total de débitos do fundo = despesa realizada + ajustes + transferências
              required: [debitosDoFundo, lancamentos, despesaRealizada, ajustes, transferencias, confere]
              properties:
                debitosDoFundo: { type: number }
                lancamentos: { type: integer }
                despesaRealizada: { type: number }
                ajustes: { type: number }
                transferencias: { type: number }
                confere: { type: boolean }
        regra20:
          description: Regra dos 20% (Conv. 16.2), só no mês
          oneOf:
            - type: "null"
            - type: object
              required: [regra, versaoRegra, limitePercentual, previstoMes, excesso, percentual, limite, linhasAcima, linhas, aRealocar, semLinhaPo, cenarioMaximo, provisorio, acimaDoLimite]
              properties:
                regra: { type: string }
                versaoRegra: { type: string }
                limitePercentual: { type: number }
                previstoMes: { type: number }
                excesso: { type: number, description: Soma das diferenças positivas, linha a linha }
                percentual: { type: number }
                limite: { type: number, description: Em reais, arredondado; a comparação é exata }
                linhasAcima: { type: integer }
                linhas:
                  type: array
                  items:
                    type: object
                    required: [linhaId, codigo, descricao, excesso]
                    properties:
                      linhaId: { type: string, format: uuid }
                      codigo: { type: string }
                      descricao: { type: string }
                      excesso: { type: number }
                aRealocar: { type: number }
                semLinhaPo: { type: number }
                cenarioMaximo: { type: number, description: Excesso + a realocar + sem linha da PO }
                percentualCenarioMaximo: { type: [number, "null"] }
                provisorio: { type: boolean }
                acimaDoLimite: { type: boolean }
        fundos:
          type: array
          items:
            type: object
            required: [situacao]
            properties:
              fundoId: { type: [string, "null"], format: uuid }
              fundo: { type: [string, "null"], description: Nome impresso no fluxo }
              linhaId: { type: [string, "null"], format: uuid }
              linhaCodigo: { type: [string, "null"] }
              situacao: { type: string, enum: [COMPARADO, SEM_PREVISTO_NA_PO, LINHA_SEM_FUNDO, REPROCESSAR_FLUXO] }
              previsto: { type: [number, "null"] }
              arrecadado: { type: [number, "null"] }
              diferenca: { type: [number, "null"] }
              execucao: { type: [number, "null"] }
              creditos: { type: [number, "null"] }
              debitos: { type: [number, "null"] }
        avisos:
          type: array
          items:
            type: object
            required: [codigo, texto]
            properties: { codigo: { type: string }, texto: { type: string } }
    FluxoUsado:
      type: object
      required: [arquivoId, nome, sha256]
      properties:
        arquivoId: { type: string, format: uuid }
        nome: { type: string }
        sha256: { type: string }
        periodoInicio: { type: [string, "null"], format: date }
        periodoFim: { type: [string, "null"], format: date }
        enviadoEm: { type: [string, "null"], format: date-time }
        enviadoPor: { type: [string, "null"] }
    GrupoPrevistoRealizado:
      type: object
      required: [linhaId, codigo, descricao, previsto, realizado, diferenca, linhas]
      properties:
        linhaId: { type: string, format: uuid }
        codigo: { type: string }
        descricao: { type: string }
        previsto: { type: number, description: Soma das linhas (Q30) }
        realizado: { type: number }
        diferenca: { type: number }
        execucao: { type: [number, "null"] }
        linhas:
          type: array
          items:
            type: object
            required: [linhaId, codigo, descricao, pagina, previsto, realizado, diferenca, contasFluxo, lancamentos]
            properties:
              linhaId: { type: string, format: uuid }
              codigo: { type: string }
              descricao: { type: string }
              conta: { type: [string, "null"] }
              marca: { type: [string, "null"], enum: [RATEIO_A_PARTE, NEGOCIADA_ISENCAO, SEM_VALOR, VALOR_FIXO_SEM_REFERENCIA, null] }
              observacoes: { type: [string, "null"] }
              pagina: { type: integer }
              previsto: { type: number }
              realizado: { type: number }
              diferenca: { type: number }
              execucao: { type: [number, "null"] }
              contasFluxo: { type: array, items: { type: string }, description: Contas do fluxo com de-para confirmado para a linha }
              lancamentos: { type: integer }
    BlocoPrevistoRealizado:
      type: object
      required: [total, lancamentos, contas]
      properties:
        total: { type: number }
        lancamentos: { type: integer }
        contas:
          type: array
          items:
            type: object
            required: [valor, lancamentos]
            properties:
              conta: { type: [string, "null"] }
              nome: { type: [string, "null"] }
              detalhe: { type: [string, "null"], description: Ex. "AJUSTE (estorno)", "de-para sugerido", "sem de-para" }
              valor: { type: number }
              lancamentos: { type: integer }
    EvidenciaLancamento:
      type: object
      required: [lancamentoId, data, historico, valor, arquivoId, sha256, pagina, ordem]
      properties:
        lancamentoId: { type: string, format: uuid }
        data: { type: string, format: date }
        conta: { type: [string, "null"] }
        contaNome: { type: [string, "null"] }
        historico: { type: string }
        fornecedor: { type: [string, "null"] }
        documento: { type: [string, "null"] }
        valor: { type: number }
        fundo: { type: [string, "null"] }
        arquivoId: { type: string, format: uuid }
        arquivoNome: { type: [string, "null"] }
        sha256: { type: string }
        pagina: { type: integer }
        ordem: { type: integer }
        realocacao: { type: [string, "null"], description: '"realocado para <linha> por <usuário> em <data>"' }
        realocacaoId: { type: [string, "null"], format: uuid, description: Realocação ativa que levou o lançamento à linha (para desfazer) }
    EstadoAchado:
      type: string
      enum: [ABERTO, NAO_SE_APLICA_MAIS, JUSTIFICADO, RESOLVIDO, FALSO_POSITIVO]
    Achado:
      type: object
      required: [id, regra, versaoRegra, severidade, competencia, alvo, descricao, estado, condicaoPresente, criadoEm, evidencias, historico]
      properties:
        id: { type: string, format: uuid }
        regra: { type: string, description: Ex. EXCESSO_MES_ACIMA_LIMITE, CONTA_SEM_LINHA_PO, FUNDO_RESERVA_ACIMA_TETO }
        versaoRegra: { type: string }
        severidade: { type: string, enum: [INFORMATIVO, ATENCAO, CRITICO] }
        competencia: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
        alvo: { type: string, description: 'Ex. "fundo-condominio", "conta:8888"' }
        descricao: { type: string }
        estado: { $ref: "#/components/schemas/EstadoAchado" }
        estadoMotivo: { type: [string, "null"], description: 'Ex. "de-para da conta 8888 confirmado por admin em 04/10/2026"' }
        estadoEm: { type: [string, "null"], format: date-time }
        condicaoPresente: { type: boolean, description: A condição da regra existia no último recálculo }
        criadoEm: { type: string, format: date-time }
        evidencias:
          type: array
          items:
            type: object
            required: [ordem, arquivoId, sha256, referencia]
            properties:
              ordem: { type: integer }
              arquivoId: { type: string, format: uuid }
              sha256: { type: string }
              pagina: { type: [integer, "null"] }
              referencia: { type: string }
              linhaPoId: { type: [string, "null"], format: uuid }
        historico:
          type: array
          items:
            type: object
            required: [estadoNovo, condicaoPresente, motivo, usuario, em]
            properties:
              estadoAnterior: { oneOf: [{ $ref: "#/components/schemas/EstadoAchado" }, { type: "null" }] }
              estadoNovo: { $ref: "#/components/schemas/EstadoAchado" }
              condicaoPresente: { type: boolean }
              motivo: { type: string }
              usuario: { type: string }
              em: { type: string, format: date-time }
    FundoFluxo:
      type: object
      required: [id, nome, ordinario]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string, description: Nome exato impresso no fluxo }
        ordinario: { type: boolean, description: É o fundo ordinário (fundo Condomínio) confirmado }
    EventoPrevisao:
      type: object
      required: [tipo, usuario, em, detalhe]
      properties:
        tipo: { type: string, enum: [CONFIRMADA, SUBSTITUIDA, FUNDOS_ALTERADOS] }
        usuario: { type: string }
        em: { type: string, format: date-time }
        justificativa: { type: [string, "null"] }
        detalhe: { type: string }
    PedidoRealocacao:
      type: object
      required: [lancamentoId, linhaId]
      properties:
        lancamentoId: { type: string, format: uuid, description: lancamentoId da evidência "A_REALOCAR" }
        linhaId: { type: string, format: uuid, description: Linha de despesa (1.1 a 1.8) da PO que vale no mês }
    Realocacao:
      type: object
      required: [id, previsaoId, data, historico, valor, arquivoId, sha256, pagina, ordem, linhaId, realocadaPor, realocadaEm, ativa]
      properties:
        id: { type: string, format: uuid }
        previsaoId: { type: string, format: uuid }
        data: { type: string, format: date }
        conta: { type: [string, "null"] }
        contaNome: { type: [string, "null"] }
        documento: { type: [string, "null"] }
        historico: { type: string }
        valor: { type: number }
        arquivoId: { type: string, format: uuid }
        sha256: { type: string }
        pagina: { type: integer }
        ordem: { type: integer }
        linhaId: { type: string, format: uuid }
        linhaCodigo: { type: [string, "null"] }
        linhaDescricao: { type: [string, "null"] }
        realocadaPor: { type: string }
        realocadaEm: { type: string, format: date-time }
        desfeitaPor: { type: [string, "null"] }
        desfeitaEm: { type: [string, "null"], format: date-time }
        ativa: { type: boolean }
    Problema:
      type: object
