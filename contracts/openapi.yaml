openapi: 3.1.0
info:
  title: Auditoria do Condomínio – API
  version: 0.1.0
  description: |
    Contrato entre backend, frontend e MCP. Toda chamada exige token Bearer do Keycloak.
    Perfis: USUARIO (consulta), GESTOR (+ envia arquivos), ADMIN (tudo).
    Valores monetários são números com 2 casas decimais; datas em ISO 8601.
servers:
  - url: /api
security:
  - bearer: []
paths:
  /me:
    get:
      summary: Usuário logado, perfis e condomínios visíveis
      operationId: currentUser
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CurrentUserResponse" } } } }
  /categories:
    get:
      summary: Categorias de arquivo, na ordem da tela
      operationId: listCategories
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FileCategoryResponse" } } } }
  /condominiums/{condominiumId}/files:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }]
    get:
      summary: Arquivos do mais recente para o mais antigo
      operationId: listFiles
      parameters:
        - { name: category, in: query, required: false, schema: { $ref: "#/components/schemas/FileCategory" } }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SourceFileResponse" } } } }
    post:
      summary: Envia um arquivo (GESTOR ou ADMIN). O processamento segue em segundo plano.
      operationId: uploadFile
      parameters:
        - { name: category, in: query, required: true, schema: { $ref: "#/components/schemas/FileCategory" } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: { file: { type: string, format: binary } }
      responses:
        "202": { description: Recebido e na fila, content: { application/json: { schema: { $ref: "#/components/schemas/SourceFileResponse" } } } }
        "403": { description: Perfil sem permissão }
        "409": { description: Arquivo já enviado (mesmo conteúdo), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /condominiums/{condominiumId}/files/latest:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }]
    get:
      summary: Último arquivo enviado (indicador no canto da tela)
      operationId: latestFile
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SourceFileResponse" } } } }
        "204": { description: Nenhum arquivo ainda }
  /condominiums/{condominiumId}/files/{id}:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }, { $ref: "#/components/parameters/FileId" }]
    get:
      summary: Detalhe com conferências e saldos por fundo
      operationId: fileDetail
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SourceFileDetailResponse" } } } }
        "404": { description: Não encontrado }
  /condominiums/{condominiumId}/files/{id}/content:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }, { $ref: "#/components/parameters/FileId" }]
    get:
      summary: Arquivo original, exatamente como foi enviado
      operationId: fileContent
      responses:
        "200": { description: O arquivo, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
  /condominiums/{condominiumId}/files/{id}/reprocess:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }, { $ref: "#/components/parameters/FileId" }]
    post:
      summary: Coloca o arquivo de novo na fila de leitura e, com o módulo Assistente ligado, de indexação (GESTOR ou ADMIN). Não duplica dados.
      operationId: reprocessFile
      responses:
        "202": { description: Na fila, content: { application/json: { schema: { $ref: "#/components/schemas/SourceFileResponse" } } } }
        "409": { description: Já está em processamento }
  /condominiums/{condominiumId}/files/{id}/category:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }, { $ref: "#/components/parameters/FileId" }]
    put:
      summary: Troca a categoria e reprocessa o arquivo (GESTOR ou ADMIN, RF-01.7). Mesma categoria não faz nada.
      operationId: changeFileCategory
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ChangeCategoryRequest" } } }
      responses:
        "200": { description: Categoria trocada (arquivo na fila de novo), content: { application/json: { schema: { $ref: "#/components/schemas/SourceFileResponse" } } } }
        "400": { description: Categoria não informada ou inválida }
        "403": { description: Perfil sem permissão }
        "404": { description: Não encontrado }
        "409": { description: Já está em processamento }
  /condominiums/{condominiumId}/dashboard:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }]
    get:
      summary: Números da tela inicial, do fluxo de caixa mais recente
      operationId: dashboard
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DashboardResponse" } } } }
        "204": { description: Ainda não há fluxo de caixa processado }
  /condominiums/{condominiumId}/operating-fund:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }]
    put:
      summary: Confirma qual fundo é o ordinário do condomínio (GESTOR ou ADMIN)
      operationId: setOperatingFund
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fundId]
              properties: { fundId: { type: string, format: uuid } }
      responses:
        "204": { description: Confirmado }
        "403": { description: Perfil sem permissão }
        "404": { description: Fundo não é deste condomínio }
  /condominiums/{condominiumId}/context:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }]
    get:
      summary: Contexto do condomínio para montar a tela (módulos ligados). Qualquer perfil com acesso ao condomínio.
      description: |
        O menu "Assistente" depende de ASSISTANT estar em modulosLigados (RF-10.2, RF-10.3). Ligar ou desligar vale
        no próximo carregamento, sem reinício. Com o módulo ligado, "assistente" traz o modo de IA efetivo (RF-04.16),
        para a tela escolher entre chat + busca, aviso do MCP + busca ou só busca; nunca traz a chave.
      operationId: condominiumContext
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CondominiumContextResponse" } } } }
        "403": { description: Sem acesso a este condomínio }
        "404": { description: Condomínio não encontrado }
  /condominiums/{condominiumId}/features:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }]
    get:
      summary: Catálogo de módulos com o estado no condomínio (RF-10.1). Qualquer perfil com acesso; só leitura.
      operationId: listFeatures
      responses:
        "200":
          description: OK, na ordem do catálogo
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FeatureResponse" } } } }
        "403": { description: Sem acesso a este condomínio }
  /condominiums/{condominiumId}/features/{code}:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }, { $ref: "#/components/parameters/FeatureCode" }]
    put:
      summary: Liga ou desliga um módulo no condomínio (só ADMIN, o administrador da plataforma no MVP; RF-10.2)
      description: |
        Grava o estado e um evento na trilha de ativação (só de inclusão), com motivo opcional. Pedir o estado que
        já vale não faz nada (nenhum evento). Ligar o ASSISTANT coloca todos os arquivos do condomínio na fila de
        indexação depois da resposta (RF-10.4); desligar não apaga índice nem originais (RF-10.5).
      operationId: changeFeature
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ChangeFeatureRequest" } } }
      responses:
        "200": { description: Estado depois da alteração, content: { application/json: { schema: { $ref: "#/components/schemas/FeatureResponse" } } } }
        "400": { description: Estado não informado ou motivo acima de 500 caracteres, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { description: Perfil sem permissão }
        "404": { description: Módulo fora do catálogo ou condomínio não encontrado }
  /condominiums/{condominiumId}/features/{code}/events:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }, { $ref: "#/components/parameters/FeatureCode" }]
    get:
      summary: Trilha de ativação do módulo no condomínio, da mais antiga para a mais recente (só ADMIN; RF-10.6)
      operationId: featureEvents
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FeatureEventResponse" } } } }
        "403": { description: Perfil sem permissão }
        "404": { description: Módulo fora do catálogo }
  /condominiums/{condominiumId}/features/{code}/periods:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }, { $ref: "#/components/parameters/FeatureCode" }]
    get:
      summary: Períodos ativos do módulo no condomínio, calculados da trilha (só ADMIN; RF-10.6)
      operationId: featurePeriods
      responses:
        "200":
          description: OK, do mais antigo para o mais recente
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ActivePeriodResponse" } } } }
        "403": { description: Perfil sem permissão }
        "404": { description: Módulo fora do catálogo }
  /condominiums/{condominiumId}/usage:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }]
    get:
      summary: Uso dos módulos no período, por função e por mês (só ADMIN no MVP; RF-09.7, Q17)
      description: |
        Datas no fuso de Brasília, fim incluído. Custo estimado em US$ (RF-09.7; ADR 0003, Decisão 4): tokens × preço
        por milhão de tokens do catálogo de IA do rag, calculado na hora (nada de custo é gravado), em decimal exato e
        arredondado a 2 casas (meio para cima) só em cada total. Não é valor de cobrança. Rag fora do ar: o uso sai
        normalmente, com custoDisponivel = false e sem valores de custo.
      operationId: featureUsage
      parameters:
        - { name: start, in: query, required: true, schema: { type: string, format: date } }
        - { name: end, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UsageResponse" } } } }
        "400": { description: Datas ausentes ou início depois do fim }
        "403": { description: Perfil sem permissão }
  /condominiums/{condominiumId}/usage/export:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }]
    get:
      summary: Exporta os períodos ativos e o uso do período em Excel (só ADMIN; RF-10.6, RF-09.7)
      description: |
        Arquivo .xlsx com duas abas: "Períodos ativos" (os que tocam o período pedido) e "Uso por mês". Datas no
        horário de Brasília. A aba "Uso por mês" traz a coluna "Custo estimado (US$)" (texto 1.234,56, 2 casas só nos
        totais), uma linha "Total do período" e, com o rag fora do ar, um aviso de custo indisponível. Custo estimado
        não é valor de cobrança; nenhum valor de cobrança é calculado nesta fase.
      operationId: exportFeatureUsage
      parameters:
        - { name: start, in: query, required: true, schema: { type: string, format: date } }
        - { name: end, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200": { description: Planilha Excel, content: { application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } } } }
        "400": { description: Datas ausentes ou início depois do fim }
        "403": { description: Perfil sem permissão }
  /condominiums/{condominiumId}/budgets:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }]
    get:
      summary: POs lidas do condomínio, da mais recente para a mais antiga (todos os perfis, RF-03.1.1)
      operationId: listBudgets
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/BudgetSummaryResponse" } } } }
        "403": { description: Sem acesso ao condomínio }
  /condominiums/{condominiumId}/budgets/{budgetId}:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }, { $ref: "#/components/parameters/BudgetId" }]
    get:
      summary: PO com linhas, conferências, avisos e pendências (todos os perfis, RF-03.1.1 e RF-03.1.2)
      operationId: budgetDetail
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BudgetDetailResponse" } } } }
        "403": { description: Sem acesso ao condomínio }
        "404": { description: Não encontrada }
  /condominiums/{condominiumId}/budgets/{budgetId}/confirmation:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }, { $ref: "#/components/parameters/BudgetId" }]
    post:
      summary: Confirma a PO e o exercício (só ADMIN, RF-03.1.3; ciente da divergência, Q29)
      description: |
        Registra exercício, ata (ou "sem ata"), código efetivo das linhas com código impresso repetido e a ligação de
        cada linha de fundo (1.9.x) a um fundo do fluxo. Os valores lidos nunca são editados. PO lida com divergência
        de soma só é confirmada com cienteDivergencia e justificativa. Só uma PO vale para cada mês: sobreposição com
        PO confirmada exige reaprovacao (a anterior passa a SUPERSEDED a partir do início da nova).
        Fundo de reserva acima do teto (Conv. 20.1) gera achado WARNING; aprovação fora do 1º trimestre gera só aviso.
      operationId: confirmBudget
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BudgetConfirmationRequest" } } }
      responses:
        "200": { description: Confirmada, content: { application/json: { schema: { $ref: "#/components/schemas/BudgetDetailResponse" } } } }
        "403": { description: Perfil sem permissão (Gestor e Usuário) ou sem acesso ao condomínio }
        "404": { description: PO não encontrada }
        "409": { description: PO já confirmada ou outra PO confirmada vale nos mesmos meses, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: Confirmação recusada (lista em motivos), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /condominiums/{condominiumId}/budgets/{budgetId}/account-mappings:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }, { $ref: "#/components/parameters/BudgetId" }]
    get:
      summary: De-para das contas do fluxo nesta versão da PO (todos os perfis, RF-03.1.4 e RF-03.1.13)
      description: |
        Contas do fluxo com débito no fundo Condomínio no exercício da PO, mais as contas que já têm de-para.
        Conta sem de-para tem estado nulo. Só CONFIRMED entra no previsto × realizado.
      operationId: listAccountMappings
      parameters:
        - name: filtro
          in: query
          required: false
          schema: { $ref: "#/components/schemas/AccountMappingFilter" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AccountMappingsResponse" } } } }
        "403": { description: Sem acesso ao condomínio }
        "404": { description: PO não encontrada }
  /condominiums/{condominiumId}/budgets/{budgetId}/account-mappings/{account}:
    parameters:
      - { $ref: "#/components/parameters/CondominiumId" }
      - { $ref: "#/components/parameters/BudgetId" }
      - { name: account, in: path, required: true, description: Código da conta do fluxo como impresso (ex. 0028), schema: { type: string, pattern: "^[0-9]{1,20}$" } }
    put:
      summary: Admin escolhe o destino de uma conta (só ADMIN, RF-03.1.4 e RF-03.1.5)
      description: |
        Destino BUDGET_LINE aponta para uma linha de despesa da PO (grupos 1.1 a 1.8) pelo id, nunca pela conta da PO.
        Com confirmar nulo ou true, o de-para fica CONFIRMED; com false, SUGGESTED. A trilha registra o destino e o
        estado anteriores e novos.
      operationId: setAccountMapping
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MappingTargetRequest" } } }
      responses:
        "200": { description: Gravado, content: { application/json: { schema: { $ref: "#/components/schemas/AccountMappingResponse" } } } }
        "403": { description: Perfil sem permissão (Gestor e Usuário) ou sem acesso ao condomínio }
        "404": { description: PO não encontrada }
        "409": { description: PO ainda não confirmada }
        "422": { description: Destino inválido (linha de outra PO, de fundo, de total ou de grupo) }
  /condominiums/{condominiumId}/budgets/{budgetId}/account-mappings/batch:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }, { $ref: "#/components/parameters/BudgetId" }]
    post:
      summary: Confirma ou recusa várias contas de uma vez (só ADMIN, RF-03.1.13), um evento por conta
      operationId: accountMappingBatch
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccountMappingBatchRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AccountMappingBatchResponse" } } } }
        "403": { description: Perfil sem permissão ou sem acesso ao condomínio }
        "404": { description: PO não encontrada }
        "409": { description: PO ainda não confirmada }
  /condominiums/{condominiumId}/budgets/{budgetId}/account-mappings/suggestions:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }, { $ref: "#/components/parameters/BudgetId" }]
    post:
      summary: Gera sugestões para as contas sem de-para (só ADMIN, RF-03.1.5), sem IA
      description: |
        Primeiro a versão anterior da PO (só o que estava confirmado; linha igual = mesmo código efetivo, conta e
        descrição), depois a comparação de nomes (sem dígitos, sem acento; nota mínima configurável; empate não
        sugere). Tudo entra SUGGESTED, com o motivo. Nenhuma conta é confirmada e nenhum número muda.
      operationId: suggestAccountMappings
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AccountMappingSuggestionsResponse" } } } }
        "403": { description: Perfil sem permissão ou sem acesso ao condomínio }
        "404": { description: PO não encontrada }
        "409": { description: PO ainda não confirmada }
  /condominiums/{condominiumId}/budgets/{budgetId}/account-mappings/sheet:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }, { $ref: "#/components/parameters/BudgetId" }]
    post:
      summary: Carrega a planilha de sugestões (CSV "conta do fluxo;linha da PO"), só ADMIN (RF-03.1.5)
      description: |
        Formato do mapa do piloto, separado por ponto e vírgula, com ou sem cabeçalho, UTF-8 ou Windows-1252. Destino:
        código efetivo de uma linha de despesa, "AJUSTE (...)", "REALOCAR (...)" ou "TRANSFERENCIA (...)". Tudo entra
        SUGGESTED; conta já confirmada não muda; linha inválida é listada e não entra.
      operationId: uploadAccountMappingSheet
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: { file: { type: string, format: binary } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AccountMappingSheetResponse" } } } }
        "403": { description: Perfil sem permissão ou sem acesso ao condomínio }
        "404": { description: PO não encontrada }
        "409": { description: PO ainda não confirmada }
        "413": { description: Planilha acima de 1 MB }
  /condominiums/{condominiumId}/budgets/{budgetId}/account-mappings/events:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }, { $ref: "#/components/parameters/BudgetId" }]
    get:
      summary: Trilha do de-para (todos os perfis), só de inserção
      operationId: accountMappingEvents
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AccountMappingEventResponse" } } } }
        "403": { description: Sem acesso ao condomínio }
        "404": { description: PO não encontrada }
  /condominiums/{condominiumId}/budget-items:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }]
    get:
      summary: Catálogo de rubricas do condomínio (todos os perfis, RF-11.7)
      description: |
        Linhas de exercícios diferentes ligadas à mesma rubrica correspondem na comparação entre exercícios
        (ADR 0005, Decisão 1). A primeira PO confirmada do condomínio gera uma rubrica por linha. Rubrica nunca é apagada.
      operationId: listBudgetItems
      responses:
        "200":
          description: OK, em ordem de nome
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/BudgetItemResponse" } } } }
        "403": { description: Sem acesso ao condomínio }
    post:
      summary: Cria uma rubrica no catálogo (só ADMIN, RF-11.7), com evento na trilha
      operationId: createBudgetItem
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewBudgetItemRequest" } } }
      responses:
        "201": { description: Criada, content: { application/json: { schema: { $ref: "#/components/schemas/BudgetItemResponse" } } } }
        "403": { description: Perfil sem permissão (Gestor e Usuário) ou sem acesso ao condomínio }
        "422": { description: Nome vazio ou acima de 300 caracteres }
  /condominiums/{condominiumId}/budget-items/{itemId}:
    parameters:
      - { $ref: "#/components/parameters/CondominiumId" }
      - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      summary: Troca o nome da rubrica (só ADMIN, RF-11.7), com evento na trilha
      operationId: renameBudgetItem
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RenameBudgetItemRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BudgetItemResponse" } } } }
        "403": { description: Perfil sem permissão ou sem acesso ao condomínio }
        "422": { description: Rubrica de outro condomínio, nome vazio ou acima de 300 caracteres }
  /condominiums/{condominiumId}/budgets/{budgetId}/budget-items:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }, { $ref: "#/components/parameters/BudgetId" }]
    get:
      summary: Rubrica de cada linha da PO (todos os perfis, RF-11.7)
      description: |
        Todas as linhas de despesa e de fundo da PO, na ordem do documento. Linha sem rubrica tem estado nulo. Só
        CONFIRMED entra na comparação por linha entre exercícios; o resto fica "sem correspondência".
      operationId: listBudgetLineItems
      parameters:
        - name: filtro
          in: query
          required: false
          schema: { $ref: "#/components/schemas/BudgetItemFilter" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BudgetItemsResponse" } } } }
        "403": { description: Sem acesso ao condomínio }
        "404": { description: PO não encontrada }
  /condominiums/{condominiumId}/budgets/{budgetId}/budget-items/{lineId}:
    parameters:
      - { $ref: "#/components/parameters/CondominiumId" }
      - { $ref: "#/components/parameters/BudgetId" }
      - { name: lineId, in: path, required: true, description: Id da linha da PO, schema: { type: string, format: uuid } }
    put:
      summary: Admin escolhe a rubrica de uma linha (só ADMIN, RF-11.7)
      description: |
        Uma rubrica do catálogo (rubricaId) ou uma nova criada a partir da linha (novaRubrica, com o nome), nunca os
        dois. Com confirmar nulo ou true, fica CONFIRMED; com false, SUGGESTED. A trilha registra a rubrica e o estado
        anteriores e novos.
      operationId: setLineBudgetItem
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LineBudgetItemRequest" } } }
      responses:
        "200": { description: Gravado, content: { application/json: { schema: { $ref: "#/components/schemas/BudgetLineItemResponse" } } } }
        "403": { description: Perfil sem permissão (Gestor e Usuário) ou sem acesso ao condomínio }
        "404": { description: PO não encontrada }
        "409": { description: PO ainda não confirmada }
        "422": { description: Linha que não é de despesa ou de fundo desta PO, rubrica de outro condomínio, ou rubricaId e novaRubrica juntos }
  /condominiums/{condominiumId}/budgets/{budgetId}/budget-items/batch:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }, { $ref: "#/components/parameters/BudgetId" }]
    post:
      summary: Confirma ou recusa a rubrica de várias linhas (só ADMIN, RF-11.7), um evento por linha
      operationId: budgetItemBatch
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BudgetItemBatchRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BudgetItemBatchResponse" } } } }
        "403": { description: Perfil sem permissão ou sem acesso ao condomínio }
        "404": { description: PO não encontrada }
        "409": { description: PO ainda não confirmada }
        "422": { description: Sem ação ou sem linhas }
  /condominiums/{condominiumId}/budgets/{budgetId}/budget-items/suggestions:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }, { $ref: "#/components/parameters/BudgetId" }]
    post:
      summary: Gera as rubricas da PO (só ADMIN, RF-11.7), sem IA
      description: |
        Também roda sozinho na confirmação da PO. Se o condomínio ainda não tem rubricas, cada linha desta PO vira uma
        rubrica, já CONFIRMED (primeiraPo). Senão, para cada linha ainda sem rubrica: primeiro a linha igual da versão
        anterior do mesmo exercício (mesmo código efetivo e mesma conta); depois a rubrica das linhas confirmadas de
        outras POs com a mesma conta da PO e o mesmo grupo. Conta repetida no mesmo grupo desta PO, conta em mais de
        uma rubrica ou nenhuma: sem sugestão. Nunca usa o código do item. Tudo entra SUGGESTED, com o motivo.
      operationId: suggestBudgetItems
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BudgetItemSuggestionsResponse" } } } }
        "403": { description: Perfil sem permissão ou sem acesso ao condomínio }
        "404": { description: PO ou condomínio não encontrado }
        "409": { description: PO ainda não confirmada }
  /condominiums/{condominiumId}/budgets/{budgetId}/budget-items/events:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }, { $ref: "#/components/parameters/BudgetId" }]
    get:
      summary: Trilha das rubricas das linhas desta PO (todos os perfis), só de inserção
      operationId: budgetItemEvents
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/BudgetItemEventResponse" } } } }
        "403": { description: Sem acesso ao condomínio }
        "404": { description: PO não encontrada }
  /condominiums/{condominiumId}/budget-vs-actual:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }]
    get:
      summary: Previsto × realizado do mês ou acumulado do exercício (todos os perfis, RF-03.1.6 a RF-03.1.11)
      description: |
        Calculado na consulta pela função pura CalculoPrevistoRealizado (versaoCalculo no resultado); nada é gravado.
        Realizado = débitos do fundo Condomínio (fundo ordinário) pelo de-para CONFIRMED; ajustes, a realocar e sem
        linha da PO à parte; transferências entre fundos fora. Previsto do mês = soma das linhas 1.1 a 1.8 (Q30).
        Fundos ligados às linhas 1.9: arrecadação (recebimento de cota) × previsto. Mês sem fluxo, com dois fluxos,
        sem PO, com PO não confirmada ou sem fundo ordinário: situacao diz o porquê e os números ficam nulos.
      operationId: budgetVsActual
      parameters:
        - { name: period, in: query, required: true, description: AAAA-MM ou "cumulative", schema: { type: string, pattern: "^([0-9]{4}-[0-9]{2}|cumulative)$" } }
        - { name: budget, in: query, required: false, description: Versão da PO; sem ela, a que vale no mês (no acumulado, a confirmada mais recente), schema: { type: string, format: uuid } }
        - { name: fund, in: query, required: false, description: 'Filtro de fundo (RF-03.1.13). O fundo ordinário mostra só o fundo Condomínio (sem o painel dos fundos); outro fundo mostra só o painel dele, com totais, grupos, blocos, conferência e regra dos 20% nulos ou vazios e provisorio = false. Sem ele, tudo', schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BudgetVsActualResponse" } } } }
        "400": { description: Período inválido }
        "403": { description: Sem acesso ao condomínio }
        "404": { description: Condomínio, PO ou fundo não encontrados }
  /condominiums/{condominiumId}/budget-vs-actual/evidence:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }]
    get:
      summary: Lançamentos que compõem um número do previsto × realizado (todos os perfis, RF-03.1.12)
      operationId: budgetVsActualEvidence
      parameters:
        - { name: period, in: query, required: true, schema: { type: string, pattern: "^([0-9]{4}-[0-9]{2}|cumulative)$" } }
        - { name: budget, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: target, in: query, required: true, description: '"line:<lineId>", "group:<lineId do grupo>" (as linhas do grupo, na ordem da PO), "total" (despesa realizada: linhas de todos os grupos, depois TO_REALLOCATE e NO_BUDGET_LINE), "fund:<fundoId>" (arrecadação), ADJUSTMENTS, TO_REALLOCATE, NO_BUDGET_LINE ou TRANSFERS', schema: { type: string } }
      responses:
        "200":
          description: OK (lista vazia quando o alvo não tem lançamento)
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/EvidenceResponse" } } } }
        "400": { description: Período ou alvo inválido }
        "403": { description: Sem acesso ao condomínio }
  /ai/providers:
    get:
      summary: Catálogo de provedores e modelos de IA, lido do rag (só ADMIN; RF-09.6, ADR 0003)
      description: |
        Para os campos de provedor e modelo da tela "IA do condomínio". O catálogo é mantido na configuração do rag;
        a chave pública do rag não sai por aqui. Preços em dólar por milhão de tokens, só para o custo estimado.
      operationId: listAiProviders
      responses:
        "200":
          description: OK, na ordem do catálogo
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AiProviderResponse" } } } }
        "403": { description: Perfil sem permissão }
        "503": { description: Rag fora do ar, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /condominiums/{condominiumId}/ai:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }]
    get:
      summary: Configuração de IA do condomínio, geral e do Assistente (só ADMIN; RF-09.1, RF-09.2, RF-09.6)
      description: |
        Sem configuração gravada: modo geral EXTERNAL_MCP (padrão do piloto), respostas do Assistente herdando o modo
        geral e embeddings LOCAL com ollama-local/bge-m3. A chave nunca volta: só chaveCadastrada e chaveFinal.
      operationId: getAiConfiguration
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AiConfigurationResponse" } } } }
        "403": { description: Perfil sem permissão ou sem acesso ao condomínio }
        "404": { description: Condomínio não encontrado }
    put:
      summary: Grava a configuração de IA do condomínio (só ADMIN; RF-09.1, RF-09.2, RF-09.6)
      description: |
        Substitui a configuração inteira (modo geral e Assistente). A chave é só de escrita: ausente ou nula mantém a
        guardada; preenchida troca; removerChave apaga. O backend cifra a chave com a chave pública do rag e não
        consegue lê-la depois. Cada gravação que muda algo entra na trilha da configuração de IA (só de inserção) com
        quem, quando, valores anteriores e novos; da chave, só "chave trocada" e os 4 últimos caracteres.
        Recusas (422, lista em motivos): modo de respostas LOCAL (previsto, ainda sem provedor); API_KEY sem chave
        guardada nem nova; provedor ou modelo fora do catálogo ou de uso errado; embeddings diferente de LOCAL ou
        OFF, ou com provedor que não é local (Q12).
      operationId: saveAiConfiguration
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AiConfigurationRequest" } } }
      responses:
        "200": { description: Configuração depois da gravação, content: { application/json: { schema: { $ref: "#/components/schemas/AiConfigurationResponse" } } } }
        "400": { description: Corpo ausente ou mal formado, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { description: Perfil sem permissão ou sem acesso ao condomínio }
        "404": { description: Condomínio não encontrado }
        "422": { description: Configuração recusada (lista em motivos), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "503": { description: Rag fora do ar ou sem chave pública; com chave nova, nada é gravado, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /condominiums/{condominiumId}/assistant/questions:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }]
    post:
      summary: Pergunta ao assistente, com citações dos documentos e números das ferramentas (USUARIO, GESTOR ou ADMIN; RF-04.8 a RF-04.16)
      description: |
        Só com o módulo Assistente ligado e o modo de respostas efetivo API_KEY. O backend chama o rag (gRPC Perguntar,
        prazo de 120 s), junta o fluxo e devolve a resposta inteira, já validada. O histórico só existe na tela
        (RF-04.11): o frontend manda as trocas anteriores e o backend usa as últimas 6. Citações de arquivos que o
        usuário não pode ver ou que foram excluídos são descartadas na volta. Gera o registro de uso "pergunta".
      operationId: askAssistant
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/QuestionRequest" } } }
      responses:
        "200": { description: Resposta (ANSWERED ou NOT_FOUND), content: { application/json: { schema: { $ref: "#/components/schemas/AssistantAnswerResponse" } } } }
        "400": { description: Pergunta vazia ou acima de 2000 caracteres, ou filtro inválido, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { description: Perfil sem permissão, sem acesso ao condomínio ou módulo não contratado (modulo = ASSISTANT), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { description: Condomínio não encontrado }
        "409":
          description: |
            Chat indisponível no modo atual, sem chamar o rag (modoIa diz qual). EXTERNAL_MCP: "O assistente deste
            condomínio é o seu Claude, conectado ao MCP." OFF: "A IA está desligada neste condomínio." Também
            sem chave cadastrada ou chave que o rag não consegue ler ("cadastre a chave de novo").
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "422": { description: Chave de IA do condomínio recusada pelo provedor, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "429": { description: Limite de uso do provedor de IA atingido; tentar mais tarde, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "503": { description: Rag ou provedor de IA fora do ar, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "504": { description: A resposta passou do prazo, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /condominiums/{condominiumId}/assistant/search:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }]
    post:
      summary: Busca por palavra nos documentos, sem IA (todos os perfis; RF-04.18)
      description: |
        Só com o módulo Assistente ligado, em qualquer modo de IA (inclusive OFF, Q7). Devolve trechos citáveis
        do mais relevante para o menos relevante, sem resposta redigida. Aceita "frase entre aspas" e exclusão com -.
        Gera o registro de uso "busca_documentos".
      operationId: searchDocuments
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DocumentSearchRequest" } } }
      responses:
        "200":
          description: OK (lista vazia quando nada foi encontrado)
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DocumentChunkResponse" } } } }
        "400": { description: Texto vazio, limite fora de 1 a 50 ou filtro inválido, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { description: Sem acesso ao condomínio ou módulo não contratado (modulo = ASSISTANT), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { description: Condomínio não encontrado }
        "503": { description: Rag fora do ar, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /condominiums/{condominiumId}/budget-vs-actual/export:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }]
    get:
      summary: Exporta a mesma visão do previsto × realizado em PDF ou Excel (todos os perfis, RF-03.1.14)
      description: |
        Gerado do mesmo resultado do GET /previsto-realizado (mesma função, mesmos filtros): os números são os do
        JSON. Cabeçalho com condomínio, PO (arquivo, versão, hash e exercício), período, data e hora, quem gerou e
        estado do de-para. Com valor a realocar ou sem linha da PO, traz "PROVISÓRIO" e a lista desses lançamentos.
        Sem gráfico. Excel com as abas "Resumo" e "Evidência" (um lançamento por linha, com arquivo, página e hash).
        Mês sem números (sem fluxo, dois fluxos etc.) exporta a mensagem no lugar dos números.
      operationId: exportBudgetVsActual
      parameters:
        - { name: format, in: query, required: true, schema: { type: string, enum: [pdf, xlsx] } }
        - { name: period, in: query, required: true, description: AAAA-MM ou "cumulative", schema: { type: string, pattern: "^([0-9]{4}-[0-9]{2}|cumulative)$" } }
        - { name: budget, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: fund, in: query, required: false, description: 'Filtro de fundo (RF-03.1.13). O fundo ordinário mostra só o fundo Condomínio (sem o painel dos fundos); outro fundo mostra só o painel dele, com totais, grupos, blocos, conferência e regra dos 20% nulos ou vazios e provisorio = false. Sem ele, tudo', schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Arquivo (Content-Disposition attachment; previsto-realizado-<periodo>.pdf ou .xlsx)
          content:
            application/pdf: { schema: { type: string, format: binary } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
        "400": { description: Formato ou período inválido }
        "403": { description: Sem acesso ao condomínio }
        "404": { description: Condomínio, PO ou fundo não encontrados }
  /condominiums/{condominiumId}/funds:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }]
    get:
      summary: Fundos do fluxo do condomínio, pelo nome impresso (todos os perfis; RF-03.1.9 e RF-03.1.13)
      description: Lista para ligar as linhas 1.9 e para o filtro de fundo, em ordem de nome. "OBRAS" e "OBRAS / REFORMAS / INFRA" são itens separados.
      operationId: listFunds
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FundResponse" } } } }
        "403": { description: Sem acesso ao condomínio }
        "404": { description: Condomínio não encontrado }
  /condominiums/{condominiumId}/budgets/{budgetId}/funds:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }, { $ref: "#/components/parameters/BudgetId" }]
    put:
      summary: Altera a ligação das linhas 1.9 aos fundos depois da confirmação (só Admin; RF-03.1.9)
      description: |
        A lista é a ligação completa: linha 1.9.x ausente ou com fundoId nulo fica sem fundo. Cada linha com no máximo
        um fundo, cada fundo em no máximo uma linha, nunca o fundo ordinário. A trilha da PO (GET .../eventos) recebe um
        evento FUNDS_CHANGED com o fundo anterior e o novo de cada linha, quem e quando. Sem mudança, nada é gravado.
        Os achados são recalculados depois do commit.
      operationId: changeBudgetFunds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [funds]
              properties:
                funds:
                  type: array
                  items:
                    type: object
                    required: [lineId]
                    properties:
                      lineId: { type: string, format: uuid }
                      fundId: { type: [string, "null"], format: uuid }
      responses:
        "200": { description: PO com a nova ligação, content: { application/json: { schema: { $ref: "#/components/schemas/BudgetDetailResponse" } } } }
        "403": { description: Gestor, Usuário ou sem acesso ao condomínio }
        "404": { description: PO não encontrada }
        "409": { description: PO ainda não confirmada }
        "422": { description: Ligação recusada, com os motivos, content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /condominiums/{condominiumId}/budgets/{budgetId}/extension:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }, { $ref: "#/components/parameters/BudgetId" }]
    put:
      summary: Marca a PO como prorrogada até um mês (só ADMIN, RF-11.3), com justificativa
      description: |
        Os meses do mês seguinte ao fim do exercício até "ate" usam esta PO e o seu de-para, com a marca "PO
        prorrogada", e ficam fora do acumulado do exercício. Recusada sem justificativa, com mês que já tem PO
        confirmada ou prorrogação de outra PO, ou com PO substituída. Uma PO confirmada depois sobre meses prorrogados
        encurta a prorrogação, com evento automático. Nunca é automática.
      operationId: extendBudget
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BudgetExtensionRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BudgetDetailResponse" } } } }
        "403": { description: Perfil sem permissão (Gestor e Usuário) ou sem acesso ao condomínio }
        "404": { description: PO não encontrada }
        "409": { description: PO não confirmada ou substituída }
        "422": { description: Sem justificativa, mês inválido ou mês com outra PO }
    delete:
      summary: Desfaz a prorrogação (só ADMIN, RF-11.3), com evento
      operationId: undoBudgetExtension
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BudgetDetailResponse" } } } }
        "403": { description: Perfil sem permissão ou sem acesso ao condomínio }
        "404": { description: PO não encontrada }
        "409": { description: PO não confirmada, substituída ou sem prorrogação }
  /condominiums/{condominiumId}/fiscal-years:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }]
    get:
      summary: Exercícios do condomínio, do mais recente para o mais antigo (todos os perfis, RF-11.4 e RF-11.5)
      description: |
        Um item por PO confirmada (id "budget:<uuid>"), com os meses do exercício e os prorrogados, a situação do fluxo de
        cada mês e o estado do de-para e das rubricas. Quando a PO mais antiga não tem PO anterior confirmada (a que
        cobre o mês anterior ao início dela), a coluna "Orçado anterior" dela entra logo depois como exercício
        "AAAA/AAAA (coluna impressa)" (id "column:<uuid da PO>"), só com previsto. Quando a PO anterior é confirmada,
        ela substitui a coluna sem ação extra: o item dela traz "colunaImpressa" e os avisos de diferença por grupo.
        Nada é gravado.
      operationId: listFiscalYears
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FiscalYearResponse" } } } }
        "403": { description: Sem acesso ao condomínio }
  /condominiums/{condominiumId}/fiscal-year-comparison:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }]
    get:
      summary: Comparar exercícios (todos os perfis, RF-11.6)
      description: |
        Três visões: resumo por exercício, por grupo (1.1 a 1.9, casados pelo código) e por linha (casadas pela rubrica
        confirmada, RF-11.7; linha sem rubrica confirmada fica em "semCorrespondencia" e nunca é somada a outra).
        Exercícios do mais recente para o mais antigo; a variação de cada um é contra o seguinte da lista. Variação em
        % só com base diferente de zero; base zero com valor = "novaNoExercicio". O realizado vem do mesmo cálculo do
        previsto × realizado; "alvo" abre a evidência nele (com o poId e o "periodo" do exercício). Nada é gravado.
      operationId: compareFiscalYears
      parameters:
        - name: exercicios
          in: query
          required: false
          description: Ids separados por vírgula ("budget:<uuid>" ou o uuid, e "column:<uuid>"); vazio = os dois mais recentes
          style: form
          explode: false
          schema: { type: array, items: { type: string } }
        - name: fundo
          in: query
          required: false
          description: Fundo Condomínio = sem os fundos 1.9; outro fundo = só a linha 1.9 dele (arrecadação); vazio = tudo
          schema: { type: string, format: uuid }
        - name: mesmosMeses
          in: query
          required: false
          description: Compara só os meses (pelo número) com fluxo em todos os exercícios com PO
          schema: { type: boolean, default: false }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/FiscalYearComparisonResponse" } } } }
        "400": { description: Id de exercício inválido }
        "403": { description: Sem acesso ao condomínio }
        "404": { description: Exercício, PO, coluna ou fundo não encontrado }
        "422": { description: Menos de dois exercícios }
  /condominiums/{condominiumId}/indicators:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }]
    get:
      summary: Séries dos 7 gráficos da tela "Indicadores" (todos os perfis, RF-11.10 a RF-11.12)
      description: |
        Números prontos, os mesmos da tela de previsto × realizado (o frontend só desenha). Mês sem fluxo carregado ou
        com dois fluxos vem com os números nulos e a situação, nunca com zero. Cada ponto traz o mês e o "alvo" da
        evidência no previsto × realizado (período = o mês do ponto; no gráfico 5, "cumulative"). Gráficos 1 a 5 são do
        fundo Condomínio; o 6, dos fundos ligados às linhas 1.9; o 7, deste exercício contra o anterior da lista de
        exercícios. Filtro de fundo: o fundo Condomínio tira o 6; outro fundo tira 1 a 5 e deixa no 6 só ele.
      operationId: indicators
      parameters:
        - { name: budget, in: query, required: false, description: PO do exercício; vazio = o mais recente, schema: { type: string, format: uuid } }
        - { name: fund, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/IndicatorsResponse" } } } }
        "403": { description: Sem acesso ao condomínio }
        "404": { description: PO confirmada ou fundo não encontrado }
  /condominiums/{condominiumId}/budgets/{budgetId}/printed-column:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }, { $ref: "#/components/parameters/BudgetId" }]
    get:
      summary: Conferência da coluna "Orçado anterior" da PO (todos os perfis, RF-11.5)
      description: |
        Soma das linhas de cada grupo contra o subtotal impresso, e total impresso contra a soma dos subtotais (com ou
        sem os fundos), na tolerância da PO. Grupos, fundos e previsto do mês seguem a soma das linhas. Com PO anterior
        confirmada, traz as diferenças por grupo entre ela e a coluna (aviso, não achado).
      operationId: printedColumn
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PrintedColumnCheckResponse" } } } }
        "403": { description: Sem acesso ao condomínio }
        "404": { description: PO não confirmada ou sem a coluna "Orçado anterior" }
  /condominiums/{condominiumId}/budgets/{budgetId}/events:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }, { $ref: "#/components/parameters/BudgetId" }]
    get:
      summary: Trilha da PO (todos os perfis), só de inserção
      description: Confirmação (CONFIRMED), substituição (SUPERSEDED) e alterações da ligação dos fundos (FUNDS_CHANGED).
      operationId: budgetEvents
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/BudgetEventResponse" } } } }
        "403": { description: Sem acesso ao condomínio }
        "404": { description: PO não encontrada }
  /condominiums/{condominiumId}/reallocations:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }]
    get:
      summary: Realocações de uma versão da PO, ativas e desfeitas (todos os perfis, RF-03.1.7)
      operationId: listReallocations
      parameters:
        - { name: budget, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ReallocationResponse" } } } }
        "403": { description: Sem acesso ao condomínio }
        "404": { description: PO não encontrada }
    post:
      summary: Realoca um lançamento "a realocar" para uma linha de despesa da PO (Gestor e Admin, RF-03.1.7)
      description: |
        Só débitos do fundo Condomínio cuja conta tem de-para CONFIRMED para TO_REALLOCATE, e só para linhas 1.1 a 1.8 da
        PO que vale no mês do lançamento. O lançamento original não muda. A realocação guarda a impressão do lançamento
        (arquivo, página, ordem, data, conta, documento e valor) e sobrevive ao reprocesso do mesmo fluxo. Os achados
        são recalculados depois do commit.
      operationId: reallocate
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReallocationRequest" } } }
      responses:
        "200": { description: Realocado, content: { application/json: { schema: { $ref: "#/components/schemas/ReallocationResponse" } } } }
        "403": { description: Usuário (só consulta) ou sem acesso ao condomínio }
        "404": { description: Condomínio ou lançamento não encontrado }
        "409": { description: Sem PO aprovada no mês, ou lançamento já realocado }
        "422": { description: Lançamento não está em "a realocar", não é do fundo Condomínio, ou linha inválida }
  /condominiums/{condominiumId}/reallocations/{reallocationId}:
    parameters:
      - { $ref: "#/components/parameters/CondominiumId" }
      - { name: reallocationId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: Desfaz a realocação (Gestor e Admin); o valor volta a "a realocar" e nada é apagado
      operationId: undoReallocation
      responses:
        "200": { description: Desfeita (ativa = false), content: { application/json: { schema: { $ref: "#/components/schemas/ReallocationResponse" } } } }
        "403": { description: Usuário (só consulta) ou sem acesso ao condomínio }
        "404": { description: Realocação não encontrada }
        "409": { description: Já desfeita }
  /condominiums/{condominiumId}/findings:
    parameters: [{ $ref: "#/components/parameters/CondominiumId" }]
    get:
      summary: Achados com a evidência original e o histórico (todos os perfis, só leitura; RF-03.1.12)
      description: |
        Os achados do orçamento são recalculados depois de cada mudança (fluxo gravado, PO confirmada, de-para,
        fundos, realocação). Um achado por regra, mês e alvo; nunca apagado. Quando a condição deixa de existir, o
        achado aberto passa a NO_LONGER_APPLIES, com o motivo (Q27); se a condição volta, o mesmo achado volta a
        OPEN. Estados marcados por pessoa (RF-02.8) não mudam pelo recálculo.
      operationId: listFindings
      parameters:
        - { name: referenceMonth, in: query, required: false, description: AAAA-MM; sem ela, todos os meses, schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" } }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FindingResponse" } } } }
        "400": { description: Competência inválida }
        "403": { description: Sem acesso ao condomínio }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    CondominiumId: { name: condominiumId, in: path, required: true, schema: { type: string, format: uuid } }
    FileId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    FeatureCode: { name: code, in: path, required: true, description: "Código do módulo no catálogo (ex.: ASSISTANT)", schema: { type: string } }
    BudgetId: { name: budgetId, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    CondominiumContextResponse:
      type: object
      required: [condominiumId, name, enabledFeatures]
      properties:
        condominiumId: { type: string, format: uuid }
        name: { type: string }
        enabledFeatures: { type: array, items: { type: string }, description: "Códigos dos módulos ligados (ex.: [ASSISTANT])" }
        assistant:
          description: Modo de IA efetivo do Assistente (RF-04.16). Nulo ou ausente com o módulo Assistente desligado.
          anyOf:
            - { $ref: "#/components/schemas/AssistantContextResponse" }
            - { type: "null" }
    AssistantContextResponse:
      type: object
      required: [answersMode, embeddingsMode, chatAvailable]
      properties:
        answersMode: { $ref: "#/components/schemas/AiMode" }
        embeddingsMode: { $ref: "#/components/schemas/AiMode" }
        chatAvailable: { type: boolean, description: "Modo de respostas API_KEY com chave cadastrada: a tela mostra o chat" }
    AiMode:
      type: string
      description: |
        Quem executa a IA (RF-09.1, RF-09.6). EXTERNAL_MCP = o Claude do usuário conectado ao MCP (padrão do piloto);
        API_KEY = o sistema chama o provedor com a chave do condomínio; OFF = nenhuma IA; LOCAL = modelo na
        infraestrutura do cliente (nesta fase só para embeddings).
      enum: [EXTERNAL_MCP, API_KEY, "OFF", LOCAL]
    AiFunction:
      type: string
      description: ANSWERS = chat; EMBEDDINGS = busca por significado e indexação
      enum: [ANSWERS, EMBEDDINGS]
    AiProviderResponse:
      type: object
      required: [code, name, type, function, local, requiresKey, models]
      properties:
        code: { type: string, description: "Código usado na configuração (ex.: anthropic, ollama-local)" }
        name: { type: string }
        type: { type: string, description: "Implementação no rag (ex.: anthropic, ollama)" }
        function: { $ref: "#/components/schemas/AiFunction" }
        local: { type: boolean, description: "Roda na infraestrutura do sistema, sem enviar texto para fora (único aceito para embeddings, Q12)" }
        requiresKey: { type: boolean }
        dimension: { type: [integer, "null"], description: Só embeddings, dimensão dos vetores }
        models: { type: array, items: { $ref: "#/components/schemas/AiModelResponse" } }
    AiModelResponse:
      type: object
      required: [id, name, isDefault, inputPricePerMillionUsd, outputPricePerMillionUsd]
      properties:
        id: { type: string, description: "Ex.: claude-sonnet-5-5" }
        name: { type: string }
        isDefault: { type: boolean }
        inputPricePerMillionUsd: { type: string, pattern: "^[0-9]+(\\.[0-9]+)?$", description: 'US$ por milhão de tokens de entrada, texto decimal exato (ex. "2.00")' }
        outputPricePerMillionUsd: { type: string, pattern: "^[0-9]+(\\.[0-9]+)?$", description: 'US$ por milhão de tokens de saída, texto decimal exato (ex. "10.00")' }
    AiConfigurationResponse:
      type: object
      required: [generalMode, assistant]
      properties:
        generalMode: { $ref: "#/components/schemas/AiMode" }
        assistant:
          type: object
          required: [answers, embeddings]
          properties:
            answers: { $ref: "#/components/schemas/AiAnswersResponse" }
            embeddings: { $ref: "#/components/schemas/AiEmbeddingsResponse" }
        updatedBy: { type: [string, "null"], description: Nulo = nunca gravada (valem os padrões) }
        updatedAt: { type: [string, "null"], format: date-time }
    AiAnswersResponse:
      type: object
      required: [effectiveMode, keyRegistered]
      properties:
        mode: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/AiMode" }], description: Nulo = herda o modo geral }
        effectiveMode: { $ref: "#/components/schemas/AiMode" }
        provider: { type: [string, "null"], description: Código do provedor no catálogo }
        model: { type: [string, "null"], description: Id do modelo no catálogo }
        keyRegistered: { type: boolean }
        keySuffix: { type: [string, "null"], description: "Os 4 últimos caracteres da chave (ex.: \"x9Qa\"); nulo sem chave" }
    AiEmbeddingsResponse:
      type: object
      required: [mode, provider, model]
      properties:
        mode: { $ref: "#/components/schemas/AiMode" }
        provider: { type: [string, "null"], description: Nulo com OFF }
        model: { type: [string, "null"] }
    AiConfigurationRequest:
      type: object
      required: [generalMode, assistant]
      properties:
        generalMode: { $ref: "#/components/schemas/AiMode" }
        assistant:
          type: object
          required: [answers, embeddings]
          properties:
            answers:
              type: object
              properties:
                mode: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/AiMode" }], description: Nulo = herda o modo geral }
                provider: { type: [string, "null"], description: Obrigatório quando o modo efetivo é API_KEY }
                model: { type: [string, "null"], description: Nulo = modelo padrão do provedor }
                key: { type: [string, "null"], writeOnly: true, minLength: 8, maxLength: 500, description: Só de escrita. Ausente ou nula mantém a chave guardada; nunca volta em resposta nem vai para log }
                removeKey: { type: boolean, default: false, description: Apaga a chave guardada (não pode vir junto com chave) }
            embeddings:
              type: object
              required: [mode]
              properties:
                mode: { $ref: "#/components/schemas/AiMode" }
                provider: { type: [string, "null"], description: "Obrigatório com LOCAL; só provedor local do catálogo (ex.: ollama-local)" }
                model: { type: [string, "null"], description: Nulo = modelo padrão do provedor }
    DocumentFiltersRequest:
      type: object
      description: Filtros opcionais da busca e do chat (RF-04.10), aplicados antes da busca. Vazio = todos os documentos do condomínio.
      properties:
        categories: { type: array, items: { $ref: "#/components/schemas/FileCategory" } }
        startDate: { type: [string, "null"], format: date, description: Documentos cuja competência cruza o período }
        endDate: { type: [string, "null"], format: date }
        fileIds: { type: array, items: { type: string, format: uuid } }
    QuestionRequest:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 2000 }
        history:
          type: array
          description: Trocas anteriores desta conversa, da mais antiga para a mais recente (o backend usa as últimas 6)
          items:
            type: object
            required: [question, answer]
            properties: { question: { type: string }, answer: { type: string } }
        filters: { $ref: "#/components/schemas/DocumentFiltersRequest" }
    AnswerStatus:
      type: string
      description: NOT_FOUND = "Não encontrei nos documentos." (RF-04.12), sem blocos nem citações
      enum: [ANSWERED, NOT_FOUND]
    AssistantAnswerResponse:
      type: object
      required: [status, fromDocuments, fromStoredData, citations, model]
      properties:
        status: { $ref: "#/components/schemas/AnswerStatus" }
        fromDocuments:
          type: array
          description: Bloco "Nos documentos". Números transcritos vêm marcados "(conforme o documento, não conferido)"
          items:
            type: object
            required: [text, citations]
            properties:
              text: { type: string }
              citations: { type: array, items: { type: integer }, description: Números das citações (campo numero de citacoes) }
        fromStoredData:
          type: array
          description: Bloco "Nos dados gravados", montado das ferramentas de consulta (nunca escrito pelo modelo)
          items: { $ref: "#/components/schemas/StoredDataResponse" }
        citations: { type: array, items: { $ref: "#/components/schemas/DocumentCitationResponse" }, description: "Numeradas a partir de 1, na ordem da primeira citação" }
        suggestion: { type: [string, "null"], description: Categoria de documento que faltaria (RF-04.12) }
        warning: { type: [string, "null"] }
        model: { type: string, description: Modelo de IA que respondeu }
    StoredDataResponse:
      type: object
      required: [query, parameters, rows]
      properties:
        query: { type: string, description: "resumo_fundos, buscar_lancamentos, listar_arquivos ou conferencias_do_arquivo (a tela do link sai daqui)" }
        parameters:
          type: array
          description: Filtros usados na consulta
          items:
            type: object
            required: [name, value]
            properties: { name: { type: string }, value: { type: string } }
        rows:
          type: array
          items:
            type: object
            required: [label, value]
            properties: { label: { type: string }, value: { type: string, description: 'Já formatado (dinheiro como "R$ 1.234,56")' } }
        comment: { type: [string, "null"] }
    ChunkLocationResponse:
      type: object
      required: [type, description]
      description: Onde o trecho está no original. PDF abre na página (#page=N)
      properties:
        type: { type: string, enum: [PAGE, SHEET, PARAGRAPHS] }
        page: { type: [integer, "null"] }
        sheet: { type: [string, "null"] }
        startRow: { type: [integer, "null"] }
        endRow: { type: [integer, "null"] }
        startParagraph: { type: [integer, "null"] }
        endParagraph: { type: [integer, "null"] }
        section: { type: [string, "null"] }
        description: { type: string, description: 'Texto pronto para a tela (ex. "página 3", "aba Junho, linhas 10 a 14")' }
    DocumentChunkResponse:
      type: object
      required: [chunkId, fileId, fileName, category, location, text, sha256]
      properties:
        chunkId: { type: string }
        fileId: { type: string, format: uuid }
        fileName: { type: string }
        category: { $ref: "#/components/schemas/FileCategory" }
        location: { $ref: "#/components/schemas/ChunkLocationResponse" }
        text: { type: string, description: Texto literal do documento, não conferido }
        sha256: { type: string }
    DocumentCitationResponse:
      allOf:
        - { $ref: "#/components/schemas/DocumentChunkResponse" }
        - type: object
          required: [number]
          properties:
            number: { type: integer, minimum: 1 }
    DocumentSearchRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 500 }
        filters: { $ref: "#/components/schemas/DocumentFiltersRequest" }
        limit: { type: integer, minimum: 1, maximum: 50, default: 10 }
    FeatureResponse:
      type: object
      required: [code, name, description, includes, dependsOn, enabledByDefault, enabled, catalogVersion]
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: string }
        includes: { type: array, items: { type: string }, description: O que o módulo inclui (telas, API, ferramentas MCP, processamentos) }
        dependsOn: { type: array, items: { type: string } }
        enabledByDefault: { type: boolean, description: Estado de um condomínio novo }
        enabled: { type: boolean }
        since: { type: [string, "null"], format: date-time, description: "Desde quando está no estado atual. Nulo = nunca alterado (vale o padrão)" }
        catalogVersion: { type: integer }
    ChangeFeatureRequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        reason: { type: [string, "null"], maxLength: 500, description: "Opcional (RF-10.6); em branco = não informado. Vai para a trilha de ativação" }
    FeatureEventResponse:
      type: object
      required: [id, feature, enabledBefore, enabledAfter, username, occurredAt]
      properties:
        id: { type: string, format: uuid }
        feature: { type: string }
        enabledBefore: { type: boolean }
        enabledAfter: { type: boolean }
        username: { type: string }
        occurredAt: { type: string, format: date-time }
        reason: { type: [string, "null"], description: Nulo quando não informado }
    ActivePeriodResponse:
      type: object
      required: [feature]
      properties:
        feature: { type: string }
        start: { type: [string, "null"], format: date-time, description: "Nulo só se o módulo nasceu ligado por padrão, antes da trilha" }
        end: { type: [string, "null"], format: date-time, description: Nulo = ainda ligado }
        enabledBy: { type: [string, "null"] }
        enableReason: { type: [string, "null"] }
        disabledBy: { type: [string, "null"] }
        disableReason: { type: [string, "null"] }
    UsageFunction:
      type: string
      description: "busca_documentos = busca pela tela; chamada_mcp = buscar_documentos pelo MCP; indexacao = arquivo indexado; embeddings e pergunta = chat (entrega 3)"
      enum: [document_search, mcp_call, indexing, embeddings, question]
    UsageTotalResponse:
      type: object
      required: [feature, function, count, inputTokens, outputTokens, files, pages]
      properties:
        month: { type: string, description: "AAAA-MM (só em porMes)", pattern: "^[0-9]{4}-[0-9]{2}$" }
        feature: { type: string }
        function: { $ref: "#/components/schemas/UsageFunction" }
        count: { type: integer, format: int64, description: Número de registros (chamadas, buscas, arquivos indexados) }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        files: { type: integer, format: int64 }
        pages: { type: integer, format: int64 }
        estimatedCostUsd:
          type: [string, "null"]
          pattern: "^[0-9]+\\.[0-9]{2}$"
          description: |
            Custo estimado em US$, texto decimal exato com 2 casas (ex. "3.50"). Ausente quando não há tokens nessa
            linha ou quando o custo está indisponível (custoDisponivel = false); nulo quando há tokens de modelo sem
            preço no catálogo (ver modelosSemPreco).
    UsageResponse:
      type: object
      required: [condominiumId, start, end, byFunction, byMonth]
      properties:
        condominiumId: { type: string, format: uuid }
        start: { type: string, format: date }
        end: { type: string, format: date }
        byFunction: { type: array, items: { $ref: "#/components/schemas/UsageTotalResponse" } }
        byMonth: { type: array, items: { $ref: "#/components/schemas/UsageTotalResponse" } }
        costAvailable:
          type: boolean
          description: false quando o rag não respondeu o catálogo de preços; aí não há nenhum valor de custo
        estimatedTotalCostUsd:
          type: [string, "null"]
          pattern: "^[0-9]+\\.[0-9]{2}$"
          description: |
            Total do período em US$ (arredondamento da soma exata, não a soma dos totais arredondados). Nulo com
            modelo sem preço no catálogo; ausente com custoDisponivel = false.
        modelsWithoutPrice:
          type: array
          items: { type: string }
          description: 'Modelos com tokens no período e sem preço no catálogo, como "provedor/modelo"'

    FileCategory:
      type: string
      enum: [TRIAL_BALANCE, BANK_STATEMENT, PO, CONTRACT, PAYROLL, RECEIPT, MINUTES, BYLAWS, OTHER]
    ChangeCategoryRequest:
      type: object
      required: [category]
      properties:
        category: { $ref: "#/components/schemas/FileCategory" }
    FileStatus:
      type: string
      enum: [PENDING, PROCESSING, COMPLETED, NEEDS_REVIEW, FAILED]
    FileCategoryResponse:
      type: object
      required: [code, label]
      properties:
        code: { $ref: "#/components/schemas/FileCategory" }
        label: { type: string }
    CurrentUserResponse:
      type: object
      required: [username, name, roles, condominiums]
      properties:
        username: { type: string }
        name: { type: string }
        roles: { type: array, items: { type: string, enum: [USUARIO, GESTOR, ADMIN] } }
        condominiums:
          type: array
          items:
            type: object
            required: [id, name]
            properties: { id: { type: string, format: uuid }, name: { type: string } }
    SourceFileResponse:
      type: object
      required: [id, category, categoryLabel, name, sizeBytes, status, uploadedBy, uploadedAt]
      properties:
        id: { type: string, format: uuid }
        category: { $ref: "#/components/schemas/FileCategory" }
        categoryLabel: { type: string }
        name: { type: string }
        sizeBytes: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/FileStatus" }
        message: { type: [string, "null"] }
        periodStart: { type: [string, "null"], format: date }
        periodEnd: { type: [string, "null"], format: date }
        entryCount: { type: [integer, "null"] }
        uploadedBy: { type: string }
        uploadedAt: { type: string, format: date-time }
        processedAt: { type: [string, "null"], format: date-time }
        indexing:
          description: Estado da indexação para a busca nos documentos (ADR 0003). Nulo ou ausente = arquivo ainda não indexado (enviado antes da busca ou com o módulo Assistente desligado; reprocessar ou ligar o módulo indexa).
          anyOf:
            - { $ref: "#/components/schemas/IndexingResponse" }
            - { type: "null" }
    IndexingStatus:
      type: string
      description: QUEUED e INDEXING = em andamento; INDEXED = aparece na busca; NO_TEXT = sem texto extraível (ex. PDF digitalizado); WITHDRAWN = fora da busca (exclusão lógica ou versão substituída); ERROR = falhou (ver motivo).
      enum: [QUEUED, INDEXING, INDEXED, NO_TEXT, WITHDRAWN, ERROR]
    IndexingResponse:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/IndexingStatus" }
        reason: { type: [string, "null"], description: "Preenchido em NO_TEXT e ERROR" }
        pages: { type: [integer, "null"], description: "Páginas (PDF), abas (Excel) ou 1 (Word) lidas" }
        chunks: { type: [integer, "null"], description: "Trechos gravados no índice" }
    SourceFileDetailResponse:
      type: object
      required: [file, sha256, totalsChecks, funds]
      properties:
        file: { $ref: "#/components/schemas/SourceFileResponse" }
        sha256: { type: string }
        totalsChecks:
          type: array
          items:
            type: object
            required: [code, description, ok]
            properties:
              code: { type: string }
              description: { type: string }
              ok: { type: boolean }
              detail: { type: [string, "null"] }
        funds:
          type: array
          items:
            type: object
            required: [fund, openingBalance, credits, debits, closingBalance]
            properties:
              fund: { type: string }
              openingBalance: { type: number }
              credits: { type: number }
              debits: { type: number }
              closingBalance: { type: number }
    DashboardResponse:
      type: object
      required: [fileId, fileName, periodStart, periodEnd, openingBalance, inflows, outflows, closingBalance, failedChecks, operatingFund, funds, largestExpenses]
      properties:
        fileId: { type: string, format: uuid }
        fileName: { type: string }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        openingBalance: { type: number }
        inflows: { type: number }
        outflows: { type: number }
        closingBalance: { type: number }
        failedChecks: { type: integer }
        operatingFund:
          description: |
            Saldo acumulado do fundo ordinário (cartão "Saldo acumulado"). Com confirmado=false é só a sugestão
            (fundo com mais entradas no mês), que a tela mostra para o Gestor confirmar. Nulo quando não há sugestão.
          oneOf:
            - type: "null"
            - type: object
              required: [fundId, fund, confirmed, closingBalance]
              properties:
                fundId: { type: string, format: uuid }
                fund: { type: string }
                confirmed: { type: boolean }
                closingBalance: { type: [number, "null"], description: Nulo quando o fundo confirmado não está no relatório }
        funds:
          type: array
          items:
            type: object
            required: [fundId, fund, openingBalance, inflows, outflows, result, closingBalance]
            properties:
              fundId: { type: string, format: uuid }
              fund: { type: string }
              openingBalance: { type: number }
              inflows: { type: number }
              outflows: { type: number }
              result: { type: number }
              closingBalance: { type: number }
        largestExpenses:
          type: array
          items:
            type: object
            required: [date, fund, account, memo, amount, page]
            properties:
              date: { type: string, format: date }
              fund: { type: string }
              account: { type: string }
              memo: { type: string }
              amount: { type: number }
              page: { type: integer }
    BudgetStatus:
      type: string
      description: |
        READ (aguarda confirmação), READ_WITH_DISCREPANCY (soma que não bate além da tolerância de arredondamento),
        CONFIRMED (vale para os meses do exercício) e SUPERSEDED (trocada por reaprovação a partir de um mês).
      enum: [READ, READ_WITH_DISCREPANCY, CONFIRMED, SUPERSEDED]
    BudgetSummaryResponse:
      type: object
      required: [id, fileId, sha256, status, monthlyPlanned, readAt]
      properties:
        id: { type: string, format: uuid }
        fileId: { type: string, format: uuid }
        fileName: { type: [string, "null"] }
        sha256: { type: string }
        status: { $ref: "#/components/schemas/BudgetStatus" }
        version: { type: [integer, "null"], description: Preenchida na confirmação (1, 2, ... por reaprovação) }
        title: { type: [string, "null"] }
        printedFiscalYear: { type: [string, "null"], description: Como impresso (ex. "2026 / 2027") }
        fiscalYearStart: { type: [string, "null"], pattern: "^[0-9]{4}-[0-9]{2}$", description: AAAA-MM, informado na confirmação }
        fiscalYearEnd: { type: [string, "null"], pattern: "^[0-9]{4}-[0-9]{2}$" }
        printedTotal: { type: [number, "null"] }
        monthlyPlanned: { type: number, description: Soma das linhas dos grupos que não são fundos (usada nos cálculos) }
        readAt: { type: string, format: date-time }
        confirmedBy: { type: [string, "null"] }
        confirmedAt: { type: [string, "null"], format: date-time }
        extension: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/BudgetExtensionResponse" }], description: Nulo sem prorrogação (RF-11.3) }
    BudgetExtensionResponse:
      type: object
      description: A PO vale também de "de" até "ate", depois do exercício, quando nenhuma PO confirmada cobre o mês
      required: [from, until, justification, by, at]
      properties:
        from: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$", description: Mês seguinte ao fim do exercício }
        until: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
        justification: { type: string }
        by: { type: string }
        at: { type: string, format: date-time }
    FiscalYearResponse:
      type: object
      description: |
        Um exercício da "Análise da PO". Na coluna impressa, "inicio" e "fim" são os 12 meses antes da PO que a
        imprimiu, "meses" vem vazio (sem realizado) e prorrogação, de-para e rubricas vêm nulos.
      required: [id, type, label, budgetId, start, end, monthlyPlanned, months, warnings]
      properties:
        id: { type: string, description: '"budget:<uuid>" ou "column:<uuid da PO que imprimiu a coluna>"' }
        type: { type: string, enum: [PO, PRINTED_COLUMN] }
        label: { type: string, description: 'Ex.: "2026/2027" ou "2025/2026 (coluna impressa)"' }
        budgetId: { type: string, format: uuid }
        version: { type: [integer, "null"] }
        start: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
        end: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
        extension: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/BudgetExtensionResponse" }] }
        monthlyPlanned: { type: number, description: Soma das linhas sem os fundos }
        months:
          type: array
          items:
            type: object
            required: [month, status, extended]
            properties:
              month: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
              status: { type: string, enum: [WITH_CASH_FLOW, NO_CASH_FLOW, TWO_CASH_FLOWS] }
              extended: { type: boolean }
        mapping: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/AccountMappingSummaryResponse" }] }
        budgetItems: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/BudgetItemSummaryResponse" }] }
        printedColumn: { type: [string, "null"], description: Id da coluna impressa que este exercício substituiu (fica só como conferência) }
        warnings: { type: array, items: { type: string } }
    PrintedColumnCheckResponse:
      type: object
      required: [id, label, budgetId, superseded, totalIncludesFunds, funds, monthlyPlanned, groups, differences, warnings]
      properties:
        id: { type: string }
        label: { type: string }
        budgetId: { type: string, format: uuid }
        superseded: { type: boolean, description: Há PO anterior confirmada, e a comparação usa ela }
        previousBudgetId: { type: [string, "null"], format: uuid }
        previousBudgetLabel: { type: [string, "null"] }
        printedTotal: { type: [number, "null"] }
        totalIncludesFunds: { type: boolean, description: O total impresso confere com os subtotais incluindo os fundos }
        funds: { type: number }
        monthlyPlanned: { type: number }
        groups:
          type: array
          items:
            type: object
            required: [code, description, funds, printed, amount, difference, matches, lines]
            properties:
              lineId: { type: string, format: uuid }
              code: { type: string }
              description: { type: string }
              funds: { type: boolean }
              printed: { type: number }
              amount: { type: number, description: Soma das linhas (é o valor usado) }
              difference: { type: number, description: Impresso menos a soma das linhas }
              matches: { type: boolean }
              lines:
                type: array
                items:
                  type: object
                  required: [code, description, amount]
                  properties:
                    lineId: { type: string, format: uuid }
                    code: { type: string }
                    account: { type: [string, "null"] }
                    description: { type: string }
                    amount: { type: number }
                    percentageText: { type: [string, "null"], description: O "%" impresso, como texto lido }
        differences:
          type: array
          items:
            type: object
            required: [code, description, uploadedBudget, printedColumn]
            properties:
              code: { type: string }
              description: { type: string }
              uploadedBudget: { type: number }
              printedColumn: { type: number }
        warnings: { type: array, items: { type: string } }
    VariationResponse:
      type: object
      description: Atual menos anterior. "percentual" com 1 casa, nulo com base zero; "novaNoExercicio" quando a base é zero e o valor atual não
      required: [amount, newInFiscalYear]
      properties:
        amount: { type: number }
        percentage: { type: [number, "null"] }
        newInFiscalYear: { type: boolean }
    ComparedValueResponse:
      type: object
      description: Valor de um exercício num grupo ou rubrica; nulos quando o exercício não tem o grupo ou o dado
      required: [fiscalYearId, lines]
      properties:
        fiscalYearId: { type: string }
        monthlyPlanned: { type: [number, "null"] }
        planned: { type: [number, "null"], description: Previsto dos meses comparados (nulo sem realizado) }
        actual: { type: [number, "null"], description: Fundos 1.9 = arrecadação }
        monthlyPlannedVariation: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/VariationResponse" }] }
        actualVariation: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/VariationResponse" }] }
        target: { type: [string, "null"], description: 'Alvo da evidência: "line:<id>", "group:<id>", "fund:<id>"' }
        lines:
          type: array
          items:
            type: object
            required: [lineId, code, description]
            properties:
              lineId: { type: string, format: uuid }
              code: { type: string }
              description: { type: string }
              target: { type: [string, "null"] }
    FiscalYearComparisonResponse:
      type: object
      required: [fiscalYears, sameMonths, summary, groups, lines, unmatched, warnings]
      properties:
        fiscalYears:
          type: array
          items:
            type: object
            required: [id, type, label, budgetId, start, end, months]
            properties:
              id: { type: string }
              type: { type: string, enum: [PO, PRINTED_COLUMN] }
              label: { type: string }
              budgetId: { type: string, format: uuid }
              version: { type: [integer, "null"] }
              start: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
              end: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
              period: { type: [string, "null"], description: 'Período da evidência: "cumulative" ou AAAA-MM; nulo na coluna impressa' }
              months: { type: array, items: { type: string }, description: Meses somados no realizado }
        fundId: { type: [string, "null"], format: uuid }
        sameMonths: { type: boolean }
        comparing: { type: [string, "null"], description: 'Ex.: "comparando: setembro" (só com mesmosMeses)' }
        summary:
          type: array
          items:
            type: object
            required: [fiscalYearId, monthlyPlanned, fiscalYearPlanned, monthsWithCashFlow, provisional]
            properties:
              fiscalYearId: { type: string }
              monthlyPlanned: { type: number }
              fiscalYearPlanned: { type: number }
              monthsWithCashFlow: { type: integer }
              planned: { type: [number, "null"] }
              actual: { type: [number, "null"] }
              execution: { type: [number, "null"] }
              largestOverrun:
                oneOf:
                  - { type: "null" }
                  - type: object
                    required: [month, amount]
                    properties:
                      month: { type: string }
                      amount: { type: number }
                      percentage: { type: [number, "null"] }
              monthsAboveLimit: { type: [integer, "null"] }
              openFindings: { type: [integer, "null"] }
              provisional: { type: boolean }
              monthlyPlannedVariation: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/VariationResponse" }] }
              actualVariation: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/VariationResponse" }] }
              target: { type: [string, "null"] }
        groups:
          type: array
          items:
            type: object
            required: [code, description, funds, values]
            properties:
              code: { type: string }
              description: { type: string }
              funds: { type: boolean }
              values: { type: array, items: { $ref: "#/components/schemas/ComparedValueResponse" } }
        lines:
          type: array
          items:
            type: object
            required: [budgetItemId, name, values]
            properties:
              budgetItemId: { type: string, format: uuid }
              name: { type: string }
              group: { type: [string, "null"] }
              values: { type: array, items: { $ref: "#/components/schemas/ComparedValueResponse" } }
        unmatched:
          type: array
          items:
            type: object
            required: [fiscalYearId, lineId, code, description, monthlyPlanned]
            properties:
              fiscalYearId: { type: string }
              lineId: { type: string, format: uuid }
              code: { type: string }
              account: { type: [string, "null"] }
              description: { type: string }
              group: { type: string }
              monthlyPlanned: { type: number }
              planned: { type: [number, "null"] }
              actual: { type: [number, "null"] }
              target: { type: [string, "null"] }
        warnings: { type: array, items: { type: string } }
    IndicatorsResponse:
      type: object
      required: [budgetId, label, start, end, warnings]
      properties:
        budgetId: { type: string, format: uuid }
        label: { type: string }
        start: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
        end: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
        fundId: { type: [string, "null"], format: uuid }
        dataAsOf: { type: [string, "null"], format: date-time, description: Envio mais recente dos fluxos usados }
        limitPercentage: { type: [number, "null"], description: Limite da regra dos 20% (Conv. 16.2) }
        monthlyExecution:
          type: [array, "null"]
          description: Gráfico 1, realizado ÷ previsto do mês (referência 100%)
          items:
            type: object
            required: [month, status]
            properties:
              month: { type: string }
              status: { type: string, enum: [WITH_CASH_FLOW, NO_CASH_FLOW, TWO_CASH_FLOWS] }
              planned: { type: [number, "null"] }
              actual: { type: [number, "null"] }
              execution: { type: [number, "null"] }
              target: { type: [string, "null"] }
        rule20:
          type: [array, "null"]
          description: Gráfico 2; só "acimaDoLimite" usa cor de alerta (RF-11.13)
          items:
            type: object
            required: [month, status]
            properties:
              month: { type: string }
              status: { type: string, enum: [WITH_CASH_FLOW, NO_CASH_FLOW, TWO_CASH_FLOWS] }
              overrun: { type: [number, "null"] }
              percentage: { type: [number, "null"] }
              limitPercentage: { type: [number, "null"] }
              maxScenario: { type: [number, "null"] }
              maxScenarioPercentage: { type: [number, "null"] }
              aboveLimit: { type: [boolean, "null"] }
              provisional: { type: [boolean, "null"] }
              target: { type: [string, "null"] }
        cumulative:
          type: [array, "null"]
          description: Gráfico 3, somas até o mês (só meses com fluxo entram)
          items:
            type: object
            required: [month, status]
            properties:
              month: { type: string }
              status: { type: string, enum: [WITH_CASH_FLOW, NO_CASH_FLOW, TWO_CASH_FLOWS] }
              cumulativePlanned: { type: [number, "null"] }
              cumulativeActual: { type: [number, "null"] }
              target: { type: [string, "null"] }
        actualByGroup:
          type: [array, "null"]
          description: Gráfico 4, grupos 1.1 a 1.8
          items:
            type: object
            required: [code, description, points]
            properties:
              code: { type: string }
              description: { type: string }
              points:
                type: array
                items:
                  type: object
                  required: [month, status]
                  properties:
                    month: { type: string }
                    status: { type: string, enum: [WITH_CASH_FLOW, NO_CASH_FLOW, TWO_CASH_FLOWS] }
                    amount: { type: [number, "null"] }
                    target: { type: [string, "null"] }
        largestDifferences:
          oneOf:
            - { type: "null" }
            - type: object
              description: Gráfico 5, do acumulado; até 10 linhas de cada lado
              required: [above, below]
              properties:
                above: { type: array, items: { $ref: "#/components/schemas/LineDifferenceResponse" } }
                below: { type: array, items: { $ref: "#/components/schemas/LineDifferenceResponse" } }
        funds:
          type: [array, "null"]
          description: Gráfico 6, arrecadação × previsto
          items:
            type: object
            required: [fundId, fund, points]
            properties:
              fundId: { type: string, format: uuid }
              fund: { type: string }
              lineCode: { type: [string, "null"] }
              points:
                type: array
                items:
                  type: object
                  required: [month, status]
                  properties:
                    month: { type: string }
                    status: { type: string, enum: [WITH_CASH_FLOW, NO_CASH_FLOW, TWO_CASH_FLOWS] }
                    planned: { type: [number, "null"] }
                    collected: { type: [number, "null"] }
                    target: { type: [string, "null"] }
        comparison:
          oneOf:
            - { type: "null" }
            - type: object
              description: Gráfico 7; "previstoMes" de cada grupo na ordem de "exercicios"
              required: [fiscalYears, groups]
              properties:
                fiscalYears:
                  type: array
                  items:
                    type: object
                    required: [id, label]
                    properties:
                      id: { type: string }
                      label: { type: string }
                      budgetId: { type: [string, "null"], format: uuid, description: nulo para a coluna impressa }
                      execution: { type: [number, "null"] }
                      period: { type: [string, "null"] }
                groups:
                  type: array
                  items:
                    type: object
                    required: [code, description, monthlyPlanned, targets]
                    properties:
                      code: { type: string }
                      description: { type: string }
                      monthlyPlanned: { type: array, items: { type: [number, "null"] } }
                      targets:
                        type: array
                        items: { type: [string, "null"] }
                        description: Alvo do grupo em cada exercício, na ordem de "exercicios"; abre a evidência no previsto × realizado
        warnings: { type: array, items: { type: string } }
    LineDifferenceResponse:
      type: object
      required: [lineId, code, description, planned, actual, difference, target]
      properties:
        lineId: { type: string, format: uuid }
        code: { type: string }
        description: { type: string }
        planned: { type: number }
        actual: { type: number }
        difference: { type: number, description: Realizado menos previsto }
        target: { type: string }
    BudgetExtensionRequest:
      type: object
      required: [until, justification]
      properties:
        until: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$", description: Último mês prorrogado (AAAA-MM), depois do fim do exercício }
        justification: { type: string, minLength: 1 }
    BudgetDetailResponse:
      type: object
      required: [budget, roundingTolerance, lines, checks, warnings, repeatedCodes, funds, findings]
      properties:
        budget: { $ref: "#/components/schemas/BudgetSummaryResponse" }
        previousBudgetedColumn: { type: [string, "null"] }
        budgetedColumn: { type: [string, "null"] }
        printedMonthlyPlanned: { type: [number, "null"], description: Total impresso menos fundos impressos }
        roundingTolerance: { type: number, description: Diferença máxima tratada como arredondamento nesta leitura }
        supersededFrom: { type: [string, "null"], pattern: "^[0-9]{4}-[0-9]{2}$", description: Mês a partir do qual vale a nova versão }
        confirmation:
          description: Dados informados pelo Admin; nulo antes da confirmação
          oneOf:
            - type: "null"
            - type: object
              required: [withoutMinutes, discrepancyAcknowledged]
              properties:
                minutesFileId: { type: [string, "null"], format: uuid }
                withoutMinutes: { type: boolean }
                approvalDate: { type: [string, "null"], format: date }
                discrepancyAcknowledged: { type: boolean }
                discrepancyJustification: { type: [string, "null"] }
        lines: { type: array, items: { $ref: "#/components/schemas/BudgetLineResponse" } }
        checks: { type: array, items: { $ref: "#/components/schemas/BudgetCheckResponse" } }
        warnings: { type: array, items: { $ref: "#/components/schemas/BudgetWarningResponse" } }
        repeatedCodes:
          type: array
          items:
            type: object
            required: [printedCode, resolved, lines]
            properties:
              printedCode: { type: string }
              resolved: { type: boolean, description: Os códigos efetivos dessas linhas já são distintos }
              lines:
                type: array
                items:
                  type: object
                  required: [lineId, position, description, effectiveCode]
                  properties:
                    lineId: { type: string, format: uuid }
                    position: { type: integer }
                    description: { type: string }
                    effectiveCode: { type: string }
        funds:
          type: array
          description: Ligação das linhas de fundo (1.9.x) aos fundos do fluxo, feita na confirmação
          items:
            type: object
            required: [lineId, effectiveCode, description, budgeted, fundId, fund]
            properties:
              lineId: { type: string, format: uuid }
              effectiveCode: { type: string }
              description: { type: string }
              budgeted: { type: number }
              fundId: { type: string, format: uuid }
              fund: { type: string }
        findings:
          type: array
          items:
            type: object
            required: [id, rule, ruleVersion, severity, referenceMonth, description, status]
            properties:
              id: { type: string, format: uuid }
              rule: { type: string }
              ruleVersion: { type: string }
              severity: { type: string, enum: [INFO, WARNING, CRITICAL] }
              referenceMonth: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
              description: { type: string }
              status: { $ref: "#/components/schemas/FindingStatus" }
    BudgetLineResponse:
      type: object
      required: [id, position, page, type, printedCode, effectiveCode, description, previousBudgeted, budgeted, fundLine, fileId, sha256]
      properties:
        id: { type: string, format: uuid, description: Identificador estável da linha (destino do de-para) }
        position: { type: integer }
        page: { type: integer }
        type: { type: string, enum: [TOTAL, GROUP, LINE] }
        printedCode: { type: string }
        effectiveCode: { type: string, description: Igual ao impresso; o Admin muda só quando o código se repete }
        account: { type: [string, "null"] }
        accountText: { type: [string, "null"] }
        mark: { type: [string, "null"], enum: [SEPARATE_APPORTIONMENT, NEGOTIATED_EXEMPTION, NO_AMOUNT, FIXED_AMOUNT_NO_REFERENCE, null] }
        description: { type: string }
        previousBudgeted: { type: number }
        budgeted: { type: number }
        percentageText: { type: [string, "null"], description: Coluna "%" como lida; não entra em cálculo }
        notes: { type: [string, "null"] }
        fundLine: { type: boolean, description: Linha do grupo de fundos (precisa ser ligada a um fundo na confirmação) }
        fileId: { type: string, format: uuid }
        sha256: { type: string }
    BudgetCheckResponse:
      type: object
      required: [code, description, ok, classification]
      properties:
        code: { type: string }
        description: { type: string }
        ok: { type: boolean }
        detail: { type: [string, "null"] }
        classification:
          type: string
          description: OK; ROUNDING (diferença até a tolerância, só aviso); DISCREPANCY; REPEATED_CODE (pendência)
          enum: [OK, ROUNDING, DISCREPANCY, REPEATED_CODE]
        explanation: { type: [string, "null"], description: Quando falhou, as duas somas }
    BudgetWarningResponse:
      type: object
      required: [code, text]
      properties:
        code:
          type: string
          enum: [ROUNDING, DISCREPANCY, REPEATED_CODE, CONFIRMED_WITH_DISCREPANCY, OUTSIDE_FIRST_QUARTER, NO_MINUTES, RULE_NOT_EVALUATED]
        text: { type: string }
    BudgetConfirmationRequest:
      type: object
      required: [fiscalYearStart, fiscalYearEnd, withoutMinutes]
      properties:
        fiscalYearStart: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$", description: AAAA-MM }
        fiscalYearEnd: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$", description: AAAA-MM }
        minutesFileId: { type: [string, "null"], format: uuid, description: Arquivo da categoria MINUTES; nulo com semAta }
        withoutMinutes: { type: boolean }
        approvalDate: { type: [string, "null"], format: date, description: Data da assembleia; obrigatória com ata }
        effectiveCodes:
          type: array
          description: Código distinto para linhas cujo código impresso se repete (mesmo grupo, ex. 1.3.2 → 1.3.25)
          items:
            type: object
            required: [lineId, code]
            properties:
              lineId: { type: string, format: uuid }
              code: { type: string }
        funds:
          type: array
          description: Cada linha de fundo (linhaDeFundo) ligada a um fundo do fluxo, distinto e que não seja o ordinário
          items:
            type: object
            required: [lineId, fundId]
            properties:
              lineId: { type: string, format: uuid }
              fundId: { type: string, format: uuid }
        reapproval: { type: boolean, default: false }
        discrepancyAcknowledged: { type: boolean, default: false }
        justification: { type: [string, "null"], description: Obrigatória com cienteDivergencia }
    MappingTargetType:
      type: string
      description: Linha da PO; ajuste (não é despesa); meio de pagamento a realocar (RF-02B); transferência entre fundos
      enum: [BUDGET_LINE, ADJUSTMENT, TO_REALLOCATE, TRANSFER]
    AccountMappingStatus:
      type: string
      enum: [SUGGESTED, CONFIRMED, REJECTED]
    AccountMappingSource:
      type: string
      enum: [PREVIOUS_VERSION, SPREADSHEET, NAME, ADMIN]
    AccountMappingFilter:
      type: string
      description: PENDING = sem de-para confirmado (sem de-para, sugerido ou recusado)
      enum: [ALL, PENDING, SUGGESTED, CONFIRMED, REJECTED, UNMAPPED, SAME_AS_PREVIOUS_VERSION]
    MappingTargetResponse:
      type: object
      required: [type, text]
      properties:
        type: { $ref: "#/components/schemas/MappingTargetType" }
        lineId: { type: [string, "null"], format: uuid, description: Só com BUDGET_LINE }
        code: { type: [string, "null"], description: Código efetivo da linha }
        description: { type: [string, "null"] }
        detail: { type: [string, "null"], description: Texto do destino especial, ex. "estorno" }
        text: { type: string, description: Ex. "1.7.8 Material hidráulico" ou "ADJUSTMENT (estorno)" }
    AccountMappingResponse:
      type: object
      required: [account, ledgerEntries, debits, sameAsPreviousVersion]
      properties:
        account: { type: string, description: Código da conta do fluxo como impresso }
        name: { type: [string, "null"], description: Nome como impresso no fluxo }
        ledgerEntries: { type: integer, description: Débitos do fundo Condomínio no exercício da PO }
        debits: { type: number }
        target: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/MappingTargetResponse" }] }
        status: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/AccountMappingStatus" }], description: Nulo = sem de-para }
        source: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/AccountMappingSource" }] }
        reason: { type: [string, "null"], description: Nomes comparados, linha da planilha ou "igual à versão anterior" }
        sameAsPreviousVersion: { type: boolean }
        updatedBy: { type: [string, "null"] }
        updatedAt: { type: [string, "null"], format: date-time }
    AccountMappingSummaryResponse:
      type: object
      description: Sempre sobre todas as contas, sem o filtro ("N de M contas confirmadas")
      required: [accounts, confirmed, suggested, rejected, withoutMapping]
      properties:
        accounts: { type: integer }
        confirmed: { type: integer }
        suggested: { type: integer }
        rejected: { type: integer }
        withoutMapping: { type: integer }
    AccountMappingsResponse:
      type: object
      required: [budgetId, summary, accounts]
      properties:
        budgetId: { type: string, format: uuid }
        version: { type: [integer, "null"] }
        summary: { $ref: "#/components/schemas/AccountMappingSummaryResponse" }
        accounts: { type: array, items: { $ref: "#/components/schemas/AccountMappingResponse" } }
    MappingTargetRequest:
      type: object
      required: [type]
      properties:
        type: { $ref: "#/components/schemas/MappingTargetType" }
        lineId: { type: [string, "null"], format: uuid, description: Obrigatória com BUDGET_LINE }
        detail: { type: [string, "null"] }
        confirm: { type: [boolean, "null"], description: Nulo ou true confirma; false deixa SUGGESTED }
    AccountMappingBatchRequest:
      type: object
      required: [action, accounts]
      properties:
        action: { type: string, enum: [CONFIRM, REJECT] }
        accounts: { type: array, minItems: 1, items: { type: string } }
    SkippedAccountResponse:
      type: object
      required: [account, reason]
      properties: { account: { type: string }, reason: { type: string } }
    AccountMappingBatchResponse:
      type: object
      required: [changed, skipped]
      properties:
        changed: { type: integer }
        skipped: { type: array, items: { $ref: "#/components/schemas/SkippedAccountResponse" } }
    AccountMappingSuggestionsResponse:
      type: object
      required: [created, fromPreviousVersion, byName, withoutSuggestion]
      properties:
        created: { type: integer }
        fromPreviousVersion: { type: integer }
        byName: { type: integer }
        withoutSuggestion:
          type: array
          items:
            type: object
            required: [account, reason]
            properties: { account: { type: string }, name: { type: [string, "null"] }, reason: { type: string } }
    AccountMappingSheetResponse:
      type: object
      required: [accepted, skipped, rejected]
      properties:
        accepted: { type: integer }
        skipped: { type: array, items: { $ref: "#/components/schemas/SkippedAccountResponse" } }
        rejected:
          type: array
          items:
            type: object
            required: [line, content, reason]
            properties: { line: { type: integer }, content: { type: string }, reason: { type: string } }
    AccountMappingEventResponse:
      type: object
      required: [id, account, action, username, at, newTarget, newStatus, source]
      properties:
        id: { type: string, format: uuid }
        account: { type: string }
        name: { type: [string, "null"] }
        action: { type: string, enum: [SUGGESTED, CONFIRMED, REJECTED, CHANGED] }
        username: { type: string }
        at: { type: string, format: date-time }
        previousTarget: { type: [string, "null"] }
        previousStatus: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/AccountMappingStatus" }] }
        newTarget: { type: string }
        newStatus: { $ref: "#/components/schemas/AccountMappingStatus" }
        source: { $ref: "#/components/schemas/AccountMappingSource" }
        reason: { type: [string, "null"] }
    BudgetItemStatus:
      type: string
      enum: [SUGGESTED, CONFIRMED, REJECTED]
    BudgetItemSource:
      type: string
      description: Primeira PO do condomínio; mesma conta da PO e mesmo grupo; linha igual da versão anterior; escolha do Admin
      enum: [FIRST_BUDGET, BUDGET_ACCOUNT, PREVIOUS_VERSION, MANUAL]
    BudgetItemFilter:
      type: string
      description: PENDING = sem rubrica confirmada (sem rubrica, sugerida ou recusada)
      enum: [ALL, PENDING, SUGGESTED, CONFIRMED, REJECTED, NO_ITEM]
    BudgetItemResponse:
      type: object
      required: [id, name, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: Ex. "1682 - Sindicatura Profissional" }
        group: { type: [string, "null"], description: Grupo da PO onde a rubrica nasceu (ex. 1.3); só informativo }
        sourceLineId: { type: [string, "null"], format: uuid }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    BudgetLineItemResponse:
      type: object
      required: [lineId, code, account, description, budgeted]
      properties:
        lineId: { type: string, format: uuid }
        code: { type: string, description: Código efetivo da linha }
        group: { type: [string, "null"], description: Código do grupo (ex. 1.3) }
        account: { type: string, description: "O que a sugestão compara: conta da PO, senão o texto da coluna de conta, senão a descrição" }
        description: { type: string }
        budgeted: { type: number }
        budgetItem: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/BudgetItemResponse" }] }
        status: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/BudgetItemStatus" }], description: Nulo = sem rubrica }
        source: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/BudgetItemSource" }] }
        reason: { type: [string, "null"], description: 'Ex. "mesma conta da PO e mesmo grupo: 1682 - Sindicatura Profissional, 1.3"' }
        updatedBy: { type: [string, "null"] }
        updatedAt: { type: [string, "null"], format: date-time }
    BudgetItemSummaryResponse:
      type: object
      description: Sempre sobre todas as linhas, sem o filtro
      required: [lines, confirmed, suggested, rejected, withoutItem]
      properties:
        lines: { type: integer }
        confirmed: { type: integer }
        suggested: { type: integer }
        rejected: { type: integer }
        withoutItem: { type: integer }
    BudgetItemsResponse:
      type: object
      required: [budgetId, summary, lines]
      properties:
        budgetId: { type: string, format: uuid }
        version: { type: [integer, "null"] }
        summary: { $ref: "#/components/schemas/BudgetItemSummaryResponse" }
        lines: { type: array, items: { $ref: "#/components/schemas/BudgetLineItemResponse" } }
    NewBudgetItemRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 300 }
        group: { type: [string, "null"] }
    RenameBudgetItemRequest:
      type: object
      required: [name]
      properties: { name: { type: string, maxLength: 300 } }
    LineBudgetItemRequest:
      type: object
      properties:
        budgetItemId: { type: [string, "null"], format: uuid, description: Rubrica do catálogo }
        newBudgetItem: { type: [string, "null"], description: Nome de uma rubrica nova criada a partir da linha }
        confirm: { type: [boolean, "null"], description: Nulo ou true confirma; false deixa SUGGESTED }
    BudgetItemBatchRequest:
      type: object
      required: [action, lines]
      properties:
        action: { type: string, enum: [CONFIRM, REJECT] }
        lines: { type: array, minItems: 1, items: { type: string, format: uuid } }
    BudgetItemBatchResponse:
      type: object
      required: [changed, skipped]
      properties:
        changed: { type: integer }
        skipped:
          type: array
          items:
            type: object
            required: [lineId, reason]
            properties: { lineId: { type: string, format: uuid }, reason: { type: string } }
    BudgetItemSuggestionsResponse:
      type: object
      required: [firstBudget, createdItems, suggested, fromPreviousVersion, byAccount, withoutSuggestion]
      properties:
        firstBudget: { type: boolean, description: O condomínio não tinha rubricas; cada linha virou uma rubrica confirmada }
        createdItems: { type: integer }
        suggested: { type: integer }
        fromPreviousVersion: { type: integer }
        byAccount: { type: integer }
        withoutSuggestion:
          type: array
          items:
            type: object
            required: [lineId, code, account, reason]
            properties:
              lineId: { type: string, format: uuid }
              code: { type: string }
              account: { type: string }
              reason: { type: string }
    BudgetItemEventResponse:
      type: object
      required: [id, action, username, at, newItem]
      properties:
        id: { type: string, format: uuid }
        lineId: { type: [string, "null"], format: uuid, description: Nulo na criação e na troca de nome da rubrica }
        code: { type: [string, "null"] }
        description: { type: [string, "null"] }
        action: { type: string, enum: [CREATED, RENAMED, SUGGESTED, CONFIRMED, REJECTED, CHANGED] }
        username: { type: string }
        at: { type: string, format: date-time }
        previousItem: { type: [string, "null"] }
        previousStatus: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/BudgetItemStatus" }] }
        newItem: { type: string }
        newStatus: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/BudgetItemStatus" }] }
        source: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/BudgetItemSource" }] }
        reason: { type: [string, "null"] }
    BudgetVsActualResponse:
      type: object
      required: [calculationVersion, period, status, months, summedMonths, monthsWithoutCashFlow, monthsWithTwoCashFlows, provisional, groups, funds, warnings]
      properties:
        calculationVersion: { type: string, description: Versão das regras do cálculo usada nesta resposta }
        period: { type: string, description: AAAA-MM ou "cumulative" }
        status: { type: string, enum: [CALCULATED, NO_BUDGET, BUDGET_NOT_CONFIRMED, NO_OPERATING_FUND, NO_CASH_FLOW, TWO_CASH_FLOWS] }
        message: { type: [string, "null"], description: Por que não há números (situação diferente de CALCULATED) }
        budget:
          oneOf:
            - type: "null"
            - type: object
              required: [id, status, fileId, sha256]
              properties:
                id: { type: string, format: uuid }
                version: { type: [integer, "null"] }
                status: { $ref: "#/components/schemas/BudgetStatus" }
                fileId: { type: string, format: uuid }
                fileName: { type: [string, "null"] }
                sha256: { type: string }
                fiscalYearStart: { type: [string, "null"] }
                fiscalYearEnd: { type: [string, "null"] }
        months:
          type: array
          description: |
            No acumulado, os meses do exercício e, depois deles, os meses prorrogados (fora da soma, RF-11.3); no mês,
            só ele. Números só com WITH_CASH_FLOW
          items:
            type: object
            required: [month, status, cashFlows]
            properties:
              month: { type: string }
              status: { type: string, enum: [WITH_CASH_FLOW, NO_CASH_FLOW, TWO_CASH_FLOWS] }
              cashFlows: { type: array, items: { $ref: "#/components/schemas/UsedCashFlowResponse" } }
              planned: { type: [number, "null"] }
              actualExpense: { type: [number, "null"] }
              overrun: { type: [number, "null"] }
              overrunPercentage: { type: [number, "null"] }
              aboveLimit: { type: [boolean, "null"] }
              extended: { type: boolean, description: Mês depois do exercício em que a PO vale por prorrogação (marca "PO prorrogada") }
        summedMonths: { type: array, items: { type: string } }
        monthsWithoutCashFlow: { type: array, items: { type: string }, description: Meses sem fluxo antes do último mês com fluxo }
        monthsWithTwoCashFlows: { type: array, items: { type: string } }
        mapping:
          oneOf:
            - type: "null"
            - type: object
              required: [accounts, confirmed, withoutConfirmedMapping]
              properties:
                accounts: { type: integer, description: Contas com débito no fundo Condomínio no período }
                confirmed: { type: integer }
                withoutConfirmedMapping: { type: integer }
        provisional: { type: boolean, description: Há valor a realocar ou sem linha da PO }
        totals:
          oneOf:
            - type: "null"
            - type: object
              required: [monthlyPlanned, planned, actualExpense, inLines, difference, fiscalYearPlanned]
              properties:
                monthlyPlanned: { type: number }
                planned: { type: number, description: Previsto do mês × meses somados }
                actualExpense: { type: number, description: Em linhas + a realocar + sem linha da PO }
                inLines: { type: number }
                difference: { type: number }
                execution: { type: [number, "null"], description: "% com 1 casa; nulo com previsto zero" }
                fiscalYearPlanned: { type: number, description: Previsto do mês × meses do exercício (referência) }
        groups: { type: array, items: { $ref: "#/components/schemas/BudgetVsActualGroupResponse" } }
        adjustments: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/EntryBlockResponse" }] }
        toReallocate: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/EntryBlockResponse" }] }
        withoutBudgetLine: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/EntryBlockResponse" }] }
        cashFlowCheck:
          oneOf:
            - type: "null"
            - type: object
              description: Total de débitos do fundo = despesa realizada + ajustes + transferências
              required: [fundDebits, entries, actualExpense, adjustments, transfers, matches]
              properties:
                fundDebits: { type: number }
                entries: { type: integer }
                actualExpense: { type: number }
                adjustments: { type: number }
                transfers: { type: number }
                matches: { type: boolean }
        rule20:
          description: Regra dos 20% (Conv. 16.2), só no mês
          oneOf:
            - type: "null"
            - type: object
              required: [rule, ruleVersion, limitPercentage, monthlyPlanned, overrun, percentage, limit, linesAbove, lines, toReallocate, withoutBudgetLine, maxScenario, provisional, aboveLimit]
              properties:
                rule: { type: string }
                ruleVersion: { type: string }
                limitPercentage: { type: number }
                monthlyPlanned: { type: number }
                overrun: { type: number, description: Soma das diferenças positivas, linha a linha }
                percentage: { type: number }
                limit: { type: number, description: Em reais, arredondado; a comparação é exata }
                linesAbove: { type: integer }
                lines:
                  type: array
                  items:
                    type: object
                    required: [lineId, code, description, overrun]
                    properties:
                      lineId: { type: string, format: uuid }
                      code: { type: string }
                      description: { type: string }
                      overrun: { type: number }
                toReallocate: { type: number }
                withoutBudgetLine: { type: number }
                maxScenario: { type: number, description: Excesso + a realocar + sem linha da PO }
                maxScenarioPercentage: { type: [number, "null"] }
                provisional: { type: boolean }
                aboveLimit: { type: boolean }
        funds:
          type: array
          items:
            type: object
            required: [status]
            properties:
              fundId: { type: [string, "null"], format: uuid }
              fund: { type: [string, "null"], description: Nome impresso no fluxo }
              lineId: { type: [string, "null"], format: uuid }
              lineCode: { type: [string, "null"] }
              status: { type: string, enum: [COMPARED, NOT_PLANNED_IN_BUDGET, LINE_WITHOUT_FUND, REPROCESS_CASH_FLOW] }
              planned: { type: [number, "null"] }
              collected: { type: [number, "null"] }
              difference: { type: [number, "null"] }
              execution: { type: [number, "null"] }
              credits: { type: [number, "null"] }
              debits: { type: [number, "null"] }
        warnings:
          type: array
          description: Inclui BUDGET_EXTENDED (mês prorrogado) e EXTENDED_MONTHS (acumulado com meses fora da soma)
          items:
            type: object
            required: [code, text]
            properties: { code: { type: string }, text: { type: string } }
    UsedCashFlowResponse:
      type: object
      required: [fileId, name, sha256]
      properties:
        fileId: { type: string, format: uuid }
        name: { type: string }
        sha256: { type: string }
        periodStart: { type: [string, "null"], format: date }
        periodEnd: { type: [string, "null"], format: date }
        uploadedAt: { type: [string, "null"], format: date-time }
        uploadedBy: { type: [string, "null"] }
    BudgetVsActualGroupResponse:
      type: object
      required: [lineId, code, description, planned, actual, difference, lines]
      properties:
        lineId: { type: string, format: uuid }
        code: { type: string }
        description: { type: string }
        planned: { type: number, description: Soma das linhas (Q30) }
        actual: { type: number }
        difference: { type: number }
        execution: { type: [number, "null"] }
        lines:
          type: array
          items:
            type: object
            required: [lineId, code, description, page, planned, actual, difference, cashFlowAccounts, entries]
            properties:
              lineId: { type: string, format: uuid }
              code: { type: string }
              description: { type: string }
              account: { type: [string, "null"] }
              mark: { type: [string, "null"], enum: [SEPARATE_APPORTIONMENT, NEGOTIATED_EXEMPTION, NO_AMOUNT, FIXED_AMOUNT_NO_REFERENCE, null] }
              notes: { type: [string, "null"] }
              page: { type: integer }
              planned: { type: number }
              actual: { type: number }
              difference: { type: number }
              execution: { type: [number, "null"] }
              cashFlowAccounts: { type: array, items: { type: string }, description: Contas do fluxo com de-para confirmado para a linha }
              entries: { type: integer }
    EntryBlockResponse:
      type: object
      required: [total, entries, accounts]
      properties:
        total: { type: number }
        entries: { type: integer }
        accounts:
          type: array
          items:
            type: object
            required: [amount, entries]
            properties:
              account: { type: [string, "null"] }
              name: { type: [string, "null"] }
              detail: { type: [string, "null"], description: Ex. "ADJUSTMENT (estorno)", "de-para sugerido", "sem de-para" }
              amount: { type: number }
              entries: { type: integer }
    EvidenceResponse:
      type: object
      required: [entryId, date, memo, amount, fileId, sha256, page, position]
      properties:
        entryId: { type: string, format: uuid }
        date: { type: string, format: date }
        account: { type: [string, "null"] }
        accountName: { type: [string, "null"] }
        memo: { type: string }
        supplier: { type: [string, "null"] }
        document: { type: [string, "null"] }
        amount: { type: number }
        fund: { type: [string, "null"] }
        fileId: { type: string, format: uuid }
        fileName: { type: [string, "null"] }
        sha256: { type: string }
        page: { type: integer }
        position: { type: integer }
        reallocation: { type: [string, "null"], description: '"realocado para <linha> por <usuário> em <data>"' }
        reallocationId: { type: [string, "null"], format: uuid, description: Realocação ativa que levou o lançamento à linha (para desfazer) }
    FindingStatus:
      type: string
      enum: [OPEN, NO_LONGER_APPLIES, JUSTIFIED, RESOLVED, FALSE_POSITIVE]
    FindingResponse:
      type: object
      required: [id, rule, ruleVersion, severity, referenceMonth, target, description, status, conditionPresent, createdAt, evidence, history]
      properties:
        id: { type: string, format: uuid }
        rule: { type: string, description: Ex. MONTHLY_OVERRUN_ABOVE_LIMIT, ACCOUNT_WITHOUT_BUDGET_LINE, RESERVE_FUND_ABOVE_CAP }
        ruleVersion: { type: string }
        severity: { type: string, enum: [INFO, WARNING, CRITICAL] }
        referenceMonth: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
        target: { type: string, description: 'Ex. "operating-fund", "account:8888"' }
        description: { type: string }
        status: { $ref: "#/components/schemas/FindingStatus" }
        statusReason: { type: [string, "null"], description: 'Ex. "de-para da conta 8888 confirmado por admin em 04/10/2026"' }
        statusChangedAt: { type: [string, "null"], format: date-time }
        conditionPresent: { type: boolean, description: A condição da regra existia no último recálculo }
        createdAt: { type: string, format: date-time }
        evidence:
          type: array
          items:
            type: object
            required: [position, fileId, sha256, reference]
            properties:
              position: { type: integer }
              fileId: { type: string, format: uuid }
              sha256: { type: string }
              page: { type: [integer, "null"] }
              reference: { type: string }
              budgetLineId: { type: [string, "null"], format: uuid }
        history:
          type: array
          items:
            type: object
            required: [newStatus, conditionPresent, reason, username, occurredAt]
            properties:
              previousStatus: { oneOf: [{ $ref: "#/components/schemas/FindingStatus" }, { type: "null" }] }
              newStatus: { $ref: "#/components/schemas/FindingStatus" }
