openapi: 3.1.0
info:
  title: Auditoria do Condomínio – API
  version: 0.1.0
  description: |
    Contrato entre backend, frontend e MCP. Toda chamada exige token Bearer do Keycloak.
    Perfis: USUARIO (consulta), GESTOR (+ envia arquivos), ADMIN (tudo).
    Valores monetários são números com 2 casas decimais; datas em ISO 8601.
servers:
  - url: /api
security:
  - bearer: []
paths:
  /eu:
    get:
      summary: Usuário logado, perfis e condomínios visíveis
      operationId: eu
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UsuarioLogado" } } } }
  /categorias:
    get:
      summary: Categorias de arquivo, na ordem da tela
      operationId: categorias
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CategoriaDto" } } } }
  /condominios/{condominioId}/arquivos:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }]
    get:
      summary: Arquivos do mais recente para o mais antigo
      operationId: listarArquivos
      parameters:
        - { name: categoria, in: query, required: false, schema: { $ref: "#/components/schemas/Categoria" } }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ArquivoResumo" } } } }
    post:
      summary: Envia um arquivo (GESTOR ou ADMIN). O processamento segue em segundo plano.
      operationId: enviarArquivo
      parameters:
        - { name: categoria, in: query, required: true, schema: { $ref: "#/components/schemas/Categoria" } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [arquivo]
              properties: { arquivo: { type: string, format: binary } }
      responses:
        "202": { description: Recebido e na fila, content: { application/json: { schema: { $ref: "#/components/schemas/ArquivoResumo" } } } }
        "403": { description: Perfil sem permissão }
        "409": { description: Arquivo já enviado (mesmo conteúdo), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problema" } } } }
  /condominios/{condominioId}/arquivos/ultimo:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }]
    get:
      summary: Último arquivo enviado (indicador no canto da tela)
      operationId: ultimoArquivo
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ArquivoResumo" } } } }
        "204": { description: Nenhum arquivo ainda }
  /condominios/{condominioId}/arquivos/{id}:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }, { $ref: "#/components/parameters/ArquivoId" }]
    get:
      summary: Detalhe com conferências e saldos por fundo
      operationId: detalheArquivo
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ArquivoDetalhe" } } } }
        "404": { description: Não encontrado }
  /condominios/{condominioId}/arquivos/{id}/conteudo:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }, { $ref: "#/components/parameters/ArquivoId" }]
    get:
      summary: Arquivo original, exatamente como foi enviado
      operationId: conteudoArquivo
      responses:
        "200": { description: O arquivo, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
  /condominios/{condominioId}/arquivos/{id}/reprocessar:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }, { $ref: "#/components/parameters/ArquivoId" }]
    post:
      summary: Coloca o arquivo de novo na fila de leitura e, com o módulo Assistente ligado, de indexação (GESTOR ou ADMIN). Não duplica dados.
      operationId: reprocessarArquivo
      responses:
        "202": { description: Na fila, content: { application/json: { schema: { $ref: "#/components/schemas/ArquivoResumo" } } } }
        "409": { description: Já está em processamento }
  /condominios/{condominioId}/arquivos/{id}/categoria:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }, { $ref: "#/components/parameters/ArquivoId" }]
    put:
      summary: Troca a categoria e reprocessa o arquivo (GESTOR ou ADMIN, RF-01.7). Mesma categoria não faz nada.
      operationId: alterarCategoriaArquivo
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NovaCategoria" } } }
      responses:
        "200": { description: Categoria trocada (arquivo na fila de novo), content: { application/json: { schema: { $ref: "#/components/schemas/ArquivoResumo" } } } }
        "400": { description: Categoria não informada ou inválida }
        "403": { description: Perfil sem permissão }
        "404": { description: Não encontrado }
        "409": { description: Já está em processamento }
  /condominios/{condominioId}/painel:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }]
    get:
      summary: Números da tela inicial, do fluxo de caixa mais recente
      operationId: painel
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Painel" } } } }
        "204": { description: Ainda não há fluxo de caixa processado }
  /condominios/{condominioId}/fundo-ordinario:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }]
    put:
      summary: Confirma qual fundo é o ordinário do condomínio (GESTOR ou ADMIN)
      operationId: confirmarFundoOrdinario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fundoId]
              properties: { fundoId: { type: string, format: uuid } }
      responses:
        "204": { description: Confirmado }
        "403": { description: Perfil sem permissão }
        "404": { description: Fundo não é deste condomínio }
  /condominios/{condominioId}/contexto:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }]
    get:
      summary: Contexto do condomínio para montar a tela (módulos ligados). Qualquer perfil com acesso ao condomínio.
      description: |
        O menu "Assistente" depende de ASSISTENTE estar em modulosLigados (RF-10.2, RF-10.3). Ligar ou desligar vale
        no próximo carregamento, sem reinício. O modo de IA do assistente entra aqui na configuração de IA (ADR 0003).
      operationId: contextoCondominio
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ContextoCondominio" } } } }
        "403": { description: Sem acesso a este condomínio }
        "404": { description: Condomínio não encontrado }
  /condominios/{condominioId}/modulos:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }]
    get:
      summary: Catálogo de módulos com o estado no condomínio (RF-10.1). Qualquer perfil com acesso; só leitura.
      operationId: listarModulos
      responses:
        "200":
          description: OK, na ordem do catálogo
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ModuloDoCondominio" } } } }
        "403": { description: Sem acesso a este condomínio }
  /condominios/{condominioId}/modulos/{codigo}:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }, { $ref: "#/components/parameters/CodigoModulo" }]
    put:
      summary: Liga ou desliga um módulo no condomínio (só ADMIN, o administrador da plataforma no MVP; RF-10.2)
      description: |
        Grava o estado e um evento na trilha de ativação (só de inclusão), com motivo obrigatório. Pedir o estado que
        já vale não faz nada (nenhum evento). Ligar o ASSISTENTE coloca todos os arquivos do condomínio na fila de
        indexação depois da resposta (RF-10.4); desligar não apaga índice nem originais (RF-10.5).
      operationId: alterarModulo
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AlteracaoModulo" } } }
      responses:
        "200": { description: Estado depois da alteração, content: { application/json: { schema: { $ref: "#/components/schemas/ModuloDoCondominio" } } } }
        "400": { description: Motivo ou estado não informado, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problema" } } } }
        "403": { description: Perfil sem permissão }
        "404": { description: Módulo fora do catálogo ou condomínio não encontrado }
  /condominios/{condominioId}/modulos/{codigo}/eventos:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }, { $ref: "#/components/parameters/CodigoModulo" }]
    get:
      summary: Trilha de ativação do módulo no condomínio, da mais antiga para a mais recente (só ADMIN; RF-10.6)
      operationId: eventosModulo
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/EventoModulo" } } } }
        "403": { description: Perfil sem permissão }
        "404": { description: Módulo fora do catálogo }
  /condominios/{condominioId}/modulos/{codigo}/periodos:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }, { $ref: "#/components/parameters/CodigoModulo" }]
    get:
      summary: Períodos ativos do módulo no condomínio, calculados da trilha (só ADMIN; RF-10.6)
      operationId: periodosModulo
      responses:
        "200":
          description: OK, do mais antigo para o mais recente
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PeriodoAtivo" } } } }
        "403": { description: Perfil sem permissão }
        "404": { description: Módulo fora do catálogo }
  /condominios/{condominioId}/uso:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }]
    get:
      summary: Uso dos módulos no período, por função e por mês (só ADMIN no MVP; RF-09.7, Q17)
      description: Datas no fuso de Brasília, fim incluído. Sem custo nesta fase.
      operationId: usoModulos
      parameters:
        - { name: inicio, in: query, required: true, schema: { type: string, format: date } }
        - { name: fim, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UsoDoPeriodo" } } } }
        "400": { description: Datas ausentes ou início depois do fim }
        "403": { description: Perfil sem permissão }
  /condominios/{condominioId}/uso/exportacao:
    parameters: [{ $ref: "#/components/parameters/CondominioId" }]
    get:
      summary: Exporta os períodos ativos e o uso do período em CSV para abrir no Excel (só ADMIN; RF-10.6, RF-09.7)
      description: |
        CSV em UTF-8 com BOM, separador ";" (Excel em português). Duas seções: "Períodos ativos" (os que tocam o
        período pedido) e "Uso por mês". Formato .xlsx fica para quando o Apache POI entrar no backend.
      operationId: exportarUsoModulos
      parameters:
        - { name: inicio, in: query, required: true, schema: { type: string, format: date } }
        - { name: fim, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200": { description: Arquivo CSV, content: { text/csv: { schema: { type: string } } } }
        "400": { description: Datas ausentes ou início depois do fim }
        "403": { description: Perfil sem permissão }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    CondominioId: { name: condominioId, in: path, required: true, schema: { type: string, format: uuid } }
    ArquivoId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    CodigoModulo: { name: codigo, in: path, required: true, description: "Código do módulo no catálogo (ex.: ASSISTENTE)", schema: { type: string } }
  schemas:
    ContextoCondominio:
      type: object
      required: [condominioId, nome, modulosLigados]
      properties:
        condominioId: { type: string, format: uuid }
        nome: { type: string }
        modulosLigados: { type: array, items: { type: string }, description: "Códigos dos módulos ligados (ex.: [ASSISTENTE])" }
    ModuloDoCondominio:
      type: object
      required: [codigo, nome, descricao, inclui, dependeDe, ligadoPorPadrao, ligado, versaoCatalogo]
      properties:
        codigo: { type: string }
        nome: { type: string }
        descricao: { type: string }
        inclui: { type: array, items: { type: string }, description: O que o módulo inclui (telas, API, ferramentas MCP, processamentos) }
        dependeDe: { type: array, items: { type: string } }
        ligadoPorPadrao: { type: boolean, description: Estado de um condomínio novo }
        ligado: { type: boolean }
        desde: { type: [string, "null"], format: date-time, description: "Desde quando está no estado atual. Nulo = nunca alterado (vale o padrão)" }
        versaoCatalogo: { type: integer }
    AlteracaoModulo:
      type: object
      required: [ligado, motivo]
      properties:
        ligado: { type: boolean }
        motivo: { type: string, minLength: 1, maxLength: 500, description: "Obrigatório; vai para a trilha de ativação" }
    EventoModulo:
      type: object
      required: [id, modulo, ligadoAntes, ligadoDepois, usuario, quando, motivo]
      properties:
        id: { type: string, format: uuid }
        modulo: { type: string }
        ligadoAntes: { type: boolean }
        ligadoDepois: { type: boolean }
        usuario: { type: string }
        quando: { type: string, format: date-time }
        motivo: { type: string }
    PeriodoAtivo:
      type: object
      required: [modulo]
      properties:
        modulo: { type: string }
        inicio: { type: [string, "null"], format: date-time, description: "Nulo só se o módulo nasceu ligado por padrão, antes da trilha" }
        fim: { type: [string, "null"], format: date-time, description: Nulo = ainda ligado }
        ligadoPor: { type: [string, "null"] }
        motivoLigar: { type: [string, "null"] }
        desligadoPor: { type: [string, "null"] }
        motivoDesligar: { type: [string, "null"] }
    FuncaoUso:
      type: string
      description: "busca_documentos = busca pela tela; chamada_mcp = buscar_documentos pelo MCP; indexacao = arquivo indexado; embeddings e pergunta = chat (entrega 3)"
      enum: [busca_documentos, chamada_mcp, indexacao, embeddings, pergunta]
    TotalUso:
      type: object
      required: [modulo, funcao, quantidade, tokensEntrada, tokensSaida, arquivos, paginas]
      properties:
        mes: { type: string, description: "AAAA-MM (só em porMes)", pattern: "^[0-9]{4}-[0-9]{2}$" }
        modulo: { type: string }
        funcao: { $ref: "#/components/schemas/FuncaoUso" }
        quantidade: { type: integer, format: int64, description: Número de registros (chamadas, buscas, arquivos indexados) }
        tokensEntrada: { type: integer, format: int64 }
        tokensSaida: { type: integer, format: int64 }
        arquivos: { type: integer, format: int64 }
        paginas: { type: integer, format: int64 }
    UsoDoPeriodo:
      type: object
      required: [condominioId, inicio, fim, porFuncao, porMes]
      properties:
        condominioId: { type: string, format: uuid }
        inicio: { type: string, format: date }
        fim: { type: string, format: date }
        porFuncao: { type: array, items: { $ref: "#/components/schemas/TotalUso" } }
        porMes: { type: array, items: { $ref: "#/components/schemas/TotalUso" } }
    Categoria:
      type: string
      enum: [BALANCETE, EXTRATO, PO, CONTRATO, FOLHA, COMPROVANTE, ATA, CONVENCAO_RI, OUTROS]
    NovaCategoria:
      type: object
      required: [categoria]
      properties:
        categoria: { $ref: "#/components/schemas/Categoria" }
    StatusArquivo:
      type: string
      enum: [PENDENTE, PROCESSANDO, CONCLUIDO, PRECISA_REVISAO, FALHOU]
    CategoriaDto:
      type: object
      required: [codigo, rotulo]
      properties:
        codigo: { $ref: "#/components/schemas/Categoria" }
        rotulo: { type: string }
    UsuarioLogado:
      type: object
      required: [usuario, nome, perfis, condominios]
      properties:
        usuario: { type: string }
        nome: { type: string }
        perfis: { type: array, items: { type: string, enum: [USUARIO, GESTOR, ADMIN] } }
        condominios:
          type: array
          items:
            type: object
            required: [id, nome]
            properties: { id: { type: string, format: uuid }, nome: { type: string } }
    ArquivoResumo:
      type: object
      required: [id, categoria, categoriaRotulo, nome, tamanhoBytes, status, enviadoPor, enviadoEm]
      properties:
        id: { type: string, format: uuid }
        categoria: { $ref: "#/components/schemas/Categoria" }
        categoriaRotulo: { type: string }
        nome: { type: string }
        tamanhoBytes: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/StatusArquivo" }
        mensagem: { type: [string, "null"] }
        periodoInicio: { type: [string, "null"], format: date }
        periodoFim: { type: [string, "null"], format: date }
        totalLancamentos: { type: [integer, "null"] }
        enviadoPor: { type: string }
        enviadoEm: { type: string, format: date-time }
        processadoEm: { type: [string, "null"], format: date-time }
        indexacao:
          description: Estado da indexação para a busca nos documentos (ADR 0003). Nulo ou ausente = arquivo ainda não indexado (enviado antes da busca ou com o módulo Assistente desligado; reprocessar ou ligar o módulo indexa).
          anyOf:
            - { $ref: "#/components/schemas/IndexacaoArquivo" }
            - { type: "null" }
    SituacaoIndexacao:
      type: string
      description: NA_FILA e INDEXANDO = em andamento; INDEXADO = aparece na busca; SEM_TEXTO = sem texto extraível (ex. PDF digitalizado); RETIRADO = fora da busca (exclusão lógica ou versão substituída); ERRO = falhou (ver motivo).
      enum: [NA_FILA, INDEXANDO, INDEXADO, SEM_TEXTO, RETIRADO, ERRO]
    IndexacaoArquivo:
      type: object
      required: [situacao]
      properties:
        situacao: { $ref: "#/components/schemas/SituacaoIndexacao" }
        motivo: { type: [string, "null"], description: "Preenchido em SEM_TEXTO e ERRO" }
        paginas: { type: [integer, "null"], description: "Páginas (PDF), abas (Excel) ou 1 (Word) lidas" }
        trechos: { type: [integer, "null"], description: "Trechos gravados no índice" }
    ArquivoDetalhe:
      type: object
      required: [arquivo, sha256, conferencias, fundos]
      properties:
        arquivo: { $ref: "#/components/schemas/ArquivoResumo" }
        sha256: { type: string }
        conferencias:
          type: array
          items:
            type: object
            required: [codigo, descricao, ok]
            properties:
              codigo: { type: string }
              descricao: { type: string }
              ok: { type: boolean }
              detalhe: { type: [string, "null"] }
        fundos:
          type: array
          items:
            type: object
            required: [fundo, saldoAnterior, creditos, debitos, saldoAtual]
            properties:
              fundo: { type: string }
              saldoAnterior: { type: number }
              creditos: { type: number }
              debitos: { type: number }
              saldoAtual: { type: number }
    Painel:
      type: object
      required: [arquivoId, arquivoNome, periodoInicio, periodoFim, saldoAnterior, entradas, saidas, saldoAtual, conferenciasComFalha, fundoOrdinario, fundos, maioresDespesas]
      properties:
        arquivoId: { type: string, format: uuid }
        arquivoNome: { type: string }
        periodoInicio: { type: string, format: date }
        periodoFim: { type: string, format: date }
        saldoAnterior: { type: number }
        entradas: { type: number }
        saidas: { type: number }
        saldoAtual: { type: number }
        conferenciasComFalha: { type: integer }
        fundoOrdinario:
          description: |
            Saldo acumulado do fundo ordinário (cartão "Saldo acumulado"). Com confirmado=false é só a sugestão
            (fundo com mais entradas no mês), que a tela mostra para o Gestor confirmar. Nulo quando não há sugestão.
          oneOf:
            - type: "null"
            - type: object
              required: [fundoId, fundo, confirmado, saldoAtual]
              properties:
                fundoId: { type: string, format: uuid }
                fundo: { type: string }
                confirmado: { type: boolean }
                saldoAtual: { type: [number, "null"], description: Nulo quando o fundo confirmado não está no relatório }
        fundos:
          type: array
          items:
            type: object
            required: [fundoId, fundo, saldoAnterior, entradas, saidas, resultado, saldoAtual]
            properties:
              fundoId: { type: string, format: uuid }
              fundo: { type: string }
              saldoAnterior: { type: number }
              entradas: { type: number }
              saidas: { type: number }
              resultado: { type: number }
              saldoAtual: { type: number }
        maioresDespesas:
          type: array
          items:
            type: object
            required: [data, fundo, conta, historico, valor, pagina]
            properties:
              data: { type: string, format: date }
              fundo: { type: string }
              conta: { type: string }
              historico: { type: string }
              valor: { type: number }
              pagina: { type: integer }
    Problema:
      type: object
      properties:
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        arquivoExistenteId: { type: string, format: uuid }
        modulo: { type: string, description: "Em recusa por módulo não contratado (403): código do módulo" }
