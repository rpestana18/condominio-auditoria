server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 50m;

    # DNS interno do Docker, consultado a cada pedido: se o api for recriado com outro IP, a tela continua achando
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # Aplicação de página única: qualquer rota cai no index.html
    location / {
        try_files $uri /index.html;
    }
}
