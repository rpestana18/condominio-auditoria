# Catálogo único de versões dos serviços Java
[versions]
spring-boot = "4.1.1"
spring-ai = "2.0.1"
json-schema-validator = "3.0.8"
grpc = "1.84.0"
protobuf = "4.33.4"
gradle-protobuf = "0.10.0"
# Relatórios do backend (ADR 0001; ADR 0004, Decisão 6; docs/tecnologias.md, T11). Thymeleaf vem do BOM do Spring Boot.
openhtmltopdf = "1.1.87"
poi = "5.5.1"

[libraries]
spring-ai-bom = { module = "org.springframework.ai:spring-ai-bom", version.ref = "spring-ai" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
grpc-bom = { module = "io.grpc:grpc-bom", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf" }
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded" }
grpc-inprocess = { module = "io.grpc:grpc-inprocess" }
spring-boot-starter-thymeleaf = { module = "org.springframework.boot:spring-boot-starter-thymeleaf" }
openhtmltopdf-pdfbox = { module = "io.github.openhtmltopdf:openhtmltopdf-pdfbox", version.ref = "openhtmltopdf" }
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
protobuf = { id = "com.google.protobuf", version.ref = "gradle-protobuf" }
