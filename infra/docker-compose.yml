# Sobe o sistema inteiro na máquina local: docker compose up --build
# Endereços: tela http://localhost:8080 · Keycloak http://localhost:8180 (admin/admin)
#            RabbitMQ http://localhost:15672 (condominio/condominio) · MCP http://localhost:8083/mcp
#
# Serviços e como conversam:
#   frontend ──REST──▶ api ──fila──▶ rag ──HTTP──▶ leitor (Python)
#                        ▲   ◀──fila────┘ │
#   Claude ──MCP──▶ mcp ─┘ gRPC           └──HTTP──▶ ollama (embeddings bge-m3)
#
# Fluxos:
#   leitura contábil: api ─ArquivoRecebido (rag.files-received)─▶ rag ─resultado (api.processing-results)─▶ api
#   indexação (ADR 0003): api ─IndexarArquivo (rag.indexing)─▶ rag ─▶ leitor + ollama ─▶ schema rag no banco
#                         rag ─ResultadoIndexacao (api.indexing-results)─▶ api (situação da indexação do arquivo na API)
#   busca nos documentos: Claude ─search_documents─▶ mcp ─gRPC Query.SearchDocuments─▶ api
#                         api ─gRPC Assistant.Search (rag:9091)─▶ rag (híbrida; só por palavra sem Ollama)
#
# Primeira subida: o passo ollama-modelo baixa o modelo bge-m3 (~1,2 GB) para o volume "ollama"; o rag só sobe
# depois que ele termina. Nas próximas subidas o modelo já está no volume e o passo termina em segundos.
name: condominio-auditoria

services:
  banco:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: condominio
      POSTGRES_USER: condominio
      POSTGRES_PASSWORD: condominio
    ports: ["5432:5432"]
    volumes: [banco:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U condominio -d condominio"]
      interval: 5s
      retries: 20

  fila:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: condominio
      RABBITMQ_DEFAULT_PASS: condominio
    ports: ["5672:5672", "15672:15672"]
    volumes: [fila:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 30

  keycloak:
    image: keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # O token sempre sai com o endereço público como emissor; os serviços buscam as chaves pela rede interna
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports: ["8180:8080"]
    volumes: [./keycloak/realm-condominio.json:/opt/keycloak/data/import/realm-condominio.json:ro]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      retries: 40

  leitor:
    build: ../leitor
    ports: ["8090:8090"]
    read_only: true
    tmpfs: [/tmp]

  # Embeddings locais (ADR 0003, Decisão 2). Versão fixada: trocar só com teste da busca nos documentos.
  ollama:
    image: ollama/ollama:0.35.1
    volumes: [ollama:/root/.ollama]
    # Dentro do compose só o rag usa, pela rede interna. A porta fica publicada só no endereço local da máquina
    # (nunca na rede) para o rag rodar fora do Docker no desenvolvimento; quem não precisa pode remover a linha.
    ports: ["127.0.0.1:11434:11434"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 30

  # Passo de inicialização: baixa o bge-m3 para o volume do ollama e termina. Se o modelo já está lá, não baixa de
  # novo (e a subida funciona sem internet).
  ollama-modelo:
    image: ollama/ollama:0.35.1
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama show bge-m3 > /dev/null 2>&1 || ollama pull bge-m3"]
    restart: "no"
    depends_on:
      ollama: { condition: service_healthy }

  api:
    build:
      context: ..
      dockerfile: infra/java.Dockerfile
      args: { SERVICO: api }
    environment:
      BANCO_URL: jdbc:postgresql://banco:5432/condominio
      RABBITMQ_HOST: fila
      KEYCLOAK_EMISSOR: http://localhost:8180/realms/condominio
      KEYCLOAK_CHAVES: http://keycloak:8080/realms/condominio/protocol/openid-connect/certs
      PASTA_DADOS: /dados
      PORTA: 8080
      # Busca nos documentos (rpc SearchDocuments) repassada ao rag
      RAG_GRPC: rag:9091
      RAG_GRPC_PRAZO_SEGUNDOS: 30
      # Pergunta do chat (Claude + ferramentas + validação) demora mais que a busca
      RAG_GRPC_PRAZO_PERGUNTA_SEGUNDOS: 120
    volumes: [../dados:/dados]
    # 8081 = API REST (tela); 9090 = gRPC (só para depuração local, o mcp usa a rede interna)
    ports: ["8081:8080", "9090:9090"]
    depends_on:
      banco: { condition: service_healthy }
      fila: { condition: service_healthy }
      keycloak: { condition: service_healthy }

  rag:
    build:
      context: ..
      dockerfile: infra/java.Dockerfile
      args: { SERVICO: rag }
    environment:
      RABBITMQ_HOST: fila
      LEITOR_URL: http://leitor:8090
      PASTA_DADOS: /dados
      PORTA: 8080
      # Índice dos documentos no schema "rag" do mesmo PostgreSQL (o rag acrescenta currentSchema=rag,public)
      BANCO_URL: jdbc:postgresql://banco:5432/condominio
      BANCO_USUARIO: condominio
      BANCO_SENHA: condominio
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODELO_EMBEDDINGS: bge-m3
      # O modelo vem do passo ollama-modelo; o rag nunca baixa sozinho
      OLLAMA_BAIXAR_MODELO: never
      # gRPC do assistente (Assistant.Search), só na rede interna; quem chama é o api
      GRPC_PORTA: 9091
      RAG_PARALELISMO_INDEXACAO: 1
      # Chat do Assistente (ADR 0003, entrega 3). O par de chaves do rag cifra as chaves de API dos condomínios: só o
      # rag tem a privada. Em desenvolvimento o rag gera o par na primeira subida e guarda no volume "chaves-rag";
      # perder o volume obriga a cadastrar de novo as chaves dos condomínios. Em produção: segredo ou cofre, sem gerar.
      RAG_CHAVE_PRIVADA_ARQUIVO: /chaves/rag.pem
      RAG_GERAR_CHAVE_DEV: "true"
      # Ferramentas numéricas do chat: o rag consulta o api com o token do próprio usuário
      BACKEND_GRPC: api:9090
    # Só lê os originais: a pasta entra como somente leitura
    volumes: [../dados:/dados:ro, chaves-rag:/chaves]
    ports: ["8082:8080"]
    depends_on:
      banco: { condition: service_healthy }
      fila: { condition: service_healthy }
      leitor: { condition: service_started }
      ollama-modelo: { condition: service_completed_successfully }

  mcp:
    build:
      context: ..
      dockerfile: infra/java.Dockerfile
      args: { SERVICO: mcp }
    environment:
      BACKEND_GRPC: api:9090
      KEYCLOAK_EMISSOR: http://localhost:8180/realms/condominio
      KEYCLOAK_CHAVES: http://keycloak:8080/realms/condominio/protocol/openid-connect/certs
      PORTA: 8080
    ports: ["8083:8080"]
    depends_on:
      keycloak: { condition: service_healthy }
      api: { condition: service_started }

  frontend:
    build: ../frontend
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  banco:
  fila:
  ollama:
  chaves-rag:
