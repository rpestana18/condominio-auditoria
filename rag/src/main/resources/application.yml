spring:
  application:
    name: rag
  datasource:
    # Mesmo PostgreSQL do backend, schema próprio "rag" (ADR 0002); public entra no caminho por causa do tipo vector
    url: ${BANCO_URL:jdbc:postgresql://localhost:5432/condominio}?currentSchema=rag,public
    username: ${BANCO_USUARIO:condominio}
    password: ${BANCO_SENHA:condominio}
  flyway:
    schemas: rag
    default-schema: rag
  ai:
    model:
      # A autoconfiguração de ChatModel fica desligada de propósito: o rag monta um cliente do SDK oficial da
      # Anthropic por pergunta, com a chave do condomínio (nenhuma chave única no boot). Ver GatewayIa.
      chat: none
      embedding: ollama
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      embedding:
        model: ${OLLAMA_MODELO_EMBEDDINGS:bge-m3}
        # Texto acima do contexto do modelo (8 mil tokens no bge-m3) é cortado pelo Ollama em vez de falhar
        truncate: true
      init:
        # O modelo é baixado por um passo do compose para um volume (ADR 0003, Decisão 2). Aqui nunca baixa sozinho,
        # a não ser que OLLAMA_BAIXAR_MODELO=when_missing (útil só em desenvolvimento)
        pull-model-strategy: ${OLLAMA_BAIXAR_MODELO:never}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORTA:5672}
    username: ${RABBITMQ_USUARIO:condominio}
    password: ${RABBITMQ_SENHA:condominio}
    listener:
      simple:
        # Quantos arquivos são lidos ao mesmo tempo; cada um pega uma mensagem por vez
        concurrency: ${RAG_PARALELISMO:2}
        prefetch: 1
        # Erro inesperado (ex.: fila do backend fora do ar): tenta de novo e depois manda para a fila .erro
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s

server:
  port: ${PORTA:8082}

rag:
  grpc:
    port: ${GRPC_PORTA:9091}
  indexing:
    # Arquivos indexados ao mesmo tempo; fila própria, não disputa com a leitura contábil
    parallelism: ${RAG_PARALELISMO_INDEXACAO:1}
  embeddings:
    # Prazo de cada chamada ao Ollama; fora do ar = erro legível em segundos, sem travar a fila
    connect-timeout-seconds: ${OLLAMA_TIMEOUT_CONEXAO:5}
    timeout-seconds: ${OLLAMA_TIMEOUT:300}
    # Trechos por chamada ao Ollama
    batch-size: 16
  storage:
    type: local
    folder: ${PASTA_DADOS:./dados}
  reader:
    url: ${LEITOR_URL:http://localhost:8090}
    timeout-seconds: 300
  assistant:
    # Par de chaves do rag (ADR 0003, Sub-decisão 4.1 A). Sem arquivo e sem permissão de gerar, o chat fica
    # indisponível: ListarProvedores vem sem chave pública e Perguntar recusa com FAILED_PRECONDITION.
    private-key-file: ${RAG_CHAVE_PRIVADA_ARQUIVO:}
    generate-dev-key: ${RAG_GERAR_CHAVE_DEV:false}
    # Provedor das respostas; um cliente novo por pergunta, com a chave do condomínio
    anthropic-url: ${RAG_ANTHROPIC_URL:https://api.anthropic.com}
    provider-timeout-seconds: ${RAG_PRAZO_PROVEDOR:90}
    provider-attempts: ${RAG_TENTATIVAS_PROVEDOR:2}
    # Sem streaming nesta versão (o fluxo manda andamento, não texto parcial)
    max-tokens: ${RAG_MAX_TOKENS:16000}
    # output_config.effort: low, medium, high, xhigh, max. Vazio = não enviar (o Haiku 4.5 não aceita effort)
    effort: ${RAG_ESFORCO:medium}
    tool-rounds: ${RAG_VOLTAS_FERRAMENTAS:6}
    max-history: 10
    # Ferramentas numéricas: gRPC Consulta do backend, com o mesmo token do usuário
    api-grpc: ${BACKEND_GRPC:api:9090}
    tool-timeout-seconds: ${RAG_PRAZO_FERRAMENTA:20}
    # RF-04.15 / ADR 0003 Q11: só entre aspas de citação literal
    conduct-terms: ${RAG_TERMOS_CONDUTA:desvio,desviou,fraude,fraudou,roubo,roubou,culpa,culpado}

# Catálogo de provedores e modelos de IA (RF-09.6, ADR 0003, Decisão 1). Só configuração: acrescentar provedor de um
# tipo já implementado não é código. Preços em dólar por milhão de tokens, texto decimal com ponto.
condominio:
  ai:
    providers:
      - code: anthropic
        name: "Anthropic (Claude)"
        type: anthropic
        function: ANSWERS
        local: false
        requires-key: true
        dimension: 0
        models:
          - id: claude-sonnet-5-5
            name: "Claude Sonnet 5.5"
            is-default: true
            input-price-per-million-usd: "2.00"
            output-price-per-million-usd: "10.00"
          - id: claude-haiku-4-5
            name: "Claude Haiku 4.5"
            is-default: false
            input-price-per-million-usd: "1.00"
            output-price-per-million-usd: "5.00"
      - code: ollama-local
        name: "Ollama local (nesta instalação)"
        type: ollama
        function: EMBEDDINGS
        local: true
        requires-key: false
        dimension: 1024
        models:
          - id: bge-m3
            name: "BGE-M3 (multilíngue, 1024 dimensões)"
            is-default: true
            input-price-per-million-usd: "0"
            output-price-per-million-usd: "0"

management:
  endpoints:
    web:
      exposure:
        include: health,info
